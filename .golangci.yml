version: "2"

# The files behind these build tags are loaded, so every lint run (make lint,
# make check, CI, each of which lints every release target with cgo off and the
# host natively) lints the e2e tests in test/e2e and the integration tests,
# which run with real read-only cloud credentials. What applies to them:
#   - gosec runs on every _test.go file except for G204 and G304, which tests
#     trip by design (see the exclusion rules at the end of this file).
#   - test/e2e has a depguard rule of its own, e2e-is-black-box, and the
#     application layer's tests have the strict app-tests-use-fakes-not-adapters.
#     Every other depguard rule leaves _test.go files out, so an integration
#     test elsewhere gets no depguard rule.
#   - forbidigo's cloud-read-only group checks them like any other file,
#     which matters most here, where the credentials are real.
# e2e and integration are the only custom build tags. Never negate them: lint
# always sets both, so a file behind !e2e or !integration would never be
# linted, and test/lint refuses such a build constraint.
run:
  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usetesting
  settings:
    # Architecture rules. These are the dependency rule from docs/architecture.md,
    # enforced by the linter so no agent (or human) can quietly break the layering.
    depguard:
      rules:
        # File globs end in /** rather than /**/*.go: a /**/ needs at least one
        # directory, so the *.go form misses a file placed directly in
        # internal/domain or internal/app.
        #
        # The domain does no I/O (docs/architecture.md), and everything that
        # may import it, the application layer and the adapters, would reach
        # I/O through it unseen. So its imports are a strict allow list: the
        # domain packages and the standard packages it uses, each ending in $
        # so it covers that package only. Any other import fails lint. $gostd
        # is not used: depguard expands it to one prefix entry per top-level
        # directory of GOROOT/src (net, os, unsafe, ...), which allows every
        # standard package, the ones that do I/O and the ones added in later
        # Go releases included, so a deny list would have to keep up with
        # every release. net/netip and net/url parse values and open no
        # connection; net itself is not allowed. math/big holds the exact
        # money of estimates (ADR 0027) and does no I/O. Add a standard package only
        # when the domain needs it, never one that does I/O.
        #
        # The domain packages are named one by one as well, not by the prefix
        # internal/domain/. make lint runs on ./..., which skips testdata
        # directories and directories whose name starts with _, so a package
        # there is never linted: a prefix entry would let a domain package
        # import one that does I/O. A new domain package needs an entry here,
        # in app-uses-ports-not-adapters and in cli-gets-adapters-from-cmd.
        #
        # An allowed package can still hold a function that does I/O or reads
        # the clock (fmt.Println, time.Now), which an import rule cannot see.
        # The forbidigo group domain-is-pure, below, refuses those calls.
        #
        # test/architecture reads every strict rule's files: and allow: lists
        # and checks the rule package by package (ADR 0012): write a strict
        # rule's directories as "**/<dir>/**", whole directories it takes out
        # as "!**/<dir>/**", and "!$test" unless it holds test files; a rule
        # for the test files of a directory alone as the pair
        # "**/<dir>/**/*_test.go" and "**/<dir>/*_test.go"; or give it a
        # reasoned skip there. An allow entry without $ is a prefix.
        #
        # test/architecture also pins every rule here whole
        # (TestDepguardRulesArePinned, issue #80): list-mode, files, allow and
        # the pkg of each deny entry. A change to any rule also updates
        # pinnedDepguardRules in test/architecture/depguardpin_test.go.
        domain-is-pure:
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - errors$
            - fmt$
            - math/big$
            - net/netip$
            - net/url$
            - slices$
            - strconv$
            - strings$
            - time$
            - unicode$
            - unicode/utf8$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
          # The allow list already refuses every package below; these entries
          # only say why. They have no $, so each also covers its subpackages:
          # os covers os/exec, os/signal and os/user, and net covers net/http.
          deny:
            - pkg: os
              desc: the domain has no OS access (files, environment, processes, signals); an adapter behind a port does
            - pkg: net
              desc: the domain has no network access; an adapter behind a port does (net/netip and net/url are allowed)
            - pkg: syscall
              desc: the domain makes no system calls
            - pkg: unsafe
              desc: the domain needs no unsafe code
            - pkg: plugin
              desc: the domain loads no code at run time
            - pkg: runtime/cgo
              desc: the domain calls no C code
        # The application layer may import only what is listed under allow: the
        # domain and the few standard-library packages the use case needs. An
        # entry ending in $ matches that package only, not its subpackages. Add
        # a package only when the use case needs it, never one that does I/O.
        # The domain packages are named one by one, each ending in $, for the
        # reason given at domain-is-pure: a prefix entry would also admit a
        # package under testdata or a _ directory, which make lint never visits.
        app-uses-ports-not-adapters:
          list-mode: strict
          files:
            - "**/internal/app/**"
            - "!$test"
          allow:
            - context$
            - errors$
            - fmt$
            - io$
            - strings$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
          deny: &app-deny
            - pkg: github.com/timothymamo/shift2eu/internal/adapter
              desc: the application layer depends on ports it declares; wire adapters in cmd/shift2eu
            - pkg: github.com/timothymamo/shift2eu/internal/cli
              desc: the application layer must not know about its driving adapter
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: cloud SDKs belong in internal/adapter/source/aws
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: cloud SDKs belong in internal/adapter/source/azure
            - pkg: cloud.google.com/go
              desc: cloud SDKs belong in internal/adapter/source/gcp
            - pkg: google.golang.org/api
              desc: cloud SDKs belong in internal/adapter/source/gcp
            # The assess path needs no network, process or OS access in the
            # application layer: adapters do I/O behind the ports. Both rules
            # that share this list are strict, app-uses-ports-not-adapters for
            # the layer's production files and app-tests-use-fakes-not-adapters
            # for its tests (issue #144), so each refuses everything its allow
            # list leaves out, and for them the entries below only say why:
            # the standard packages known to reach files, sockets, processes or
            # shared libraries. Every net/* package that can open a connection
            # (and crypto/tls, whose Dial opens one), os and os/exec, os/user
            # and os/signal, syscall (which also covers syscall/js) and plugin;
            # and the packages that do I/O without importing os or net:
            # io/ioutil, log/syslog, text/template and html/template
            # (ParseFiles, ParseGlob), archive/zip (OpenReader), every debug/*
            # package (elf.Open, buildinfo.ReadFile, ...), go/build, go/importer,
            # go/parser (ParseFile, ParseDir), mime/multipart (ReadForm writes
            # temporary files), runtime/coverage (WriteMetaDir,
            # WriteCountersDir) and runtime/debug (WriteHeapDump,
            # SetCrashOutput); and unsafe, whose //go:linkname would reach a
            # denied function without importing its package. The list need not
            # be complete, since the allow lists refuse a package it misses,
            # one added to Go later included: test/lint,
            # TestAppTestsUseFakesNotAdaptersProbe, pins that these stay
            # refused (issues #119 and #144). No deny entry may name a package
            # an allow list allows (net/url and net/netip are pure and allowed),
            # since depguard then decides by entry length; test/architecture's
            # AllowList refuses that.
            #
            # depguard prefix-matches, so net/http also covers
            # net/http/httptest and every other net/http/* package, net/rpc
            # covers net/rpc/jsonrpc and debug/ covers every debug/* package.
            # net$, os$ and go/build$ end in $ and cover that package only
            # (go/build/constraint is pure): depguard compares an import with
            # the one entry that sorts nearest before it, so a bare net or os
            # would be a strict prefix of net/http or os/exec and never decide
            # an import under them, so the subpackages that need a reason are
            # named one by one, and no bare log, debug or runtime entry stands
            # above log/syslog, debug/ or runtime/debug (test/architecture,
            # TestDepguardEntriesShadowNothing).
            - pkg: net/http
              desc: the application layer makes no HTTP calls; an adapter behind a port does
            - pkg: net/rpc
              desc: the application layer makes no RPC calls; an adapter behind a port does
            - pkg: net/smtp
              desc: the application layer sends no mail; an adapter behind a port does
            - pkg: net/mail
              desc: the application layer parses no mail; an adapter behind a port does
            - pkg: net/textproto
              desc: the application layer speaks no network protocol; an adapter behind a port does
            - pkg: crypto/tls
              desc: the application layer opens no TLS connections; an adapter behind a port does
            - pkg: net$
              desc: the application layer has no network access; an adapter behind a port does
            - pkg: os/exec
              desc: the application layer starts no processes
            - pkg: os/user
              desc: the application layer looks up no OS users; the driving adapter passes what it needs through the ports
            - pkg: os/signal
              desc: the application layer handles no OS signals; the driving adapter cancels the context instead
            - pkg: os$
              desc: the application layer has no OS access (files, environment); the driving adapter passes what it needs through the ports
            - pkg: syscall
              desc: the application layer makes no system calls (files, sockets, processes); an adapter behind a port does
            - pkg: plugin
              desc: the application layer loads no code at run time; the composition root wires everything it needs
            - pkg: io/ioutil
              desc: the application layer reads and writes no files; an adapter behind a port does
            - pkg: log/syslog
              desc: the application layer writes no system log; it returns errors to the driving adapter
            - pkg: text/template
              desc: the application layer renders no templates and reads no template files; a report adapter renders
            - pkg: html/template
              desc: the application layer renders no templates and reads no template files; a report adapter renders
            - pkg: archive/zip
              desc: the application layer opens no archives; an adapter behind a port does
            - pkg: debug/
              desc: the application layer reads no binaries or build metadata; internal/version holds what the build records
            - pkg: go/build$
              desc: the application layer inspects no Go source trees on disk
            - pkg: go/importer
              desc: the application layer loads no compiled Go packages from disk
            - pkg: runtime/debug
              desc: the application layer reads no build info and writes no heap dumps or crash output; internal/version holds what the build records
            - pkg: go/parser
              desc: the application layer parses no Go source files (ParseFile and ParseDir read them from disk)
            - pkg: mime/multipart
              desc: the application layer reads no multipart forms (ReadForm writes temporary files); an adapter behind a port does
            - pkg: runtime/coverage
              desc: the application layer writes no coverage data (WriteMetaDir and WriteCountersDir write files)
            - pkg: unsafe
              desc: the application layer and its tests need no unsafe code; //go:linkname would reach functions denied here
        # The application layer's tests use fakes, not adapters, and do no
        # I/O. They are left out of the strict rule above because they also
        # need testing, go-cmp and internal/testutil, so they have a strict
        # allow list of their own (issue #144): the application package under
        # test, the domain packages, internal/testutil, go-cmp, and exactly
        # the standard packages the layer's tests import: bytes, context (the
        # use case takes one), errors, io, slices, strings, sync (a fake's
        # mutex) and testing. They are a subset of the domain's pure packages
        # (the allow list of domain-is-pure) plus a few named extras, each with
        # its reason, and test/architecture's
        # TestAppTestsRuleAllowsOnlyPurePackagesAndItsExtras keeps them so.
        # The domain's fmt, time, net/netip, net/url, strconv, unicode and
        # unicode/utf8 are deliberately left out: no test needs them, and fmt
        # and time can print, scan, read zoneinfo files and the clock, which
        # no forbidigo group refuses in a test. Every entry ends in $, for the
        # reason given at domain-is-pure. Anything else fails lint, a standard
        # package added to Go later included. Add a package only when a test
        # needs it, never one that does I/O. These rules are a guardrail on
        # imports and named calls, not a sandbox: the I/O they leave an
        # application test is what internal/testutil can do through os (file
        # access, the golden files), fmt, time and flag, whose own imports
        # testutil-imports holds, and what testing itself offers (t.TempDir,
        # test output; tests-no-process-state refuses t.Setenv and t.Chdir).
        # No import or call rule can refuse a hard-coded path, so a new file
        # path or os, fmt, time or flag call in internal/testutil is a
        # widening a reviewer must read. The deny list is the one
        # app-uses-ports-not-adapters writes, shared through *app-deny: under
        # a strict list it only says why.
        #
        # The files: entries are the _test.go files of internal/app and of the
        # directories below it, and no production file, which
        # app-uses-ports-not-adapters holds. test/architecture reads this pair
        # of globs as the test files of internal/app and holds the test
        # imports of every package under it to this allow list, package by
        # package for every release target (ADR 0012).
        app-tests-use-fakes-not-adapters:
          list-mode: strict
          files:
            - "**/internal/app/**/*_test.go"
            - "**/internal/app/*_test.go"
          allow:
            - bytes$
            - context$
            - errors$
            - io$
            - slices$
            - strings$
            - sync$
            - testing$
            - github.com/google/go-cmp/cmp$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
            - github.com/timothymamo/shift2eu/internal/testutil$
          deny: *app-deny
        # The test helpers (issue #144, the audit's M-1 and the review's S1).
        # Application tests may import internal/testutil, and its helpers read
        # and write golden files, the one I/O those tests are allowed. Its own
        # imports are therefore a strict allow list as well: exactly the
        # packages its files import today, each ending in $. Without it a
        # helper could reach the network (net/http), start a program
        # (os/exec) or read the environment and hand every application test
        # that I/O with lint green. The files: entry has no !$test, so the
        # helpers' own _test.go files are held too. An import rule sees no
        # call, so the forbidigo group testutil-no-env refuses the environment
        # reads, directory lookups and process start that os alone allows.
        # A new import needs an entry here and in test/architecture's pin in
        # the same commit.
        testutil-imports:
          list-mode: strict
          files:
            - "**/internal/testutil/**"
          allow:
            - bytes$
            - encoding/json$
            - flag$
            - fmt$
            - maps$
            - math$
            - os$
            - path/filepath$
            - reflect$
            - regexp$
            - slices$
            - strconv$
            - strings$
            - testing$
            - time$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/testutil$
        # The driving adapter gets its adapters from the composition root
        # through cli.Deps and never constructs one, so it imports only the
        # application, the domain, the build metadata and the standard
        # packages it needs today. The rule is a strict allow list (issue
        # #152), each entry ending in $ so it covers that package only, for
        # the reason given at domain-is-pure: a prefix entry would also admit
        # a package under testdata or a _ directory, which make lint never
        # visits. Before #152 it allowed $gostd and denied a list beside it,
        # so a composition root, which may not start a process or take a
        # pointer apart itself, could hand the call to the CLI through a
        # package nobody had thought to deny (unsafe among them). Now
        # syscall, unsafe, os/exec, plugin, the network and every other
        # package the CLI does not import today are refused because nothing
        # here names them. os is named because the CLI reads the inventory a
        # user names (--inventory) and creates the report the user asked for
        # (--output); the forbidigo group cli-no-env-or-process refuses the
        # calls of os that reach the environment or start a process. A new
        # standard or module package needs an entry here; os/signal and
        # syscall need a reason, as they reach signals and system calls.
        # The adapter deny entry stays for its message: the allow list
        # refuses an adapter already.
        cli-gets-adapters-from-cmd:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            - "!$test"
          allow:
            - bytes$
            - context$
            - errors$
            - flag$
            - fmt$
            - io$
            - io/fs$
            - maps$
            - os$
            - path/filepath$
            - slices$
            - strconv$
            - strings$
            - unicode$
            - unicode/utf8$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
            - github.com/timothymamo/shift2eu/internal/version$
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/adapter
              desc: the CLI gets its adapters through cli.Deps; construct them in cmd/shift2eu
        # internal/version is the build metadata: three variables the release
        # sets with -X and the one function that formats them. Both driving
        # adapters may import it, so without a rule of its own it would be a
        # delegation path (issue #152): a root hands the work to the CLI, the
        # CLI calls internal/version, and a package nobody had thought to
        # deny would do there what the root and the CLI may not. The rule is
        # a strict allow list of what the package imports today, fmt, each
        # entry ending in $ for the reason given at domain-is-pure; os,
        # syscall, os/exec, unsafe and everything else are refused because
        # nothing here names them. Its test is held by the test rules.
        version-is-build-metadata:
          list-mode: strict
          files:
            - "**/internal/version/**"
            - "!$test"
          allow:
            - fmt$
        # The composition root constructs the adapters, hands them to the CLI
        # and does nothing else (issue #101). So its imports are a strict
        # allow list: the module's own packages and the standard packages it
        # needs today, each ending in $ so it covers that package only. Any
        # other import, a logging library or an HTTP client included, fails
        # lint; add a standard package only when cmd/shift2eu needs it, and a
        # third-party one never: it belongs in an adapter behind a port.
        #
        # The module path is the one prefix entry, so cmd/shift2eu may import
        # every package of the module, a new adapter included, without an
        # entry here; what each of those may import is held by its own rule.
        # A module package under testdata or a _ directory is never linted,
        # but cmd/shift2eu constructing one would show in review. The cloud SDKs
        # are denied as well, though the allow list already refuses them:
        # a cloud SDK lives only in its provider's adapter, which cmd/shift2eu
        # constructs without importing the SDK itself.
        #
        # The rule holds cmd/shift2eu only. A glob segment matches no "/", so
        # **/cmd/shift2eu/** does not match a sibling such as cmd/shift2eu-server,
        # which has a sibling rule of its own, server-composition-root.
        composition-root:
          list-mode: strict
          files:
            - "**/cmd/shift2eu/**"
            - "!$test"
          allow:
            - context$
            - os$
            - os/signal$
            - syscall$
            - github.com/timothymamo/shift2eu/
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: a cloud SDK lives only in its provider's adapter
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: a cloud SDK lives only in its provider's adapter
            - pkg: cloud.google.com/go
              desc: a cloud SDK lives only in its provider's adapter
            - pkg: google.golang.org/api
              desc: a cloud SDK lives only in its provider's adapter
        # The HTTP API's composition root (PRD #103, ADR 0019), the sibling of
        # composition-root and written the same way: it constructs the
        # adapters, hands them to internal/httpapi and runs the http.Server
        # around it (flags, the token, timeouts, the access log, the graceful
        # shutdown). Its imports are a strict allow list of the module's own
        # packages and the standard packages it needs, each ending in $; no
        # third-party package, no cloud SDK and no os/exec, which
        # TestServerPathHasNoCloudSDKOrProcess (test/e2e) also pins for the
        # whole dependency tree. Add a standard package only when
        # cmd/shift2eu-server needs it, beside the pin in test/architecture.
        server-composition-root:
          list-mode: strict
          files:
            - "**/cmd/shift2eu-server/**"
            - "!$test"
          allow:
            - context$
            - errors$
            - flag$
            - fmt$
            - io$
            - log$
            - math$
            - net$
            - net/http$
            - os$
            - os/signal$
            - runtime$
            - runtime/debug$
            - slices$
            - strconv$
            - strings$
            - sync$
            - syscall$
            - time$
            - github.com/timothymamo/shift2eu/
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: a cloud SDK lives only in its provider's adapter; the server takes inventory documents, never credentials (ADR 0019)
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: a cloud SDK lives only in its provider's adapter; the server takes inventory documents, never credentials (ADR 0019)
            - pkg: cloud.google.com/go
              desc: a cloud SDK lives only in its provider's adapter; the server takes inventory documents, never credentials (ADR 0019)
            - pkg: google.golang.org/api
              desc: a cloud SDK lives only in its provider's adapter; the server takes inventory documents, never credentials (ADR 0019)
        # Adapters are constructed only in the composition roots, cmd/shift2eu
        # and cmd/shift2eu-server (ADR 0019), which the rule excludes. No other
        # production package, adapters included, imports an adapter: one
        # adapter never builds or calls another, and internal/config, the CLI
        # or the HTTP API get adapters only through what their composition
        # root passes in. An adapter's
        # tests may import its contract suite (contract-suites-only-in-tests).
        # Helpers shared by adapters live in internal/adapter/internal/ (the
        # JSON decoder jsondoc, ADR 0009): they build no adapter, so adapters may
        # import them. Each helper under internal/adapter/internal/ is named by
        # its own allow entry, ending in $ so it covers that package only. An
        # allow entry is longer than the deny entry, so it wins for that
        # package only; Go's internal rule keeps everything outside
        # internal/adapter from importing them. The shared target snapshot
        # reader (ADR 0007), under internal/adapter/target, builds no adapter
        # either: it parses bytes, so target adapters may import it. Its
        # snapshot$ entry is exact too. An allow entry holds for every file the rule covers, so on its
        # own it would let any package import the reader;
        # snapshot-reader-only-in-targets keeps it to the packages under
        # internal/adapter/target.
        #
        # A new helper under internal/adapter/internal/ must be named here
        # before any adapter can import it, and adapter-helpers-do-no-io holds
        # it to no I/O unless it is excluded from that rule by name. No prefix
        # entry: make lint runs on ./..., which skips testdata directories and
        # directories whose name starts with _, so a helper placed there is
        # never linted, and a prefix entry would let every adapter import it
        # (issues #49 and #50).
        #
        # The deny list names each subtree of internal/adapter (internal/,
        # report/, request/, source/, target/) rather than internal/adapter/
        # once. depguard (v2.2.1) compares an import only with the one entry
        # that sorts nearest before it, as a prefix unless the entry ends in
        # $, so no entry may be a strict prefix of another: with internal/
        # adapter/ beside internal/adapter/internal/, every adapter under
        # report/, request/, source/ or target/ sorts after internal/, was
        # compared with that entry alone, and the rule reported nothing
        # (issue #119). Siblings never shadow each other. An entry ending in
        # / does not cover the package at its own root, so report$,
        # request$, source$ and target$ deny a package placed directly in
        # each subtree (internal/ has none, its helpers are named one by
        # one above); an exact entry shadows nothing. A new subtree
        # under internal/adapter would match no entry and escape the rule, so
        # test/architecture fails on an entry of internal/adapter that is not
        # a directory with a deny entry of its own here
        # (TestAdaptersBuiltInCmdNamesEveryAdapterSubtree), and on any entry
        # that is a strict prefix of another in the same list
        # (TestDepguardEntriesShadowNothing). test/lint runs depguard on a
        # probe that imports an adapter from each subtree and each subtree's
        # root (TestAdaptersBuiltInCmdProbe).
        #
        # The deny entry for internal/adapter/internal/ gives the reason for a
        # helper not named here. Every adapter that must stay offline also
        # names the helpers it imports, each ending in $, in a
        # strict rule of its own: inventory-file-reader-reads-one-file,
        # request-decoders-parse-bytes, target-snapshot-reader-parses-bytes,
        # embedded-snapshot-targets-stay-offline and reporters-stay-offline.
        # The live sources (aws, azure, gcp; doc.go stubs today) need the
        # network through their SDK, so they share the strict allow list
        # cloud-adapters-reach-the-cloud-through-the-sdk (ADR 0014), which
        # names no helper under internal/adapter/internal/ at all.
        adapters-are-built-in-cmd:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/shift2eu/**"
            - "!**/cmd/shift2eu-server/**"
          allow:
            - github.com/timothymamo/shift2eu/internal/adapter/internal/jsondoc$
            - github.com/timothymamo/shift2eu/internal/adapter/target/snapshot$
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/internal/
              desc: an adapter imports only the shared helpers named in adapters-are-built-in-cmd; name a new helper there first (a helper under a testdata or _ directory is never linted) (ADR 0009)
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/report/
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/report$
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/request/
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/request$
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/source/
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/source$
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/target/
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/target$
              desc: adapters are constructed only in cmd/shift2eu and cmd/shift2eu-server
        # Dependencies point inwards only: the composition root imports the
        # driving adapter, and nothing imports the composition root. So no
        # production package other than cmd/shift2eu and the CLI's own packages
        # imports internal/cli or cmd. The rule covers every such package,
        # not only the adapters: an import rule sees direct imports only, so
        # a rule on the adapters alone would let an adapter reach the CLI
        # through a package outside internal/adapter that imports it.
        # internal/cli$ is the CLI itself and internal/cli/ every package
        # under it; a package whose path only starts with internal/cli, such
        # as internal/client, is not covered. cmd$ is a library package
        # placed directly in cmd, and cmd/ every package under cmd, a library
        # package added there later included; Go already refuses an import of
        # a main package such as cmd/shift2eu.
        cli-and-cmd-imported-only-by-cmd:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/shift2eu/**"
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/cli$
              desc: only cmd/shift2eu imports the driving adapter; share what both need through the application or the domain
            - pkg: github.com/timothymamo/shift2eu/internal/cli/
              desc: only cmd/shift2eu imports the driving adapter; share what both need through the application or the domain
            - pkg: github.com/timothymamo/shift2eu/cmd$
              desc: nothing imports the composition root; cmd/shift2eu imports the rest
            - pkg: github.com/timothymamo/shift2eu/cmd/
              desc: nothing imports the composition root; cmd/shift2eu imports the rest
        # The HTTP API (ADR 0019) is a driving adapter like internal/cli: it gets
        # its adapters from its composition root, cmd/shift2eu-server, through
        # httpapi.Deps and never constructs one, so it imports only the
        # application, the domain, the build metadata and the standard
        # packages named here. Unlike cli-gets-adapters-from-cmd it names
        # each standard package, ending in $, rather than allowing $gostd: so
        # test/architecture holds the package to this list package by package
        # for every release target (ADR 0012), and a package that reads files
        # or the environment, starts a process or listens (os, os/exec,
        # syscall, net$) stays out. Listening, flags, the environment and the
        # access log belong to cmd/shift2eu-server. The project packages are
        # named one by one, each ending in $, for the reason given at
        # domain-is-pure. Add a standard package only when serving needs it.
        #
        # An allowed package can still hold a function that reaches further
        # than the rule means, which an import rule cannot see: the handler
        # must not call http.ListenAndServe, http.Get or fmt.Print*, and logs
        # nothing. Review holds that line.
        #
        # The allow list already refuses every package below; these entries
        # only say why.
        httpapi-gets-adapters-from-cmd:
          list-mode: strict
          files:
            - "**/internal/httpapi/**"
            - "!$test"
          allow:
            - bytes$
            - context$
            - crypto/sha256$
            - crypto/subtle$
            - encoding/json$
            - errors$
            - fmt$
            - io$
            - maps$
            - mime$
            - net/http$
            - net/url$
            - runtime$
            - slices$
            - sort$
            - strconv$
            - strings$
            - sync$
            - time$
            - unicode/utf8$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
            - github.com/timothymamo/shift2eu/internal/version$
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/adapter
              desc: the HTTP API gets its adapters through httpapi.Deps; construct them in cmd/shift2eu-server
            - pkg: github.com/timothymamo/shift2eu/internal/cli
              desc: the HTTP API and the CLI are separate driving adapters; share what both need through the application or the domain
            - pkg: github.com/timothymamo/shift2eu/cmd
              desc: nothing imports the composition root
            - pkg: os
              desc: the HTTP API reads no file and no environment; cmd/shift2eu-server passes what it needs through options
            - pkg: syscall
              desc: the HTTP API makes no system call
            - pkg: plugin
              desc: the HTTP API loads no code at run time
            - pkg: unsafe
              desc: the HTTP API needs no unsafe code
        # Only the HTTP API's composition root, cmd/shift2eu-server, imports
        # internal/httpapi (ADR 0019). cmd/shift2eu is covered too, on purpose:
        # the CLI binary stays offline (PRD #103, the separate-binary
        # decision), and TestAssessPathHasNoNetworkOrCloudSDK in test/e2e fails
        # if it depends on net/http at all; this rule names the reason at the
        # import. Test files elsewhere are covered too; only test/apiparity is
        # left out, because its offline parity test wires the real adapters
        # into both driving adapters, as a composition root would. The
        # package's own tests are exempt with the package.
        httpapi-imported-only-by-the-server:
          list-mode: lax
          files:
            - "$all"
            - "!**/test/apiparity/**"
            - "!**/cmd/shift2eu-server/**"
            - "!**/internal/httpapi/**"
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/httpapi$
              desc: only cmd/shift2eu-server imports the HTTP API; cmd/shift2eu stays offline (ADR 0019)
            - pkg: github.com/timothymamo/shift2eu/internal/httpapi/
              desc: only cmd/shift2eu-server imports the HTTP API; cmd/shift2eu stays offline (ADR 0019)
        # Only the packages under internal/adapter/target import the shared
        # snapshot reader (ADR 0007): the target adapters, their contract suite
        # and the reader itself. A source adapter, a reporter, internal/config
        # or the CLI has no snapshot to read. cmd/shift2eu is covered too: it
        # constructs target adapters and gets each catalog through them, so it
        # never parses a snapshot itself. The glob ends in /** so it also
        # excludes the files directly in internal/adapter/target.
        snapshot-reader-only-in-targets:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/adapter/target/**"
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/target/snapshot
              desc: only target adapters read a catalog snapshot (ADR 0007)
        # The shared target snapshot reader parses the bytes a target adapter
        # embeds (ADR 0007): it opens no file, makes no network call and
        # imports no adapter, so every target that reads its snapshot through
        # it stays offline. It may import only what is listed under allow.
        # The glob ends in /** so it also matches the files directly in the
        # package directory. Add a standard package only when parsing needs
        # it, never one that does I/O. It decodes JSON only through jsondoc
        # (ADR 0009), which jsondoc-parses-bytes holds to parsing packages, so
        # encoding/json is not listed. The project packages are named one by
        # one, each ending in $, so the reader gets only the project packages
        # it uses. domain-is-pure keeps I/O out of every domain package.
        #
        # An allowed package can still hold a function that does I/O, which an
        # import rule cannot see. fmt$ is allowed for fmt.Errorf and
        # fmt.Sprintf, and time$ for time.Parse; the reader must not call
        # fmt.Print* (which writes to stdout) or time.LoadLocation (which
        # reads zoneinfo files and the ZONEINFO environment variable). Review
        # holds that line.
        target-snapshot-reader-parses-bytes:
          list-mode: strict
          files:
            - "**/internal/adapter/target/snapshot/**"
            - "!$test"
          allow:
            - errors$
            - fmt$
            - strconv$
            - strings$
            - time$
            - github.com/timothymamo/shift2eu/internal/adapter/internal/jsondoc$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
        # Every target adapter reads its embedded snapshot through the shared
        # reader (ADR 0007), never with encoding/json of its own, which matches
        # keys ignoring case, keeps the last of a repeated key, reads null or a
        # missing field as empty and has no size cap. The deny entry has no $,
        # so it also covers encoding/json/v2 and encoding/json/jsontext. The
        # globs cover every file under internal/adapter/target that is not a
        # _test.go file: every target adapter, a target added later included,
        # the contract suite targettest, and the reader itself, which decodes
        # through jsondoc (ADR 0009). A JSON decode in targettest would be the
        # second snapshot reader ADR 0007 rules out. Only _test.go files may
        # decode JSON.
        target-adapters-read-snapshots-through-the-reader:
          list-mode: lax
          files:
            - "**/internal/adapter/target/**"
            - "!$test"
          deny:
            - pkg: encoding/json
              desc: read the snapshot through internal/adapter/target/snapshot, which decodes through jsondoc (ADR 0007, ADR 0009)
        # The helpers adapters share live in internal/adapter/internal/, and
        # adapters-are-built-in-cmd names each one an adapter may import; an
        # adapter that must stay offline also names the ones it imports in its
        # own allow list. So a helper does no I/O unless that is decided:
        # every package there, a helper added later included, may import only
        # what is listed under allow, the standard packages the helpers use
        # that do no I/O and the project packages they use, each ending in $
        # so it covers that package only. Add a standard
        # package only when a helper needs it, never one that does I/O. A
        # helper that needs I/O is a decision of its own: it gets a strict
        # rule of its own, its directory is excluded here by name, and no
        # adapter that must stay offline names it. A helper may also have a
        # tighter rule of its own, as jsondoc has (jsondoc-parses-bytes); a
        # file must pass every rule that covers it, so loosening that rule
        # does not loosen this one. The glob ends in /** so it also matches
        # the files directly in each helper's directory.
        #
        # make lint runs on ./..., which skips testdata directories and
        # directories whose name starts with _, so a helper placed there is
        # never linted, by this rule or any other. That is why
        # adapters-are-built-in-cmd names each helper, ending in $, and an
        # adapter that must stay offline names each helper it imports in a
        # strict rule of its own, rather than relying on this rule alone.
        #
        # An allowed package can still hold a function that does I/O, which an
        # import rule cannot see: fmt$ is allowed for fmt.Errorf and
        # fmt.Sprintf, and a helper must not call fmt.Print* (which writes to
        # stdout). Review holds that line.
        #
        # The allow list already refuses every package below; these entries
        # only say why. They have no $, so each also covers its subpackages:
        # os covers os/exec, os/signal and os/user, and net covers net/http.
        adapter-helpers-do-no-io:
          list-mode: strict
          files:
            - "**/internal/adapter/internal/**"
            - "!$test"
          allow:
            - bytes$
            - encoding/json$
            - errors$
            - fmt$
            - io$
            - slices$
            - strconv$
            - strings$
            - unicode$
            - unicode/utf16$
            - unicode/utf8$
            - github.com/timothymamo/shift2eu/internal/domain/text$
          deny:
            - pkg: io/fs
              desc: a shared adapter helper does no I/O; one that reads files needs a rule of its own
            - pkg: io/ioutil
              desc: a shared adapter helper does no I/O; one that reads files needs a rule of its own
            - pkg: net
              desc: a shared adapter helper makes no network call; one that does needs a rule of its own
            - pkg: os
              desc: a shared adapter helper reads no file and no environment; one that does needs a rule of its own
            - pkg: plugin
              desc: a shared adapter helper loads no code
            - pkg: runtime/cgo
              desc: a shared adapter helper calls no C code
            - pkg: syscall
              desc: a shared adapter helper makes no system call
            - pkg: unsafe
              desc: a shared adapter helper needs no unsafe code
        # The strict JSON decoder adapters share (ADR 0009) parses the bytes it
        # is given: it opens no file, makes no network call and imports no
        # adapter, so a reader that decodes through it stays as offline as its
        # own imports allow. It may import only what is listed under allow: the
        # standard packages that parse JSON and text, and the domain's text
        # package, through which every document value reaches an error. The
        # glob ends in /** so it also matches the files directly in the
        # package directory. Add a standard package only when parsing needs
        # it, never one that does I/O; text is named with $ for the reason
        # target-snapshot-reader-parses-bytes gives. fmt$ is allowed for
        # fmt.Errorf and fmt.Sprintf: the decoder must not call fmt.Print*,
        # which an import rule cannot see, so review holds that line.
        jsondoc-parses-bytes:
          list-mode: strict
          files:
            - "**/internal/adapter/internal/jsondoc/**"
            - "!$test"
          allow:
            - bytes$
            - encoding/json$
            - errors$
            - fmt$
            - io$
            - slices$
            - strconv$
            - strings$
            - unicode$
            - unicode/utf16$
            - unicode/utf8$
            - github.com/timothymamo/shift2eu/internal/domain/text$
        # The inventory-file reader reads one local file and decodes it (ADR
        # 0006): it makes no network call, starts no process and imports no
        # adapter, so the source it reads from stays offline by rule. It may
        # import only what is listed under allow: os, io and io/fs to open and
        # read the file, context to stop when asked, errors and fmt for its
        # errors, jsondoc to decode, strconv to read the numbers of a version
        # 2 file (ADR 0025), and the domain packages it builds the
        # inventory with. The glob ends in /** so it also matches the files
        # directly in the package directory. Add a standard package only when
        # reading or parsing the file needs it, never one that reaches the
        # network; the project packages are named one by one, each ending in $,
        # for the reason target-snapshot-reader-parses-bytes gives.
        #
        # It decodes the file only through jsondoc (ADR 0009), never with
        # encoding/json of its own, which matches keys ignoring case, keeps the
        # last of a repeated key and reads an escaped lone surrogate as U+FFFD.
        # The allow list already refuses encoding/json; the deny entry, which
        # has no $ and so also covers encoding/json/v2 and
        # encoding/json/jsontext, only says why. Only the _test.go files may
        # decode JSON.
        #
        # An allowed package can still hold a function that reaches further
        # than the rule means, which an import rule cannot see: os is allowed
        # for os.Open, and the forbidigo group inventoryfile-no-env (issue
        # #152) refuses its environment reads, home, config, cache and temp
        # lookups and os.StartProcess, so cmd/shift2eu cannot hand the reader
        # a call it may not make itself. fmt.Print* is left to review.
        inventory-file-reader-reads-one-file:
          list-mode: strict
          files:
            - "**/internal/adapter/source/inventoryfile/**"
            - "!$test"
          allow:
            - context$
            - errors$
            - fmt$
            - io$
            - io/fs$
            - os$
            - strconv$
            - github.com/timothymamo/shift2eu/internal/adapter/internal/jsondoc$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
          deny:
            - pkg: encoding/json
              desc: decode the inventory file through internal/adapter/internal/jsondoc (ADR 0009)
        # A request decoder parses the bytes of an HTTP API request body it is
        # given (ADR 0019): assessmentrequest decodes POST /v1/assessments. It
        # reads no file, makes no network call, imports no net/http (the
        # HTTP API, internal/httpapi, reads the body) and imports no adapter,
        # internal/cli, internal/httpapi or cmd/. It may import only what is
        # listed under allow: errors and fmt for its errors, and jsondoc, the
        # strict decoder (ADR 0009), named with $ for the reason
        # target-snapshot-reader-parses-bytes gives. The glob ends in /** so it
        # covers every package under internal/adapter/request, and the files
        # directly in each. Add a standard package only when parsing needs it,
        # never one that does I/O. fmt$ is allowed for fmt.Errorf: a decoder
        # must not call fmt.Print*, which an import rule cannot see, so review
        # holds that line.
        #
        # It decodes only through jsondoc, never with encoding/json of its own,
        # which matches keys ignoring case and keeps the last of a repeated
        # key. The allow list already refuses every package below; these
        # entries only say why.
        request-decoders-parse-bytes:
          list-mode: strict
          files:
            - "**/internal/adapter/request/**"
            - "!$test"
          allow:
            - errors$
            - fmt$
            - github.com/timothymamo/shift2eu/internal/adapter/internal/jsondoc$
          deny:
            - pkg: encoding/json
              desc: decode a request body through internal/adapter/internal/jsondoc (ADR 0009)
            - pkg: net
              desc: a request decoder parses the bytes it is given; internal/httpapi reads the body
            - pkg: os
              desc: a request decoder reads no file and no environment
            - pkg: github.com/timothymamo/shift2eu/internal/httpapi
              desc: an adapter never imports a driving adapter; the composition root passes Decode to it
        # A cloud source adapter reaches its cloud only through the SDK calls
        # forbidigo's cloud-read-only group checks (CLAUDE.md rule 1, ADR
        # 0014). Anything else that can call a method by a name forbidigo
        # cannot see, run a program or open a connection would get past that
        # group, and a deny list always misses one (text/template calls a
        # method named in a string). So its imports are a strict allow list:
        # the standard packages an adapter needs that do no such thing, each
        # ending in $; the cloud SDK roots, whose packages forbidigo checks,
        # each ending in / so no look-alike path matches (google.golang.org/api
        # and grpc only for their helper packages); go-cmp as cmp$ and cmp/; and
        # the project packages it may use, named one by one. The rule covers
        # every package under internal/adapter/source but inventoryfile, which
        # has a strict rule of its own, and sourcetest, the contract suite, so
        # a sibling helper (source/awsutil) is held to it too, _test.go files
        # and integration tests included: they run with real credentials. Its
        # tests also get testing, go-cmp, testutil and sourcetest. A helper an
        # adapter shares goes in the adapter's own package, or a subpackage of
        # it named here. Add a standard package only when an adapter needs
        # it, never one that calls by name (reflect, text/template), runs a
        # program (os, os/exec, syscall, golang.org/x/sys) or opens a
        # connection of its own (net, database/sql); add an SDK root only with
        # forbidigo entries that hold its clients to reads.
        #
        # The allow list already refuses every package below; these entries
        # only say why. They have no $, so each also covers its subpackages:
        # os covers os/exec, and net covers net/http (net/url and net/netip are
        # allowed by name, which is longer, so it wins).
        cloud-adapters-reach-the-cloud-through-the-sdk:
          list-mode: strict
          files:
            - "**/internal/adapter/source/**"
            - "!**/internal/adapter/source/inventoryfile/**"
            - "!**/internal/adapter/source/sourcetest/**"
          allow:
            - bytes$
            - context$
            - errors$
            - fmt$
            - iter$
            - log/slog$
            - maps$
            - net/netip$
            - net/url$
            - slices$
            - sort$
            - strconv$
            - strings$
            - sync$
            - time$
            - unicode$
            - unicode/utf8$
            - testing$
            - github.com/aws/aws-sdk-go-v2/
            - github.com/aws/smithy-go$
            - github.com/Azure/azure-sdk-for-go/sdk/
            - cloud.google.com/go/
            - google.golang.org/api/googleapi$
            - google.golang.org/api/iterator$
            - google.golang.org/api/option$
            - google.golang.org/grpc/codes$
            - google.golang.org/grpc/status$
            - github.com/google/go-cmp/cmp$
            - github.com/google/go-cmp/cmp/
            - github.com/timothymamo/shift2eu/internal/adapter/source/aws$
            - github.com/timothymamo/shift2eu/internal/adapter/source/azure$
            - github.com/timothymamo/shift2eu/internal/adapter/source/gcp$
            - github.com/timothymamo/shift2eu/internal/adapter/source/sourcetest$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
            - github.com/timothymamo/shift2eu/internal/testutil$
          deny:
            - pkg: reflect
              desc: reflection calls a method by a name forbidigo cannot see, such as a write; call the SDK client directly
            - pkg: text/template
              desc: a template calls a method by a name forbidigo cannot see, such as a write, and can print a credential
            - pkg: html/template
              desc: a template calls a method by a name forbidigo cannot see, such as a write, and can print a credential
            - pkg: unsafe
              desc: unsafe code, and cgo, whose generated code imports it, can reach a method or a credential no lint rule sees
            - pkg: os
              desc: a cloud CLI run as a program (os.StartProcess, os/exec) bypasses the read-only rule, and a source adapter reads no file or environment of its own; call the SDK
            - pkg: plugin
              desc: code loaded at run time bypasses the read-only rule
            - pkg: syscall
              desc: a raw system call can run a program or open a connection no lint rule sees
            - pkg: golang.org/x/sys
              desc: a raw system call can run a program or open a connection no lint rule sees
            - pkg: runtime/cgo
              desc: C code can run a program or open a connection no lint rule sees
            - pkg: net
              desc: a connection of the adapter's own bypasses the read-only rule; call the SDK
            - pkg: database/sql
              desc: a database connection can write to a cloud database; read the database's metadata through the SDK
        # Cloud SDKs live only in their provider's adapter package (CLAUDE.md,
        # Architecture): an AWS, Azure, GCP, OVHcloud, Scaleway or UpCloud SDK
        # package, and the auth and transport packages they are built on, may
        # be imported only under source/aws, source/azure, source/gcp,
        # target/ovhcloud, target/scaleway and target/upcloud, tests
        # included. Elsewhere, a sibling helper or cmd/shift2eu included, no
        # lint rule would hold its calls to reads.
        cloud-sdks-only-in-provider-adapters:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/adapter/source/aws/**"
            - "!**/internal/adapter/source/azure/**"
            - "!**/internal/adapter/source/gcp/**"
            - "!**/internal/adapter/target/ovhcloud/**"
            - "!**/internal/adapter/target/scaleway/**"
            - "!**/internal/adapter/target/upcloud/**"
          deny:
            - pkg: github.com/aws/
              desc: the AWS SDK belongs in internal/adapter/source/aws
            - pkg: github.com/Azure/
              desc: the Azure SDK belongs in internal/adapter/source/azure
            - pkg: cloud.google.com/go
              desc: the GCP SDK belongs in internal/adapter/source/gcp
            - pkg: google.golang.org/api
              desc: the GCP SDK belongs in internal/adapter/source/gcp
            - pkg: google.golang.org/grpc
              desc: the GCP SDK's transport belongs in internal/adapter/source/gcp
            - pkg: github.com/googleapis/
              desc: the GCP SDK's helpers belong in internal/adapter/source/gcp
            - pkg: golang.org/x/oauth2
              desc: cloud credentials belong to the SDK in a provider's adapter
            - pkg: github.com/ovh/
              desc: the OVHcloud SDK belongs in internal/adapter/target/ovhcloud
            - pkg: github.com/scaleway/
              desc: the Scaleway SDK belongs in internal/adapter/target/scaleway
            - pkg: github.com/UpCloudLtd/
              desc: the UpCloud SDK belongs in internal/adapter/target/upcloud
        # A target that serves an embedded snapshot (ADR 0007) reads only the
        # bytes it embeds with //go:embed: it opens no file, reads no
        # environment, makes no network or system call and loads no code. The
        # snapshot reader is held to the same by
        # target-snapshot-reader-parses-bytes; this rule holds the adapters
        # that embed a snapshot to it. List each such target here. The globs
        # end in /** so they match the files directly in each package and any
        # subpackage added later. A target that calls its provider's API is
        # not listed.
        #
        # An import rule sees direct imports only, so the target's imports are
        # a strict allow list, and the guarantee holds through every package
        # it names: the standard packages it uses, each ending in $ so it
        # covers that package only, and each project package it imports, also
        # ending in $. Name a project package only when a strict rule of its
        # own keeps it offline: target-snapshot-reader-parses-bytes holds the
        # reader, which reaches jsondoc, held by jsondoc-parses-bytes and
        # adapter-helpers-do-no-io, and domain-is-pure holds the domain
        # packages. adapters-are-built-in-cmd names each helper under
        # internal/adapter/internal/ an adapter may import, and this rule
        # admits only the helpers this target imports. A prefix entry would
        # not do, here or there: make lint runs on ./..., which skips
        # testdata directories and directories whose name starts with _, so a
        # helper placed there is never linted, and a prefix would let the
        # target import it.
        #
        # context$ is for the context Catalog takes, embed$ for //go:embed and
        # fmt$ for fmt.Errorf. An allowed package can still hold a function
        # that does I/O, which an import rule cannot see: the target must not
        # call fmt.Print* (which writes to stdout). Review holds that line.
        #
        # The allow list already refuses every package below; these entries
        # only say why. They have no $, so each also covers its subpackages:
        # os covers os/exec, os/signal and os/user, and net covers net/http
        # and net/http/httptest.
        embedded-snapshot-targets-stay-offline:
          list-mode: strict
          files:
            - "**/internal/adapter/target/ovhcloud/**"
            - "**/internal/adapter/target/scaleway/**"
            - "**/internal/adapter/target/upcloud/**"
            - "!$test"
          allow:
            - context$
            - embed$
            - fmt$
            - github.com/timothymamo/shift2eu/internal/adapter/target/snapshot$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/text$
          deny:
            - pkg: io/fs
              desc: an embedded-snapshot target reads only its embedded bytes
            - pkg: io/ioutil
              desc: an embedded-snapshot target reads only its embedded bytes
            - pkg: net
              desc: an embedded-snapshot target makes no network call
            - pkg: os
              desc: an embedded-snapshot target reads no file and no environment
            - pkg: plugin
              desc: an embedded-snapshot target loads no code
            - pkg: syscall
              desc: an embedded-snapshot target makes no system call
            - pkg: unsafe
              desc: an embedded-snapshot target needs no unsafe code
        # A reporter renders an assessment to the io.Writer it is given, and
        # the report's bytes depend only on the assessment and the report
        # metadata (internal/adapter/report/markdown/doc.go). So a reporter
        # reads no file, no environment and no clock, and sends nothing over
        # the network: this rule covers every package under
        # internal/adapter/report, markdown and jsonreport included, and any
        # reporter added later included. The glob ends in /** so it matches
        # the files directly in each package.
        #
        # An import rule sees direct imports only, so the reporters' imports
        # are a strict allow list: the standard packages they use, each
        # ending in $ so it covers that package only, and the project
        # packages they import, also ending in $, each held by a strict rule
        # of its own (app-uses-ports-not-adapters and domain-is-pure). A
        # reporter that imports a shared helper under internal/adapter/internal/
        # names it here, ending in $, never by prefix: make lint runs on
        # ./..., which skips testdata directories and directories whose name
        # starts with _, so a helper placed there is never linted. The list
        # is what markdown and jsonreport import; encoding/json$ is for the
        # JSON report (docs/adr/0018) and does no I/O.
        #
        # context$ is for the context Report takes, fmt$ for fmt.Fprintf to
        # the given writer, and io$ for io.Writer. An allowed package can
        # still hold a function that does I/O, which an import rule cannot
        # see: a reporter must not call fmt.Print* (which writes to stdout).
        # Review holds that line; a forbidigo rule (issue #43) could.
        #
        # The allow list already refuses every package below; these entries
        # only say why. Those without $ also cover their subpackages: net
        # covers net/http. os$ covers os alone, and os/exec, os/signal and
        # os/user are named, because depguard compares an import with the one
        # entry that sorts nearest before it: a bare os would be a strict
        # prefix of os/exec and decide nothing under it (issue #119; test/
        # architecture, TestDepguardEntriesShadowNothing).
        reporters-stay-offline:
          list-mode: strict
          files:
            - "**/internal/adapter/report/**"
            - "!$test"
          allow:
            - context$
            - fmt$
            - io$
            - strconv$
            - strings$
            - encoding/json$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/assessment$
            - github.com/timothymamo/shift2eu/internal/domain/estimate$
            - github.com/timothymamo/shift2eu/internal/domain/mapping$
          deny:
            - pkg: io/fs
              desc: a reporter writes only to the io.Writer it is given
            - pkg: io/ioutil
              desc: a reporter writes only to the io.Writer it is given
            - pkg: net
              desc: a reporter sends nothing over the network; it writes only to the io.Writer it is given
            - pkg: os/exec
              desc: a reporter runs no program; it writes only to the io.Writer it is given
            - pkg: os/signal
              desc: a reporter handles no OS signal; it writes only to the io.Writer it is given
            - pkg: os/user
              desc: a reporter looks up no OS user; it writes only to the io.Writer it is given
            - pkg: os$
              desc: a reporter reads no file and no environment; it writes only to the io.Writer it is given
            - pkg: plugin
              desc: a reporter loads no code
            - pkg: runtime/cgo
              desc: a reporter calls no C code
            - pkg: syscall
              desc: a reporter makes no system call
            - pkg: unsafe
              desc: a reporter needs no unsafe code
        testutil-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/testutil/**"
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/testutil
              desc: testutil may only be imported from _test.go files
        contract-suites-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/adapter/source/sourcetest/**"
            - "!**/internal/adapter/target/targettest/**"
          deny:
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/source/sourcetest
              desc: the source contract suite may only be imported from _test.go files
            - pkg: github.com/timothymamo/shift2eu/internal/adapter/target/targettest
              desc: the target contract suite may only be imported from _test.go files
        go-cmp-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/google/go-cmp
              desc: go-cmp is a test-only dependency
        # The composition roots' _test.go files (issue #111). The strict
        # rules composition-root and server-composition-root skip test files
        # (!$test), yet a test is compiled into the root's package and runs in
        # the same process: it could start a program, load a plugin, hand a
        # path to a CGI handler, build a package, reach C, or take a pointer
        # apart for a raw system call or a foreign symbol through
        # //go:linkname (test/lint refuses that directive in the roots). The
        # rule is lax, so its deny list alone decides and no allow list has to
        # follow every pure import a test makes. syscall/js builds for js/wasm
        # only and is denied all the same.
        #
        # os/user is denied too: a lookup returns a user's home directory,
        # where the environment's variables and credential files point.
        #
        # Since issue #152 the rule also holds the _test.go files of the two
        # driving adapters, internal/cli and internal/httpapi: a root hands
        # them the work, and their tests run in the same process as the code
        # under test. This import rule is half of the roots' limits; the call
        # half is forbidigo's: composition-root-no-exec and composition-root-env
        # hold under cmd/ only, cli-no-env-or-process holds every file of
        # internal/cli, its tests included, and httpapi-tests-no-env-or-process
        # holds internal/httpapi's tests. The CLI's tests import syscall for
        # syscall.Mkfifo (output_unix_test.go), which neither this deny list
        # nor cli-no-env-or-process names.
        composition-root-tests:
          list-mode: lax
          files:
            - "**/cmd/shift2eu/*_test.go"
            - "**/cmd/shift2eu/**/*_test.go"
            - "**/cmd/shift2eu-server/*_test.go"
            - "**/cmd/shift2eu-server/**/*_test.go"
            - "**/internal/cli/*_test.go"
            - "**/internal/cli/**/*_test.go"
            - "**/internal/httpapi/*_test.go"
            - "**/internal/httpapi/**/*_test.go"
          deny:
            - pkg: go/build
              desc: a composition root's test builds no package; it runs the root's code in process
            - pkg: net/http/cgi
              desc: a composition root's test runs no CGI program; the cgi handler starts a process
            - pkg: os/exec
              desc: a composition root's test runs no program, such as a cloud CLI
            - pkg: plugin
              desc: a composition root's test loads no plugin, whose code would run in the process
            - pkg: runtime/cgo
              desc: a composition root's test reaches no C code
            - pkg: syscall/js
              desc: a composition root's test calls no JavaScript host function
            - pkg: unsafe
              desc: a composition root's test takes no pointer apart, which is how a raw system call or a linknamed symbol is reached
            - pkg: os/user
              desc: a composition root's test looks up no OS user, whose home directory is where the environment's variables point
        # The e2e tier builds the binary and runs it as a black box, offline,
        # against the fixtures in test/e2e/testdata. It imports only the
        # standard library, go-cmp and internal/testutil: no adapter,
        # application, domain or CLI package and no cloud SDK. The glob covers
        # _test.go files too; it is the only depguard rule that does outside
        # internal/app. The allow entry for testutil ends in $ and is longer
        # than the module-wide deny entry, so it wins for that package only.
        e2e-is-black-box:
          list-mode: strict
          files:
            - "**/test/e2e/**"
          allow:
            - $gostd
            - github.com/google/go-cmp
            - github.com/timothymamo/shift2eu/internal/testutil$
          deny:
            - pkg: github.com/timothymamo/shift2eu/
              desc: the e2e tier runs the built binary as a black box; it imports no adapter, application, domain or CLI package
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: the e2e tier runs offline and calls no cloud SDK
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: the e2e tier runs offline and calls no cloud SDK
            - pkg: cloud.google.com/go
              desc: the e2e tier runs offline and calls no cloud SDK
            - pkg: google.golang.org/api
              desc: the e2e tier runs offline and calls no cloud SDK
        # internal/config loads flags, the environment and an optional file
        # (its doc.go), but has no code yet. A composition root may import any
        # module package, so without a strict rule it was a delegation path
        # (issue #152): a root could hand it an os.Getenv or exec.Command with
        # lint green. test/architecture's TestEveryModulePackageIsHeldByAStrictRule
        # now holds every module package under internal/ and cmd/ to a strict
        # rule. internal/config imports nothing, so the rule allows nothing:
        # allow: [], which check.AllowList reads as no entries (issue #166; a
        # missing or null allow: is still refused). depguard refuses a rule
        # with no list at all, so the rule carries one deny entry, os; the
        # strict empty allow list is what refuses every import. A future os
        # import is added here together with a forbidigo group that refuses
        # its environment reads, as inventoryfile-no-env does
        # (TestEveryOsAllowingRuleHasAnEnvironmentGroup fails until it has
        # one), and any read of a named variable needs an exception decided
        # in an ADR, as composition-root-env's for SHIFT2EU_SERVER_TOKEN
        # (ADR 0019). The same commit drops the os deny entry:
        # check.AllowList refuses a rule whose allow list allows a package
        # its deny list names.
        config-is-pure:
          list-mode: strict
          files:
            - "**/internal/config/**"
            - "!$test"
          allow: []
          deny:
            - pkg: os
              desc: internal/config imports nothing yet; an os import needs a forbidigo group for its environment reads and an ADR for any named variable (see the config-is-pure comment)
        # internal/adapter/target holds a doc.go and no code; its providers,
        # the snapshot reader and the contract suite have rules of their own,
        # which the negated globs take out. Without a rule it was a package
        # no strict rule held (TestEveryModulePackageIsHeldByAStrictRule,
        # issue #152). The package imports nothing, so the rule allows
        # nothing: allow: [] and the one deny entry, os, as config-is-pure.
        # A provider added under it is named in this rule's negated globs
        # and in embedded-snapshot-targets-stay-offline in the same commit.
        target-docs-are-pure:
          list-mode: strict
          files:
            - "**/internal/adapter/target/**"
            - "!**/internal/adapter/target/ovhcloud/**"
            - "!**/internal/adapter/target/scaleway/**"
            - "!**/internal/adapter/target/upcloud/**"
            - "!**/internal/adapter/target/snapshot/**"
            - "!**/internal/adapter/target/targettest/**"
            - "!$test"
          allow: []
          deny:
            - pkg: os
              desc: a doc-only package imports nothing; name an import in this rule's allow list and its pin in depguardpin_test.go in the same commit
        # The contract suites, internal/adapter/source/sourcetest and
        # internal/adapter/target/targettest, are production packages, not
        # _test packages, and any _test.go file of the module may import
        # them, so without a strict rule a scoped test could delegate a call
        # through them (issue #152). The allow list is exactly what they
        # import today; time$ is targettest's and the one widening sourcetest
        # gets from the shared rule. !$test leaves the suites' own _test.go
        # files to the module-wide rules: they run in the suites' own test
        # binaries and are handed to no root.
        contract-suites-are-pure:
          list-mode: strict
          files:
            - "**/internal/adapter/source/sourcetest/**"
            - "**/internal/adapter/target/targettest/**"
            - "!$test"
          allow:
            - context$
            - errors$
            - fmt$
            - slices$
            - testing$
            - time$
            - github.com/timothymamo/shift2eu/internal/app/analysis$
            - github.com/timothymamo/shift2eu/internal/domain/catalog$
            - github.com/timothymamo/shift2eu/internal/domain/inventory$
            - github.com/timothymamo/shift2eu/internal/domain/taxonomy$
            - github.com/timothymamo/shift2eu/internal/domain/text$
        # The test trees' own documentation packages (issue #152, the auditor's finding H-1):
        # test/apiparity, test/architecture, test/container, test/devenv, test/docs, test/lint,
        # test/openapibundle (issue #139) and test/examples (issue #179) each hold doc.go and no
        # code, and each is a production package a composition root can import, because the roots'
        # allow lists name the module path as a prefix entry. Go's internal rule keeps
        # test/internal/... and
        # test/architecture/internal/... out of reach of cmd/ and internal/, and nothing keeps
        # these out, so they get a rule of their own: one shared strict rule that allows nothing,
        # allow: [] and the one deny entry, os, as config-is-pure. The day one of them imports a
        # package, it names it here and in the pin in the same commit. test/e2e is held here too
        # since #152 (the reviewer's B1, the auditor's L-1): its doc.go carries no build tag, so
        # it is a production package a root can import, and e2e-is-black-box, which holds it as
        # well, allows $gostd, so a root could hand os.Getenv or exec.Command to an untagged file
        # there. !$test takes the e2e test files out (depguard applies negated globs whatever
        # their position), so they stay on e2e-is-black-box alone.
        # !$test takes the test files out, whose imports these lists would not fit, and the
        # nested internal tree under test/architecture is taken out with a negated glob, because a
        # files: list cannot say "this directory only" and test/architecture/internal/check reads
        # os and os/exec. An import list says nothing of a file that needs no import, so
        # test/lint's TestDocPackagesHoldNoNonGoSource refuses a non-Go source (assembly, C, a
        # .syso object, ...) outside testdata, _ and . directories in every tree this files:
        # list holds, read from it (issue #194), and every symlink in, or above, a held tree,
        # anywhere, testdata, _ and . directories included. The testdata, _ and . exemption of
        # ./... covers non-Go files only. A package under testdata or _x is still built when it
        # is imported by path, which that check does not cover (the follow-up to #194).
        test-docs-are-pure:
          list-mode: strict
          files:
            - "**/test/apiparity/**"
            - "**/test/architecture/**"
            - "!**/test/architecture/internal/**"
            - "**/test/container/**"
            - "**/test/devenv/**"
            - "**/test/docs/**"
            - "**/test/e2e/**"
            - "**/test/examples/**"
            - "**/test/lint/**"
            - "**/test/openapibundle/**"
            - "!$test"
          allow: []
          deny:
            - pkg: os
              desc: a doc-only package imports nothing; name an import in this rule's allow list and its pin in depguardpin_test.go in the same commit
    exhaustive:
      default-signifies-exhaustive: true
    # forbidigo refuses calls, which an import rule cannot see. Its entries
    # come in groups, one per rule, each opened by a comment, and every msg in
    # a group starts with the group's tag (cloud-read-only:, domain-is-pure:).
    # forbidigo has no per-entry file scope: a group that holds for some files
    # only gets an entry in linters.exclusions.rules with linters [forbidigo],
    # a path or path-except, and a text of this form:
    #   text: 'because "<tag>: [^"]*"$'
    # A named exception for one entry (composition-root-env) has that form
    # with the entry's exact msg, regex-escaped, in place of [^"]*, so it
    # drops that entry's issues and no other entry's of its group.
    # The issue text is: use of `<expression>` forbidden because "<msg>".
    # The expression keeps its string literals, so a text of just '<tag>:'
    # also drops another group's issue on a call that passes that string.
    # The form above matches only the quoted msg at the end, so no msg may
    # contain a double quote. Add a group after the last one; no other
    # group's entries change.
    #
    # How analyze-types matching renders a call, field or type, and so how to
    # write a pattern, is in docs/architecture.md (Cloud read-only rule),
    # probed on the golangci-lint version CI pins. pattern and pkg are
    # unanchored, so every entry spells out ^ and $. golangci-lint turns
    # forbidigo's //permit: comments off; test/lint refuses every nolint
    # directive that would silence forbidigo.
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        # Group cloud-read-only: source adapters only read from a cloud
        # (CLAUDE.md rule 1), and never handle a credential themselves (rule
        # 3). A cloud SDK puts reads and writes on the same client, so
        # depguard cannot keep a write out. ADR 0014 records the decision, and
        # docs/architecture.md (Cloud read-only rule) how the entries match,
        # how to allow a new read verb, and the gaps that remain.
        #
        # Scope: every file lint checks, _test.go files and integration tests
        # included, so the group has no exclusion rule. Like depguard, it
        # relies on linters.exclusions.generated being disable.
        #
        # It is an allowlist. On a client type only these verbs are allowed and
        # every other method is refused:
        #   AWS     Describe*, Get*, List*
        #   Azure   Get*, List*, NewGet* and NewList* (the pagers)
        #   GCP     Get*, List*, AggregatedList*, Close
        # Go regexps have no lookahead, so "a name that does not start with an
        # allowed verb" is a prefix trie: a first-letter class no verb starts
        # with, then one branch per letter at which a name leaves a verb, then
        # the verb run on in lower case (Describe[^A-Z0-9], so Describes,
        # Getaway and Listen are refused). Each SDK has an entry for its client
        # methods and one for the types that name an operation. The other
        # entries refuse whole packages or single names: clients no allowlist
        # covers, hooks that rewrite a request or hand out a credential, and
        # allowed verbs that return a secret.
        #
        # Every entry is pinned twice in test/lint: TestCloudReadOnlyProbe
        # runs lint on probe adapters over stub SDKs
        # (testdata/cloudreadonly), where each entry has a line only it
        # refuses, and TestCloudReadOnlyPatterns checks the client and
        # operation patterns against lists of real write and read names, and
        # the denylist entries against names that need every alternative and
        # optional part (x?, x*).
        # Change an entry, and both tell you what moved.
        #
        # The AWS pkg takes a service package or a feature package, with or
        # without a major version (service/sqs/v2), and leaves out the types
        # packages beneath them. The input entry also takes <Op>Output, which
        # an interface that leaves its input type to inference still names,
        # and <Op>APIClient, the one-method interface a service declares for a
        # paginator or waiter.
        - pattern: '^\w+\.\w*Client\.(?:[A-CEFH-KM-Z]|D[^e]|De[^s]|Des[^c]|Desc[^r]|Descr[^i]|Descri[^b]|Describ[^e]|Describe[^A-Z0-9]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9])\w*$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/(?:service/[^/]+|feature/[^/]+/[^/]+)(?:/v[0-9]+)?$'
          msg: 'cloud-read-only: an AWS SDK client allows Describe*, Get* and List* calls only (CLAUDE.md rule 1)'
        - pattern: '^\w+\.(?:[A-CEFH-KM-Z]|D[^e]|De[^s]|Des[^c]|Desc[^r]|Descr[^i]|Descri[^b]|Describ[^e]|Describe[^A-Z0-9]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9])\w*(?:Input|Output|APIClient)$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/(?:service/[^/]+|feature/[^/]+/[^/]+)(?:/v[0-9]+)?$'
          msg: 'cloud-read-only: only the input, output or APIClient of an AWS Describe*, Get* or List* operation may be named (CLAUDE.md rule 1)'
        # The S3 upload manager writes through a type of its own, not a client,
        # and declares interfaces that hold write methods. The input entry
        # refuses those interfaces too; they are named here as well.
        - pattern: '^manager\.(?:NewUploader|Uploader(?:\.\w+)?|UploadAPIClient|DeleteObjectsAPIClient)$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/feature/s3/manager(?:/v[0-9]+)?$'
          msg: 'cloud-read-only: the S3 upload manager and its write interfaces write to S3 (CLAUDE.md rule 1)'
        - pattern: '^\w+\.\w*Client\.(?:[A-FH-KMO-Z]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9]|N[^e]|Ne[^w]|New(?:[^GL]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9]))\w*$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/'
          msg: 'cloud-read-only: an Azure SDK client allows Get*, List*, NewGet* and NewList* calls only (CLAUDE.md rule 1)'
        - pattern: '^\w+\.\w*Client(?:[A-FH-KMO-Z]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9]|N[^e]|Ne[^w]|New(?:[^GL]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9]))\w*Options$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/resourcemanager/'
          msg: 'cloud-read-only: only the options of an Azure Get* or List* operation may be named (CLAUDE.md rule 1)'
        # A data-plane SDK (blobs, secrets, queues, ...) names its options
        # <Op>Options, without the client. pkg lists the roots under sdk/ that
        # hold one, which leaves out azcore, azidentity and resourcemanager; a
        # new root needs adding. The entry also refuses the package's
        # ClientOptions, which configures the request pipeline, where a policy
        # can rewrite any request: pass nil to the client's constructor.
        - pattern: '^\w+\.(?:[A-FH-KM-Z]|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9])\w*Options$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/(?:ai|batch|containers|data|messaging|monitor|security|storage)/'
          msg: 'cloud-read-only: only the options of an Azure data-plane Get* or List* operation may be named; pass nil for ClientOptions (CLAUDE.md rule 1)'
        - pattern: '^\w+\.\w*Client\.(?:[BD-FH-KM-Z]|A[^g]|Ag[^g]|Agg[^r]|Aggr[^e]|Aggre[^g]|Aggreg[^a]|Aggrega[^t]|Aggregat[^e]|Aggregate[^d]|Aggregated[^L]|AggregatedL[^i]|AggregatedLi[^s]|AggregatedLis[^t]|AggregatedList[^A-Z0-9]|C[^l]|Cl[^o]|Clo[^s]|Clos[^e]|Close\w|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9])\w*$'
          pkg: '^cloud\.google\.com/go/'
          msg: 'cloud-read-only: a GCP SDK client allows Get*, List*, AggregatedList* and Close calls only (CLAUDE.md rule 1)'
        - pattern: '^\w+\.(?:[BD-FH-KM-Z]|A[^g]|Ag[^g]|Agg[^r]|Aggr[^e]|Aggre[^g]|Aggreg[^a]|Aggrega[^t]|Aggregat[^e]|Aggregate[^d]|Aggregated[^L]|AggregatedL[^i]|AggregatedLi[^s]|AggregatedLis[^t]|AggregatedList[^A-Z0-9]|C[^l]|Cl[^o]|Clo[^s]|Clos[^e]|Close\w|G[^e]|Ge[^t]|Get[^A-Z0-9]|L[^i]|Li[^s]|Lis[^t]|List[^A-Z0-9])\w*(?:Request|Response)$'
          pkg: '^cloud\.google\.com/go/.+pb$'
          msg: 'cloud-read-only: only the request or response of a GCP Get*, List* or AggregatedList* operation may be named (CLAUDE.md rule 1)'
        # google.golang.org/api, the discovery-based GCP clients, is refused
        # outright: use cloud.google.com/go. A discovery method builds a call
        # value (svc.Instances.Delete returns an *InstancesDeleteCall) that a
        # generic helper or an interface variable runs with Do, naming no
        # operation type, and its nested services are fields, matched as
        # <package>.<type>.<field> like methods, so neither its services nor
        # its calls can be allowlisted. pkg takes every generated package,
        # whose path ends in a version (compute/v1, admin/directory/v1,
        # merchantapi/products_v1beta), and leaves the helper packages
        # option, iterator and googleapi usable (transport and some options
        # are refused below). Allowing a discovery client needs a reviewed
        # entry that refuses its write operations first.
        - pattern: '^\w+\.\w+'
          pkg: '^google\.golang\.org/api/.+[/_]v[0-9][^/]*$'
          msg: 'cloud-read-only: use cloud.google.com/go; a google.golang.org/api client can run a write without naming it (CLAUDE.md rule 1)'
        # Allowed verbs that mint credentials, register an identity, return a
        # secret or hand out a presigned URL (an upload URL is a write),
        # refused by name, and Azure clients whose name says they hold keys,
        # secrets, credentials or tokens, refused whole. This is a denylist
        # and holds only the ones known; it is not complete. The entries were
        # checked against every AWS operation and every Azure and GCP client
        # method in the SDK repositories (2026-11). Generic endings that
        # refused ordinary reads were narrowed: Access to Compute, Instance
        # and Data Access (not GetEndpointAccess), GetConnection to Glue and
        # DataZone, Value to ListValue (not GetFeatureValue), key clients to
        # the ones named for a secret (not armkeyvault.KeysClient or
        # SSHPublicKeysClient), GCP secrets to the ones that return one (not
        # secretmanager GetSecret).
        - pattern: '^(?:\w+\.(?:\w*Client\.)?(?:Get\w*(?:Token(?:For\w+)?|Credentials\w*|SecretValue|Password|PasswordData|AccessDetails|(?:Compute|Instance|Data)Access|A(?:pi|PI)Keys?|StreamKey|(?:Embed|Login|Upload|Presigned)U(?:rl|RL)|Signed\w*Url)|GetId|GetParameter\w*|Describe\w*Credentials|DescribeUserPoolClient|List(?:Api|API)Keys|ListUserPoolClientSecrets)|(?:glue|datazone)\.(?:Client\.)?GetConnections?)(?:Input|APIClient)?$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/(?:service/[^/]+|feature/[^/]+/[^/]+)(?:/v[0-9]+)?$'
          msg: 'cloud-read-only: this AWS call mints credentials, registers an identity, returns a secret or a presigned URL (CLAUDE.md rule 1)'
        - pattern: '^\w+\.(?:\w*Client\.?)?(?:(?:New)?(?:Get|List)\w*(?:Keys?|KeysForKeyName|SAS|Sas|SASURL|SasURL|Secrets?|ConnectionStrings?|ConnectionInfo|Credentials?|Tokens?|CallbackURL|FullURL|DownloadURI|UploadURL|AccessProfile|ApplicationSettings|AppSettings|AuthSettings(?:V2)?|GatewaySettings|PublishingUser|Password)(?:Slot)?(?:Pager|Options)?|ListValue(?:Options)?)$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/'
          msg: 'cloud-read-only: this Azure call mints credentials or returns keys, secrets or a SAS or callback URL (CLAUDE.md rule 1)'
        - pattern: '^(?:\w+\.\w*(?:(?:API|Auth|Admin|Query|Shared|Endpoint|Metrics|BitLocker|Activation)Keys|Secrets?|Credentials?|Tokens?)|armautomation\.Keys)Client(?:\.\w+|\w*Options)$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/'
          msg: 'cloud-read-only: this Azure client holds keys, secrets, credentials or tokens (CLAUDE.md rule 1)'
        - pattern: '^\w+\.(?:\w*Client\.)?(?:Get\w*(?:KeyString|AuthString|Tokens?|Password|Credentials?|ActivationKeys?|MeasurementProtocolSecret)|List\w*(?:AuthTokens|ActivationKeys|MeasurementProtocolSecrets))(?:Request)?$'
          pkg: '^cloud\.google\.com/go/'
          msg: 'cloud-read-only: this GCP call returns a key, token, password or secret (CLAUDE.md rule 1)'
        # The AWS SDK v1, and every package of the Azure SDK's root module
        # outside sdk/ (track 1 and legacy storage: services/, profiles/,
        # storage), are superseded, and no entry above covers their clients,
        # so every use of them is refused.
        - pattern: '^\w+\.\w+'
          pkg: '^github\.com/(?:aws/aws-sdk-go/|Azure/azure-sdk-for-go/(?:[^s]|s[^d]|sd[^k]|sdk[^/]))'
          msg: 'cloud-read-only: use aws-sdk-go-v2 or the Azure SDK under sdk/, whose clients the entries above cover (CLAUDE.md rule 1)'
        # The hand-written GCP clients return handles whose methods write
        # (storage.BucketHandle, and the DocumentRef in each snapshot
        # firestore.Client.GetAll returns), and profiler.Start uploads
        # profiles, so they are refused whole, and so is the metadata server,
        # which hands out the instance's token. Their generated clients
        # (storage/control/apiv2, firestore/apiv1) stay under the allowlist. A
        # new hand-written package needs adding here.
        - pattern: '^\w+\.\w+'
          pkg: '^cloud\.google\.com/go/(?:compute/metadata|profiler|datastore|firestore|spanner|bigtable|storage(?:/transfermanager|/dataflux|/experimental)?|bigquery(?:/v2(?:/query)?|/storage/managedwriter(?:/adapt)?)?|pubsub(?:/v2)?)(?:/aliasshim)?$'
          msg: 'cloud-read-only: a hand-written GCP client hands out handles that write, and the metadata server a token; use a generated apiv client (CLAUDE.md rules 1 and 3)'
        # Hooks through which an allowed read is rewritten into a write on its
        # way out, or a credential is handed out (CLAUDE.md rule 3). AWS: a
        # request signer, a credentials provider, the instance metadata client,
        # the RDS and DSQL token builders, and smithy's middleware, transport
        # and auth packages are refused whole; an API error code is read with
        # smithy.APIError from the root smithy-go package. aws.Config stays
        # usable, as config.LoadDefaultConfig returns it and NewFromConfig
        # takes it, but not its credentials, HTTP client, API options,
        # interceptors or service options, nor the config.With* options that
        # set them, nor the same fields of a service's Options, which a
        # func(*ec2.Options) passed to a call can set.
        - pattern: '^\w+\.\w+'
          pkg: '^github\.com/aws/(?:aws-sdk-go-v2/(?:aws/signer|credentials|feature/(?:ec2/imds|rds/auth|dsql/auth))|smithy-go/(?:middleware|transport|auth))(?:/|$)'
          msg: 'cloud-read-only: an AWS signer, credentials provider, metadata client, middleware or transport rewrites a request or hands out a credential (CLAUDE.md rules 1 and 3)'
        - pattern: '^(?:aws\.(?:Config\.)?(?:\w*Credential\w*|BearerAuthTokenProvider|HTTPClient|APIOptions|Interceptors|ServiceOptions)(?:\.\w+)?|config\.With(?:(?:Before|After)\w+|HTTPClient|APIOptions|ServiceOptions|CredentialsProvider|BearerAuthTokenProvider|\w*Credential\w*Options|\w*ProviderOptions|\w*CacheOptions|SharedCredentialsFiles))$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/(?:aws|config)$'
          msg: 'cloud-read-only: the credentials, HTTP client, API options and interceptors of an AWS config rewrite a request or hand out a credential; use config.LoadDefaultConfig and NewFromConfig (CLAUDE.md rules 1 and 3)'
        - pattern: '^\w+\.(?:(?:Options\.)?(?:APIOptions|HTTPClient|Credentials|BearerAuthTokenProvider|HTTPSignerV4|Interceptors|AuthSchemes|AuthSchemeResolver)|WithAPIOptions)$'
          pkg: '^github\.com/aws/aws-sdk-go-v2/(?:service/[^/]+|feature/[^/]+/[^/]+)(?:/v[0-9]+)?$'
          msg: 'cloud-read-only: the credentials, HTTP client, API options and interceptors of an AWS client rewrite a request or hand out a credential (CLAUDE.md rules 1 and 3)'
        # Azure: a credential's GetToken mints a bearer token, and a request
        # the adapter builds and sends itself (runtime.NewPipeline,
        # runtime.NewRequest, Pipeline.Do), or a policy, which gets every
        # request before it is sent (policy.Request.Raw), can write. A
        # client's options set no Transport and no per-call or per-retry
        # policy: pass nil or an empty &arm.ClientOptions{}.
        - pattern: '^\w+\.(?:\w*Credential\.GetToken|Request(?:\.\w+)?|Pipeline\.Do|NewPipeline|NewRequest(?:For\w+|From\w+)?)$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/(?:azcore|azidentity)(?:/|$)'
          msg: 'cloud-read-only: an Azure token, request or pipeline of your own can write or hand out a credential; call a client method (CLAUDE.md rules 1 and 3)'
        - pattern: '^policy\.(?:ClientOptions\.)?(?:Transport|PerCallPolicies|PerRetryPolicies)$'
          pkg: '^github\.com/Azure/azure-sdk-for-go/sdk/azcore/(?:arm/)?policy$'
          msg: 'cloud-read-only: an Azure transport or policy can rewrite a request; pass nil or an empty arm.ClientOptions (CLAUDE.md rule 1)'
        # GCP: an OAuth2 token source and the packages that build an
        # authenticated transport are refused whole. The option package stays
        # usable (option.WithQuotaProject), but not the options that put in a
        # transport or a credential: an adapter uses the default credentials
        # and transport. From grpc, a connection of the adapter's own, its
        # Invoke and NewStream, and an interceptor, which gets every call,
        # are refused; grpc/codes and grpc/status stay usable.
        - pattern: '^\w+\.\w+'
          pkg: '^(?:golang\.org/x/oauth2|google\.golang\.org/api/transport|cloud\.google\.com/go/auth)(?:/|$)'
          msg: 'cloud-read-only: a GCP token source or authenticated transport of your own hands out a credential; let the client use the default credentials (CLAUDE.md rule 3)'
        - pattern: '^option\.(?:With(?:HTTPClient|GRPC\w+|TokenSource|\w*Credentials\w*|APIKey|ClientCertSource|ServiceAccountFile)|Impersonate\w*)$'
          pkg: '^google\.golang\.org/api/option$'
          msg: 'cloud-read-only: this option puts a transport or a credential into a GCP client; use the defaults (CLAUDE.md rules 1 and 3)'
        - pattern: '^grpc\.(?:Dial\w*|NewClient|NewClientStream|Invoke|With\w*Interceptor|\w*ClientInterceptor|ClientConn\w*\.(?:Invoke|NewStream))$'
          pkg: '^google\.golang\.org/grpc$'
          msg: 'cloud-read-only: a gRPC connection, call or interceptor of your own can write; call a client method (CLAUDE.md rule 1)'
        # Types a source adapter declares itself, tests included: a method or
        # func field whose name starts with a write verb is refused, so a write
        # cannot go through a named interface of the adapter's own or a struct
        # that embeds a client. pkg covers every package under
        # internal/adapter/source; inventoryfile and sourcetest are not
        # exempt, as nothing there needs a write verb. It is a denylist,
        # because forbidigo cannot tell a method from a field, and an
        # allowlist would refuse the adapter's own fields and the port's
        # Inventory method. The allowlist is in test/lint instead
        # (TestNoInterfaceDeclaresACloudWrite), which sees declarations: an
        # interface a cloud source adapter declares, generic or not, may
        # declare only read verbs, and an interface elsewhere none of these
        # verbs. test/lint (sourcewrites_test.go) holds the same verbs, and
        # fails when the two lists differ.
        - pattern: '^\w+\.\w+\.(?:Abandon|Abort|Accept|Acquire|Activate|Add|Advertise|Allocate|Apply|Archive|Assign|Associate|Assume|Attach|Authorize|Backtrack|Batch|Begin|Break|Bulk|Bundle|Cancel|Change|Clear|Commit|Complete|Confirm|Continue|Copy|Create|Deactivate|Deallocate|Decrypt|Delete|Deploy|Deprecate|Deprovision|Deregister|Detach|Disable|Disassociate|Enable|Execute|Expand|Export|Failover|Flush|Generalize|Generate|Grant|Import|Initiate|Insert|Invoke|Leave|Lock|Merge|Modify|Monitor|Move|Patch|Perform|Power|Promote|Provision|Publish|Purchase|Purge|Put|Reapply|Reboot|Receive|Recreate|Redeploy|Regenerate|Register|Reimage|Reject|Release|Remove|Renew|Replace|Request|Reset|Resize|Restart|Restore|Resume|Revoke|Rollback|Rotate|Run|Scale|Send|Set|Sign|Signal|Simulate|Split|Start|Stop|Subscribe|Suspend|Swap|Switch|Tag|Terminate|Truncate|Unarchive|Unassign|Undelete|Unlock|Unmonitor|Unsubscribe|Untag|Update|Upgrade|Upload|Upsert|Withdraw|Write)(?:[A-Z0-9]\w*)?$'
          pkg: '^github\.com/timothymamo/shift2eu/internal/adapter/source/'
          msg: 'cloud-read-only: a source adapter calls no method named for a write on a type of its own; call the SDK client directly, or rename the helper (CLAUDE.md rule 1)'
        # Group domain-is-pure: the domain does no I/O and reads no clock. The
        # depguard rule of the same name allows fmt and time for fmt.Errorf and
        # time.Time; these entries refuse what in them reaches stdio, the
        # clock, zoneinfo files or the environment. docs/architecture.md
        # (Domain-is-pure rule) says why each entry is listed, what stays
        # allowed and the gaps that remain.
        #
        # Scope: production files under internal/domain/ only. The two
        # exclusion rules marked domain-is-pure at the end of
        # linters.exclusions.rules drop the group's issues in every other path
        # and in _test.go files, godoc examples included.
        #
        # Every entry is pinned twice in test/lint: TestDomainIsPureProbe runs
        # lint on a probe domain package (testdata/domainispure), with a line
        # for each name an entry refuses, and TestDomainIsPurePatterns checks
        # the patterns against lists of refused and allowed names.
        - pattern: '^fmt\.Print(?:f|ln)?$'
          pkg: '^fmt$'
          msg: 'domain-is-pure: fmt.Print* writes to stdout; return the value or an error and let an adapter or the CLI write it'
        - pattern: '^fmt\.Scan(?:f|ln)?$'
          pkg: '^fmt$'
          msg: 'domain-is-pure: fmt.Scan* reads stdin; take the input as a parameter (fmt.Sscan* parses a string)'
        - pattern: '^print(?:ln)?$'
          pkg: '^$'
          msg: 'domain-is-pure: print and println write to stderr; return the value or an error instead'
        - pattern: '^time\.(?:Now|Since|Until|Sleep|After|Tick|NewTimer|NewTicker|AfterFunc)$'
          pkg: '^time$'
          msg: 'domain-is-pure: the domain reads no clock; take the time.Time or time.Duration as a parameter, or through a port'
        - pattern: '^time\.(?:Timer|Ticker)(?:\.\w+)?$'
          pkg: '^time$'
          msg: 'domain-is-pure: a time.Timer or time.Ticker waits on the clock; take the time.Time or time.Duration as a parameter, or through a port'
        - pattern: '^time\.LoadLocation$'
          pkg: '^time$'
          msg: 'domain-is-pure: time.LoadLocation reads zoneinfo files and the ZONEINFO variable; use time.UTC or time.FixedZone, or take the *time.Location as a parameter'
        - pattern: '^time\.(?:Time\.)?Local$'
          pkg: '^time$'
          msg: 'domain-is-pure: time.Local reads the TZ variable and /etc/localtime; use time.UTC, or take the *time.Location as a parameter'
        - pattern: '^time\.Unix(?:Milli|Micro)?$'
          pkg: '^time$'
          msg: 'domain-is-pure: time.Unix* returns a time in time.Local, which reads TZ and /etc/localtime; take the time.Time as a parameter, converted with .UTC() where the timestamp is read'
        - pattern: '^time\.(?:Parse|Time\.(?:UnmarshalJSON|UnmarshalText|UnmarshalBinary|GobDecode))$'
          pkg: '^time$'
          msg: 'domain-is-pure: this matches a zone offset against time.Local, which reads TZ and /etc/localtime; use time.ParseInLocation with time.UTC or a *time.Location passed in'
        # Group composition-root-no-exec: the composition roots cmd/shift2eu
        # and cmd/shift2eu-server (issue #111) start no program and dump no
        # environment. Their depguard allow lists (composition-root,
        # server-composition-root) must allow os and syscall, which can start
        # a process (shelling out to a cloud CLI) or hand over every variable,
        # credentials included (CLAUDE.md rule 3). os/exec is refused as a
        # package: any use of it, whichever name. The group has no exception.
        #
        # Group composition-root-env: the composition roots read no named
        # variable either, with one narrow exception: cmd/shift2eu-server/main.go
        # calls os.LookupEnv once, with tokenEnvVar (SHIFT2EU_SERVER_TOKEN),
        # in the token source func() (string, bool) it passes to run (ADR
        # 0019); run, setUp and readToken see only the token, never a lookup
        # by name. test/lint's TestCompositionRootPassesLookupEnvToRun pins
        # that shape. The entry stands alone, so the exception's exclusion
        # rule names its msg and drops no other entry's issue. Since issue
        # #152 the group also refuses os.UserHomeDir, os.UserConfigDir,
        # os.UserCacheDir and os.TempDir, which read $HOME, $XDG_CONFIG_HOME,
        # $XDG_CACHE_HOME and $TMPDIR without naming them, in an entry of
        # their own, so every package allowed os is held to the same nine
        # reads, and since issue #167 every package allowed syscall to the
        # syscall reads (Getenv, GetEnvironmentVariable,
        # GetEnvironmentStrings, Environ, the process starts and replacements,
        # the windows library loads and the raw system calls, AllThreadsSyscall
        # among them), which no-exec and env refuse between them
        # (test/architecture's TestEveryOsAllowingRuleHasAnEnvironmentGroup).
        #
        # Scope of both: every file under cmd/shift2eu/ and
        # cmd/shift2eu-server/, _test.go files included. A test of a
        # composition root is compiled into the same package and runs with the
        # same environment, and the server's tests hand run a fake token
        # source, so none needs a real one. Elsewhere the depguard rules keep os/exec out
        # by layer; these groups only add the call-level rule depguard cannot
        # state for the roots. A root cannot delegate a read to the driving
        # adapter it hands the work to either: internal/cli's strict allow
        # list leaves syscall, unsafe and os/exec out and the group
        # cli-no-env-or-process refuses the calls of os and syscall that
        # reach the environment or start a process, in its tests too (issue
        # #152); internal/httpapi's strict allow list leaves os and syscall
        # out, and httpapi-tests-no-env-or-process holds its tests;
        # internal/version, which the CLI imports, is held to fmt by
        # depguard's version-is-build-metadata; the inventory-file reader is
        # held by inventoryfile-no-env; and every other non-test module
        # package a root can import, under internal/, cmd/, test/ or a new
        # top-level directory, is held by a strict depguard rule
        # (TestEveryModulePackageIsHeldByAStrictRule), internal/config by
        # config-is-pure and the doc-only test/* packages by
        # test-docs-are-pure.
        #
        # No-exec also refuses the windows entry points of syscall
        # (CreateProcess, CreateProcessAsUser, GetEnvironmentStrings, LoadDLL,
        # MustLoadDLL, NewLazyDLL, LoadLibrary, GetProcAddress),
        # the raw system calls (Syscall, Syscall6/9/12/15/18, SyscallN,
        # RawSyscall, RawSyscall6, AllThreadsSyscall, AllThreadsSyscall6) and
        # the syscall.SYS_* numbers they take, and
        # any use of package unsafe, which takes a pointer apart for a raw
        # system call; depguard's composition-root-tests rule keeps unsafe out
        # of the roots' tests as well. These names are defence in depth: the
        # comprehensive guard is test/lint's syscall allow list
        # (TestCompositionRootsUseSyscallOnlyForSignals), under which a root uses package
        # syscall for a SIG* constant and the type syscall.Signal only, and
        # the unsafe ban is no complete one either (fmt and strconv can print
        # and parse an address). Env also
        # refuses windows's syscall.GetEnvironmentVariable. Every name is a
        # pattern, so the entries hold on every release target whether the
        # name exists there or not (syscall.Exec has no windows form,
        # syscall.CreateProcess no unix one); test/lint's probe lints the roots
        # natively and for windows/amd64.
        - pattern: '^os\.(?:StartProcess|Environ)$'
          pkg: '^os$'
          msg: 'composition-root-no-exec: a composition root starts no process and hands over no environment, where credentials live; take what it needs as a flag or a named variable'
        - pattern: '^syscall\.(?:Exec|ForkExec|StartProcess|Environ)$'
          pkg: '^syscall$'
          msg: 'composition-root-no-exec: a composition root starts or replaces no process and hands over no environment, where credentials live'
        - pattern: '^syscall\.(?:CreateProcess|CreateProcessAsUser|GetEnvironmentStrings|LoadDLL|MustLoadDLL|NewLazyDLL|LoadLibrary|GetProcAddress)$'
          pkg: '^syscall$'
          msg: 'composition-root-no-exec: a composition root starts no windows process, loads no library whose code would run and hands over no environment, where credentials live'
        - pattern: '^syscall\.(?:(?:AllThreads|Raw)?Syscall(?:6|9|12|15|18|N)?|SYS_\w+)$'
          pkg: '^syscall$'
          msg: 'composition-root-no-exec: a composition root makes no raw system call, which starts a process as well as syscall.Exec does'
        - pattern: '^\w+\.\w+'
          pkg: '^unsafe$'
          msg: 'composition-root-no-exec: a composition root takes no pointer apart, which is how a raw system call is handed an address; package unsafe is refused as a whole'
        - pattern: '^\w+\.\w+'
          pkg: '^os/exec$'
          msg: 'composition-root-no-exec: a composition root runs no program, such as a cloud CLI; os/exec is refused as a whole'
        - pattern: '^os\.(?:Getenv|ExpandEnv)$'
          pkg: '^os$'
          msg: 'composition-root-env: a composition root reads no environment variable; take the value as a flag'
        - pattern: '^os\.(?:UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'composition-root-env: a composition root locates no home, config, cache or temp directory, where a credentials file sits; take the value as a flag'
        - pattern: '^os\.LookupEnv$'
          pkg: '^os$'
          msg: 'composition-root-env: os.LookupEnv is called in cmd/shift2eu-server/main.go only, for SHIFT2EU_SERVER_TOKEN, in the token source it hands to run (ADR 0019); take any other value as a flag'
        - pattern: '^syscall\.(?:Getenv|GetEnvironmentVariable)$'
          pkg: '^syscall$'
          msg: 'composition-root-env: a composition root reads no environment variable; take the value as a flag'
        # Group testutil-no-env (issue #144): the test helpers of
        # internal/testutil read no environment variable, locate no home,
        # config, cache or temp directory and start no process. depguard's
        # testutil-imports must allow os, which the golden files are read and
        # written with, and os also reads, writes and hands over the
        # environment, where credentials live (CLAUDE.md rule 3), and
        # UserHomeDir, UserConfigDir, UserCacheDir and TempDir read $HOME,
        # $XDG_CONFIG_HOME, $XDG_CACHE_HOME and $TMPDIR without naming them,
        # so a helper could build the path to a credentials file. The group
        # refuses those calls. The writes (Setenv, Unsetenv, Clearenv, Chdir)
        # are tests-no-process-state's since issue #153, which holds here too,
        # so no line is reported by two groups. Scope: every file under
        # internal/testutil/, _test.go files included; its exclusion rule
        # drops it everywhere else.
        - pattern: '^os\.(?:Getenv|LookupEnv|ExpandEnv|Environ|StartProcess|UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'testutil-no-env: a test helper reads no environment variable, locates no home, config, cache or temp directory and starts no process, where credentials live; take what it needs as a parameter (CLAUDE.md rule 3)'
        # Group cli-no-env-or-process (issue #152): the CLI's code reads and
        # hands over no environment variable, locates no home, config, cache
        # or temp directory, starts no process and makes no raw system call.
        # A composition root may not do any of that itself
        # (composition-root-env, composition-root-no-exec), and without this
        # group it could hand the call to the CLI, where it would happen one
        # call deeper with lint green. cli-gets-adapters-from-cmd must allow
        # os, which the CLI reads the inventory a user names and creates the
        # report with, and os also reaches the environment, where credentials
        # live (CLAUDE.md rule 3). The os entry mirrors the roots' and
        # testutil-no-env's reads; the writes (Setenv, Unsetenv, Clearenv,
        # Chdir) are tests-no-process-state's, which holds here too, so no
        # line is reported by two groups. In production files syscall, unsafe
        # and os/exec are refused at the import by the CLI's strict allow
        # list; its tests may import syscall, for syscall.Mkfifo
        # (output_unix_test.go), so the syscall entry holds the roots' names
        # there: the environment reads, the process starts, the windows
        # entry points and DLL loaders, the raw system calls and the SYS_*
        # numbers. It is one entry with one msg, not the roots' three: the
        # windows names exist on windows only, test/lint's windows probe
        # lints cmd/ alone, and test/lint pins every name of the pattern
        # offline instead. depguard's composition-root-tests keeps unsafe,
        # os/exec and os/user out of the tests. The CLI reads no named
        # variable today, so the group has no exception. Scope: every file
        # under internal/cli/, _test.go files included; its exclusion rule
        # drops it everywhere else.
        - pattern: '^os\.(?:Getenv|LookupEnv|ExpandEnv|Environ|StartProcess|UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'cli-no-env-or-process: the CLI reads, writes and hands over no environment variable, locates no home, config, cache or temp directory and starts no process, where credentials live; the composition root passes what it needs as a flag value (CLAUDE.md rule 3)'
        - pattern: '^syscall\.(?:Getenv|GetEnvironmentVariable|Environ|Exec|ForkExec|StartProcess|CreateProcess|CreateProcessAsUser|GetEnvironmentStrings|LoadDLL|MustLoadDLL|NewLazyDLL|LoadLibrary|GetProcAddress|(?:(?:AllThreads|Raw)?Syscall(?:6|9|12|15|18|N)?|SYS_\w+))$'
          pkg: '^syscall$'
          msg: 'cli-no-env-or-process: the CLI has no call that starts or replaces a process, makes a raw system call or reads the environment, in its tests either; pass the value to the code under test (CLAUDE.md rule 3)'
        # Group httpapi-tests-no-env-or-process (issue #152): the HTTP API's
        # tests read no environment variable, locate no home, config, cache or
        # temp directory, start no process and make no raw system call. The
        # production files need no group: internal/httpapi's strict allow list
        # (httpapi-gets-adapters-from-cmd) leaves os and syscall out. Its
        # tests are compiled into the same package and run in the same process
        # as the code a root hands the work to, so they get the roots' call
        # limits, with the same names and for the same reasons as
        # cli-no-env-or-process (one syscall entry, pinned offline). The
        # writes are tests-no-process-state's; depguard's composition-root-tests
        # keeps unsafe, os/exec and os/user out. Scope: the _test.go files
        # under internal/httpapi/; its exclusion rule drops it everywhere else.
        - pattern: '^os\.(?:Getenv|LookupEnv|ExpandEnv|Environ|StartProcess|UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'httpapi-tests-no-env-or-process: a test of the HTTP API reads no environment variable and locates no home, config, cache or temp directory, where credentials live; pass the value to the code under test (CLAUDE.md rule 3)'
        - pattern: '^syscall\.(?:Getenv|GetEnvironmentVariable|Environ|Exec|ForkExec|StartProcess|CreateProcess|CreateProcessAsUser|GetEnvironmentStrings|LoadDLL|MustLoadDLL|NewLazyDLL|LoadLibrary|GetProcAddress|(?:(?:AllThreads|Raw)?Syscall(?:6|9|12|15|18|N)?|SYS_\w+))$'
          pkg: '^syscall$'
          msg: 'httpapi-tests-no-env-or-process: a test of the HTTP API starts or replaces no process, makes a raw system call or reads the environment; pass the value to the code under test (CLAUDE.md rule 3)'
        # Group tests-no-process-state (issue #153): a test changes no
        # environment variable and no working directory. t.Setenv and
        # os.Setenv change the environment of the whole test binary, so every
        # test in the process sees the variable, a credential's name among
        # them (CLAUDE.md rule 3), and t.Chdir and os.Chdir change the
        # directory a t.Parallel test shares. A test passes the value it wants
        # to the code under test, through a fake, a parameter, a flag or the
        # request.
        #
        # The first entry has no pkg and matches any method or function named
        # Setenv or Chdir, whatever its receiver. analyze-types renders a call
        # on the type the method is found on: testing.T.Setenv,
        # testing.TB.Setenv, a method value, os.Setenv and os.Chdir, but also
        # pkg.wrapper.Setenv for a struct that embeds *testing.T and
        # pkg.iface.Setenv for a named interface t is assigned to (probed on
        # the golangci-lint version CI pins). A testing-only entry missed the
        # last two. forbidigo renders nothing for a call through an interface
        # literal or a type parameter, so test/lint refuses every selector
        # named Setenv, Chdir, Unsetenv, Clearenv or Fchdir in the group's
        # scope on the AST (TestTestsChangeNoProcessStateByNoSelector). The
        # second entry refuses os.Unsetenv, os.Clearenv, syscall.Unsetenv,
        # syscall.Clearenv and syscall.Fchdir (issue #153's review: syscall
        # writes the same environment and working directory os does; os has
        # no Fchdir, the pattern refuses one all the same). A method called
        # through reflect stays a gap (docs/architecture.md, Known gaps). This
        # group owns the writes: testutil-no-env and cli-no-env-or-process
        # leave them out, so no line is reported twice.
        #
        # Scope: every file of the module but test/lint and test/architecture,
        # through one path exclusion rule: the adapters', domain's and e2e
        # tests are held too, so a source adapter's test cannot set
        # AWS_PROFILE. Those two harnesses call t.Setenv on purpose, to run
        # the go command in a known environment (GOCACHE, GOFLAGS, HOME) in a
        # test binary of their own. t.TempDir, os.MkdirTemp("", ...) and
        # os.CreateTemp("", ...) stay allowed: they read $TMPDIR implicitly
        # and return a fresh temporary path, never a home, config or
        # credential path (docs/architecture.md, Known gaps).
        - pattern: '^(?:[\w*()\[\]]+\.)+(?:Setenv|Chdir)$'
          msg: 'tests-no-process-state: a test changes no environment variable and no working directory, which every test of the process shares; pass the value to the code under test through a fake or a parameter (CLAUDE.md rule 3)'
        - pattern: '^(?:os|syscall)\.(?:Unsetenv|Clearenv|Fchdir)$'
          pkg: '^(?:os|syscall)$'
          msg: 'tests-no-process-state: a test changes no environment variable and no working directory of the process, which every test in it shares; pass the value to the code under test through a fake or a parameter (CLAUDE.md rule 3)'
        # Group inventoryfile-no-env (issue #152): the inventory-file reader
        # reads no environment variable, locates no home, config, cache or
        # temp directory and starts no process. inventory-file-reader-reads-one-file
        # must allow os, for os.Open, and cmd/shift2eu imports the reader, so
        # without this group a root could hand it a call it may not make
        # itself. The names are testutil-no-env's and cli-no-env-or-process's:
        # every module package whose strict rule allows os is held by such a
        # group (test/architecture's TestEveryOsAllowingRuleHasAnEnvironmentGroup).
        # The writes are tests-no-process-state's, which holds here too, so no
        # line is reported by two groups. Scope: every file under
        # internal/adapter/source/inventoryfile/, _test.go files included; its
        # exclusion rule drops it everywhere else.
        - pattern: '^os\.(?:Getenv|LookupEnv|ExpandEnv|Environ|StartProcess|UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'inventoryfile-no-env: the inventory-file reader reads no environment variable, locates no home, config, cache or temp directory and starts no process, where credentials live; cmd/shift2eu passes the file it names (CLAUDE.md rule 3)'
        # Group e2e-no-env (issue #167): the e2e tier reads no environment
        # variable, looks up no home, config, cache or temp directory
        # directly and starts no process through os or syscall. It refuses
        # os.TempDir, the direct temp-directory lookup, not every use of
        # $TMPDIR: os.MkdirTemp("", ...) still reads it, as in every other
        # test (tests-no-process-state). The syscall entry has the names and
        # the shape of the roots' entries: the unix and windows reads, the
        # windows library loads, the raw system calls (AllThreadsSyscall
        # among them) and the syscall.SYS_* numbers. Every name is a pattern,
        # so a name that exists on one release target only costs nothing on
        # the others, and make lint lints every target. That rule,
        # e2e-is-black-box, allows $gostd, which test/architecture's
        # TestEveryOsAllowingRuleHasAnEnvironmentGroup reads as allowing os
        # and syscall both, so test/e2e is held by a group that refuses the
        # reads of both. The exec.Cmd entry (issue #185) refuses Environ,
        # which hands a child the whole environment of the test process. Its
        # limit: a method promoted through an embedded *exec.Cmd (type w
        # struct{ *exec.Cmd }; w{cmd}.Environ()) is rendered under the
        # embedding type and is not refused. The entry is defence in depth
        # for $test, since the non-test files cannot import os/exec. The
        # _test.go files keep $gostd to build and run the binary with
        # os/exec. The runs of the binary (run and the server helpers) set
        # cmd.Env; the go build calls in TestMain and the go list -deps calls
        # leave Env nil and inherit the environment, which the go toolchain
        # needs. A nil Env in a _test.go file is refused by test/lint's
        # TestE2ETestsSetExecEnv (issue #195), which fails closed on every
        # command it cannot follow, apart from the go build and go list
        # calls it exempts while each literal flag is on its allow-list and
        # the four gaps test/internal/execenv documents. In the non-test
        # files, doc.go today, test-docs-are-pure refuses os/exec,
        # unsafe and os/user at the import (TestE2EImportsProbe and
        # test/architecture's depguard pin hold it), so an exec.Cmd with a
        # nil Env, which inherits the whole environment, cannot be written
        # there through an import. An assembly file needs no import, so
        # test/lint refuses one there (issue #194). The group is defence in
        # depth there.
        # Scope: every file under test/e2e/, _test.go files included; its
        # exclusion rule drops it everywhere else.
        - pattern: '^os\.(?:Getenv|LookupEnv|ExpandEnv|Environ|StartProcess|UserHomeDir|UserConfigDir|UserCacheDir|TempDir)$'
          pkg: '^os$'
          msg: 'e2e-no-env: the e2e tier reads no environment variable, looks up no home, config, cache or temp directory directly and starts no process through os or syscall, where credentials live; it runs the binary with os/exec (CLAUDE.md rule 3)'
        - pattern: '^syscall\.(?:Getenv|GetEnvironmentVariable|Environ|Exec|ForkExec|StartProcess|CreateProcess|CreateProcessAsUser|GetEnvironmentStrings|LoadDLL|MustLoadDLL|NewLazyDLL|LoadLibrary|GetProcAddress|(?:(?:AllThreads|Raw)?Syscall(?:6|9|12|15|18|N)?|SYS_\w+))$'
          pkg: '^syscall$'
          msg: 'e2e-no-env: the e2e tier reads no environment variable, starts or replaces no process, loads no library and makes no raw system call through os or syscall, where credentials live; it runs the binary with os/exec (CLAUDE.md rule 3)'
        - pattern: '^exec\.Cmd\.Environ$'
          pkg: '^os/exec$'
          msg: 'e2e-no-env: a command hands its child the whole environment of the test process, where credentials live; set cmd.Env to the variables the binary needs (CLAUDE.md rule 3)'
    gosec:
      excludes:
        - G104 # unchecked errors are already reported by errcheck
    # A nolint directive names the linters it silences and says why, as in
    # //nolint:gosec // a test golden file, not user input. A bare //nolint
    # silences every linter on its line, depguard included. nolintlint cannot
    # refuse one named linter, and it accepts some directives that silence
    # every linter, such as //nolint: all with a space after the colon, so
    # test/lint refuses each directive that would hide a depguard issue.
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    # Every file is linted, also one golangci-lint would take for generated
    # code. In lax mode a comment above the package clause that holds "do not
    # edit", "code generated" or "autogenerated file" marks a file as
    # generated and drops every issue in it, depguard's included, and a
    # hand-written file can carry such a comment. The repository has no
    # generated code; exclude generated code added later by its path.
    generated: disable
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - unparam
      # Tests get gosec too, the e2e and integration tests included, apart
      # from two rules they trip by design: G204 (a subprocess launched with a
      # variable), because test/e2e runs the built binary, and G304 (a file
      # opened from a variable path), because tests open fixture and golden
      # files. gosec's message starts with its rule ID, so text matches it.
      - path: _test\.go
        linters:
          - gosec
        text: "^G(204|304):"
      # The URL-rejection tests feed sanitised userinfo placeholders such as
      # https://user:pass@example.com/ to the catalog to prove it refuses
      # them, and G101 (hard-coded credentials) reads them as secrets. They
      # are none. The rule covers G101 in this one file only, so a hard-coded
      # credential in any other file is still reported.
      - path: internal/domain/catalog/catalog_test\.go
        linters:
          - gosec
        text: "^G101:"
      # domain-is-pure: the forbidigo group of that name holds for production
      # files under internal/domain/ only. These two rules drop its issues in
      # every other path and in every _test.go file. text has the form the
      # forbidigo settings set out, so no other group's issue is dropped.
      - path-except: ^internal/domain/
        linters:
          - forbidigo
        text: 'because "domain-is-pure: [^"]*"$'
      - path: _test\.go$
        linters:
          - forbidigo
        text: 'because "domain-is-pure: [^"]*"$'
      # composition-root-no-exec and composition-root-env: both groups hold
      # for every file under cmd/shift2eu/ and cmd/shift2eu-server/, _test.go
      # files included (see the groups in the forbidigo settings). One
      # path-except rule per group: two per-root rules would each drop the
      # other root's issues.
      - path-except: ^cmd/shift2eu(?:-server)?/
        linters:
          - forbidigo
        text: 'because "composition-root-no-exec: [^"]*"$'
      - path-except: ^cmd/shift2eu(?:-server)?/
        linters:
          - forbidigo
        text: 'because "composition-root-env: [^"]*"$'
      # testutil-no-env: the group holds for every file under
      # internal/testutil/, _test.go files included, and nowhere else.
      - path-except: ^internal/testutil/
        linters:
          - forbidigo
        text: 'because "testutil-no-env: [^"]*"$'
      # cli-no-env-or-process: the group holds for every file under
      # internal/cli/, _test.go files included, and nowhere else; the roots'
      # own groups hold under cmd/.
      - path-except: ^internal/cli/
        linters:
          - forbidigo
        text: 'because "cli-no-env-or-process: [^"]*"$'
      # httpapi-tests-no-env-or-process: the group holds for the _test.go
      # files under internal/httpapi/ and nowhere else; the production files
      # are held by their strict import rule.
      - path-except: ^internal/httpapi/.*_test\.go$
        linters:
          - forbidigo
        text: 'because "httpapi-tests-no-env-or-process: [^"]*"$'
      # tests-no-process-state: the group holds for every file but those of
      # test/lint and test/architecture, which set the go command's own
      # variables on purpose.
      - path: ^test/(?:lint|architecture)/
        linters:
          - forbidigo
        text: 'because "tests-no-process-state: [^"]*"$'
      # The one exception (ADR 0019): os.LookupEnv(tokenEnvVar), the call the
      # token source that main.go passes to run makes for
      # SHIFT2EU_SERVER_TOKEN, in cmd/shift2eu-server/main.go alone. text is
      # the os.LookupEnv entry's msg, so os.Getenv, os.ExpandEnv and
      # syscall.Getenv are still refused there.
      - path: ^cmd/shift2eu-server/main\.go$
        linters:
          - forbidigo
        text: 'because "composition-root-env: os\.LookupEnv is called in cmd/shift2eu-server/main\.go only, for SHIFT2EU_SERVER_TOKEN, in the token source it hands to run \(ADR 0019\); take any other value as a flag"$'
      # inventoryfile-no-env: the group holds for every file under
      # internal/adapter/source/inventoryfile/, _test.go files included, and
      # nowhere else.
      - path-except: ^internal/adapter/source/inventoryfile/
        linters:
          - forbidigo
        text: 'because "inventoryfile-no-env: [^"]*"$'
      # e2e-no-env: the group holds for every file under test/e2e/, _test.go
      # files included, and nowhere else.
      - path-except: ^test/e2e/
        linters:
          - forbidigo
        text: 'because "e2e-no-env: [^"]*"$'

formatters:
  enable:
    - gofumpt
    - goimports
  # As for the linters (linters.exclusions.generated): golangci-lint fmt (make
  # fmt) formats a file that looks generated too, so it fixes what golangci-lint
  # run reports there.
  exclusions:
    generated: disable
  settings:
    goimports:
      local-prefixes:
        - github.com/timothymamo/shift2eu
