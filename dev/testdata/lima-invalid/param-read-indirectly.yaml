          "(^|[\\n;&|()`{'\"])[ \\t]*(([0-9]*[<>&][<>&|]*[ \\t]*[^\\s;&|()<>`]+|[A-Za-z_][A-Za-z0-9_]*=\\S*|then|do|else|elif|if|while|until|!|(\\S*/)?(sudo|command|builtin|exec|nohup|time|xargs|timeout|nice|ionice|stdbuf|doas|busybox|eval|env|bash|sh|zsh|dash|ksh|setsid|strace|ltrace|watch|script|unbuffer|su|runuser|fish|coproc)([ \\t]+(-\\S*([ \\t]+[^-\\s;&|()<>`]\\S*)?|[0-9][0-9.]*[smhd]?|[A-Za-z_][A-Za-z0-9_]*=\\S*)){0,4}|(\\S*/)?(flock|chroot)([ \\t]+-\\S*){0,4}[ \\t]+[^-\\s;&|()<>`]\\S*)[ \\t]+){0,6}['\"\\\\]?(declare|typeset)([ \\t]*($|[0-9]+[<>]|[\\n;&|()<>`}'\"])|[ \\t]+-[a-zA-Z]*[px])",
          "(^|[\\n;&|()`{'\"])[ \\t]*(([0-9]*[<>&][<>&|]*[ \\t]*[^\\s;&|()<>`]+|[A-Za-z_][A-Za-z0-9_]*=\\S*|then|do|else|elif|if|while|until|!|(\\S*/)?(sudo|command|builtin|exec|nohup|time|xargs|timeout|nice|ionice|stdbuf|doas|busybox|eval|env|bash|sh|zsh|dash|ksh|setsid|strace|ltrace|watch|script|unbuffer|su|runuser|fish|coproc)([ \\t]+(-\\S*([ \\t]+[^-\\s;&|()<>`]\\S*)?|[0-9][0-9.]*[smhd]?|[A-Za-z_][A-Za-z0-9_]*=\\S*)){0,4}|(\\S*/)?(flock|chroot)([ \\t]+-\\S*){0,4}[ \\t]+[^-\\s;&|()<>`]\\S*)[ \\t]+){0,6}['\"\\\\]?compgen[ \\t]+(-[a-zA-Z]*[veA]|.*[ \\t]-A)",
          "(^|[\\n;&|()`{'\"])[ \\t]*(([0-9]*[<>&][<>&|]*[ \\t]*[^\\s;&|()<>`]+|[A-Za-z_][A-Za-z0-9_]*=\\S*|then|do|else|elif|if|while|until|!|(\\S*/)?(sudo|command|builtin|exec|nohup|time|xargs|timeout|nice|ionice|stdbuf|doas|busybox|eval|env|bash|sh|zsh|dash|ksh|setsid|strace|ltrace|watch|script|unbuffer|su|runuser|fish|coproc)([ \\t]+(-\\S*([ \\t]+[^-\\s;&|()<>`]\\S*)?|[0-9][0-9.]*[smhd]?|[A-Za-z_][A-Za-z0-9_]*=\\S*)){0,4}|(\\S*/)?(flock|chroot)([ \\t]+-\\S*){0,4}[ \\t]+[^-\\s;&|()<>`]\\S*)[ \\t]+){0,6}['\"\\\\]?(\\S*/)?ps[ \\t]+[A-Za-z]*e[A-Za-z]*($|[\\s;&|()<>`}'\"])",
