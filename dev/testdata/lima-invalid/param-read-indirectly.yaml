# Isolated environment for running dot-agent-deck and its agents.
#
# Create it with `make vm-up`, which passes `--mount-only <workspace>:w`: the
# repository's parent directory, which holds only this repository and the
# worktrees dot-agent-deck's dispatcher creates beside it, is the ONLY host path
# the VM can see. Agents running inside cannot read ~/.ssh, ~/.aws, ~/.azure,
# ~/.config/gcloud or anything else on the Mac.
#
# Everything the agents need is installed here, so nothing about the agent
# toolchain has to be installed on the host. See docs/dev-environment.md.
minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu-lts

vmType: vz
cpus: 4
memory: 16GiB
disk: 40GiB

# Deliberately empty: host mounts come only from `--mount-only` in the Makefile.
mounts: []

# Lima's own containerd stays off: the provisioning below installs a rootless containerd and BuildKit
# (nerdctl-full) at a version pinned here rather than the one the host's Lima bundles. Nothing rootful:
# no root daemon, no docker group, no socket the VM user can use to become root
# (docs/adr/0017-run-a-rootless-container-runtime-in-the-lima-vm.md).
containerd:
  system: false
  user: false

# Kept current by Renovate through the "# renovate:" comments (.github/renovate.json5).
param:
  # renovate: datasource=golang-version depName=go
  goVersion: "1.27.4"
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  golangciLintVersion: "v2.15.0"
  # renovate: datasource=go depName=golang.org/x/vuln
  govulncheckVersion: "v1.10.0"
  # renovate: datasource=github-releases depName=vfarcic/dot-agent-deck
  dotAgentDeckVersion: "v0.51.4"
  # renovate: datasource=node-version depName=node versioning=node
  nodeVersion: "26.13.1"
  # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
  piVersion: "1.6.1"
  # gh from its release, not Ubuntu's package: `gh attestation verify` needs gh 2.49 or later.
  # renovate: datasource=github-releases depName=cli/cli
  ghVersion: "v2.106.0"
  # SHA-256 of gh_<version>_linux_<arch>.tar.gz, per architecture: what authenticates gh in provisioning
  # (ADR 0017). The vm-tools workflow checks it against gh's build attestation on every PR: merge a change
  # only when that check is green (not yet a required status). Renovate moves each digestVersion and
  # digest together with ghVersion, in one PR; a digest left behind fails provisioning.
  # renovate: datasource=github-release-attachments depName=cli/cli digestVersion=v2.106.0
  ghSha256Amd64: "a476449fa9625413c54a3734eded62e9e480e49f421ff08e7f3b3879c059a033"
  # renovate: datasource=github-release-attachments depName=cli/cli digestVersion=v2.106.0
  ghSha256Arm64: "5e8a0c51e1a8345f36bd0b8bb88604b6a5388df16f3ab3e3b9b6d794fa223a67"
  # cosign v3 or later reads the release's signature bundles (docs/guide/verify-releases.md).
  # renovate: datasource=github-releases depName=sigstore/cosign
  cosignVersion: "v3.1.6"
  # SHA-256 of cosign-linux-<arch>, per architecture: what authenticates cosign in provisioning, where no
  # trusted cosign exists yet to verify it (ADR 0017). The vm-tools workflow checks it against
  # sigstore/cosign's keyless signature with an independently installed cosign on every PR: merge a
  # change only when that check is green (not yet a required status). Updated like the gh digests.
  # renovate: datasource=github-release-attachments depName=sigstore/cosign digestVersion=v3.1.6
  cosignSha256Amd64: "318a99ade4156a0c4113aa983b46c0a0830fa7896a096c63121ee47b610a94c6"
  # renovate: datasource=github-release-attachments depName=sigstore/cosign digestVersion=v3.1.6
  cosignSha256Arm64: "bbb2ebc765f483cf9fac42da8763dddc2b55b350ee12ea0c44a520a6d6d52334"
  # nerdctl-full: nerdctl, containerd, BuildKit, RootlessKit, runc and CNI plugins, run rootless.
  # renovate: datasource=github-releases depName=containerd/nerdctl
  nerdctlVersion: "v2.4.2"
  # shellcheck, which make lint runs on the tracked shell scripts and actionlint on the workflows' run:
  # scripts (ADR 0022). The same pin as CI's lint-shell job in .github/workflows/ci.yml.
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  shellcheckVersion: "v0.11.0"
  # SHA-256 of shellcheck-<version>.linux.<x86_64|aarch64>.tar.gz, per architecture, checked as the gh
  # digests are and updated with shellcheckVersion in the same Renovate PR, which updates ci.yml's too.
  # renovate: datasource=github-release-attachments depName=koalaman/shellcheck digestVersion=v0.11.0
  shellcheckSha256Amd64: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
  # renovate: datasource=github-release-attachments depName=koalaman/shellcheck digestVersion=v0.11.0
  shellcheckSha256Arm64: "68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc"
  # crane resolves a tag to its digest without pulling the image (docs/guide/verify-releases.md).
  # renovate: datasource=go depName=github.com/google/go-containerregistry
  craneVersion: "v0.22.1"
  # Size of the guest's swap file, /swapfile, in whole GiB; "0GiB" provisions none (issue #294). It absorbs
  # the memory spikes of go test -race and of builds in several worktrees at once, so the OOM killer does not
  # kill an agent mid-task: the VM ran with no swap and died on 2026-11-19 with two units running. The file
  # takes this much of the guest's disk, counted against VM_DISK (40GiB by default); the step skips it when
  # the disk has less than twice the size free. Change it on an existing VM with limactl edit and a restart
  # (docs/dev-environment.md, Swap). Not a tool version: no Renovate comment.
  swapSize: "4GiB"
  # The Ubuntu mirror the archive URIs of /etc/apt/sources.list.d/ubuntu.sources point at (issue #498): the
  # default is where cloud-init points them, so it changes nothing. make vm-create UBUNTU_MIRROR=<url> sets it
  # when the VM is created, for a host whose network reaches archive.ubuntu.com slowly or not at all
  # (docs/dev-environment.md, The Ubuntu mirror). Not a tool version: no Renovate comment.
  ubuntuMirror: "http://archive.ubuntu.com/ubuntu"

provision:
  # The swap file, before the installs below, so they already run with it. Its own step, so the swap's
  # reasons stay together; system mode, as root, at every boot and every re-provision.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # Idempotent, as Lima runs it at every boot and re-provision: an active file of the right size is left
      # alone, an inactive one is only switched on, and one of another size (after a change of the param) is
      # switched off and recreated; one that swapon refuses (most likely no swap header) is recreated once.
      # swapon here, at every boot, is what turns it on again: no /etc/fstab entry.
      # SHIFT2EU_SWAP_ROOT is empty in the guest; the tests (test/devenv/limaswap_test.go) point it at a fake
      # root, as SHIFT2EU_VM_BIN_GH does for dev/vm-gh-wrapper.sh. Kept to bash 3.2, which the tests may run.
      root="${SHIFT2EU_SWAP_ROOT:-}"
      swapfile="${root}/swapfile"
      size="${PARAM_swapSize:?Lima passes the swapSize param of dev/lima.yaml}"

      # Whole GiB only, checked before anything changes: the value reaches the commands below only as a number.
      gib="${size%GiB}"
      case "${size}" in
        *GiB) ;;
        *) gib="" ;;
      esac
      case "${gib}" in
        '' | *[!0-9]* | 0?* | ?????*)
          echo >&2 "swapSize ${size} in dev/lima.yaml is not a whole number of GiB below 10000GiB (such as 4GiB, or 0GiB for no swap file). No swap file provisioned."
          exit 1
          ;;
      esac
      if [ "${gib}" -eq 0 ]; then
        echo >&2 "swapSize is 0GiB: no swap file provisioned, nothing changed."
        exit 0
      fi
      bytes=$((gib * 1073741824))

      # Builds the file atomically: fallocate, chmod and mkswap on a temporary file in the swap file's own
      # directory, renamed into place only once it has a swap header, so a crash midway never leaves a
      # headerless file at the path swapon reads. Created under umask 077, so no other account of the guest
      # can read it before chmod. The old file goes first, inactive by now, so its space is reused (and
      # fallocate never shrinks a file).
      tmpfile="${swapfile}.new"
      build_swapfile() {
        rm -f "${swapfile}" "${tmpfile}"
        (
          umask 077
          fallocate -l "${bytes}" "${tmpfile}"
        )
        chmod 0600 "${tmpfile}"
        mkswap "${tmpfile}"
        mv -f "${tmpfile}" "${swapfile}"
      }

      # Read whole, not piped into grep -q, which under pipefail could fail swapon with SIGPIPE.
      swaps="$(swapon --show=NAME --noheadings)"
      active=0
      if printf '%s\n' "${swaps}" | grep -qxF "${swapfile}"; then
        active=1
      fi
      current=0
      if [ -f "${swapfile}" ]; then
        current="$(wc -c <"${swapfile}" | tr -d ' ')"
      fi
      # A leftover temporary file, from a crash between fallocate and the rename, is never active swap: removed
      # before df reads the free space, so its space counts as free. Kept, it would make a tight disk decline
      # at every boot, keep the orphan and leave the guest with no swap for ever.
      rm -f "${tmpfile}"

      if [ "${current}" -ne "${bytes}" ]; then
        # 4GiB fits the template's 40GiB disk with room to spare, but VM_DISK may be as small as 1GiB: with
        # less than twice the size free (the old file counted as free, as it goes), the guest keeps no swap
        # rather than a full disk. A warning, not a failure, so the VM still comes up.
        avail="$(df --output=avail -B1 "$(dirname "${swapfile}")" | tail -n1 | tr -d ' ')"
        case "${avail}" in
          '' | *[!0-9]*) avail=0 ;;
        esac
        if [ $((avail + current)) -lt $((2 * bytes)) ]; then
          echo >&2 "swapSize ${size}: ${swapfile} needs twice its size free and the disk has ${avail} bytes; no swap file provisioned. Grow VM_DISK or lower swapSize (docs/dev-environment.md, Swap)."
          exit 0
        fi
        if [ "${active}" -eq 1 ]; then
          swapoff "${swapfile}"
          active=0
        fi
        build_swapfile
      fi
      if [ "${active}" -eq 0 ] && ! swapon "${swapfile}"; then
        # A file of the right size that swapon refuses most likely has no swap header (an interrupted creation,
        # one a crash cut short before this step built the file atomically). Rebuilt once, in the old file's
        # space; a second failure stops the step rather than recreating the file at every boot.
        echo >&2 "swap: swapon ${swapfile} failed; recreating the swap file once."
        build_swapfile
        if ! swapon "${swapfile}"; then
          echo >&2 "swap: swapon ${swapfile} failed again after recreating it; the guest runs without swap (docs/dev-environment.md, Swap)."
          exit 1
        fi
      fi

      # A low swappiness: the swap is a safety net against the OOM killer, not a place to page out the
      # agents' working set while memory is merely busy. A drop-in of its own, so nothing else changes.
      mkdir -p "${root}/etc/sysctl.d"
      dropin="${root}/etc/sysctl.d/99-shift2eu-swap.conf"
      printf '# dev/lima.yaml, issue #294: swap only under real memory pressure.\nvm.swappiness = 10\n' >"${dropin}"
      sysctl -p "${dropin}"

  # apt's timeouts and retries and the Ubuntu mirror (issue #498), before the first apt-get call of the step
  # below. On 2026-11-23 a trickling archive.ubuntu.com held apt-get update for 14 minutes, and the only symptom
  # was Lima's 600-second probe timeout. System mode, as /etc/apt is root's; at every boot and re-provision,
  # idempotent.
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      # SHIFT2EU_APT_ROOT is empty in the guest; only the tests (test/devenv/limaaptstep_test.go) set it, to a
      # fake root, as SHIFT2EU_SWAP_ROOT does for the swap step. Kept to bash 3.2, which the tests may run.
      root="${SHIFT2EU_APT_ROOT:-}"
      # One drop-in covers every apt-get call of every step, update, install and remove alike: a connection that
      # stalls (no data for 30 seconds) fails, and each fetch is retried 5 times, so a mirror that stays down
      # fails provisioning with apt's own error in /var/log/cloud-init-output.log instead of hanging. A slow but
      # moving mirror never trips the timeout: that is what the ubuntuMirror param is for. The name holds no
      # period: apt.conf.d ignores a file whose name has one.
      mkdir -p "${root}/etc/apt/apt.conf.d"
      printf '%s\n' '// dev/lima.yaml, issue 498: a stalled mirror fails and is retried instead of hanging.' \
        'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "5";' \
        >"${root}/etc/apt/apt.conf.d/80shift2eu-timeouts"

      # The archive URIs cloud-init writes into ubuntu.sources become the ubuntuMirror param; the security URIs
      # (security.ubuntu.com) stay, so a mirror picked for speed never carries the security updates. The param is
      # checked again here, as limactl edit can set it without make vm-up: an http:// or https:// URL with a host,
      # of letters, digits and . - / : _ ~ only, so no backslash for awk -v to read as an escape.
      # The default is where cloud-init points the archive, so it changes nothing, even with no ubuntu.sources.
      # Idempotent: once rewritten, a URIs line names the mirror, and a field that is the mirror and an archive URI
      # at once (a mirror on archive.ubuntu.com's own host) is rewritten to itself. A country mirror, whose host
      # only ends in that name, is no match (the host must follow ://). A file with
      # no archive URI that does not already name the mirror (a ports file, a country mirror) fails the step and
      # stays as it was: a warning would leave the VM on the archive the mirror was meant to replace. It is set
      # when the VM is created; this step keeps it at every boot (docs/dev-environment.md, The Ubuntu mirror).
      case "${PARAM_ubuntuMirror:?Lima passes the ubuntuMirror param of dev/lima.yaml}" in
        *[!A-Za-z0-9./:_~-]*) mirror_ok=0 ;;
        http://[A-Za-z0-9]* | https://[A-Za-z0-9]*) mirror_ok=1 ;;
        *) mirror_ok=0 ;;
      esac
      if [ "${mirror_ok}" -ne 1 ]; then
        echo >&2 "ubuntuMirror ${PARAM_ubuntuMirror} is not an http:// or https:// URL with a host, of letters, digits and . - / : _ ~ only. Nothing rewritten."
        exit 1
      fi
      sources="${root}/etc/apt/sources.list.d/ubuntu.sources"
      # One awk program, POSIX awk only (the Mac's is BSD's), for the guard, the rewrite and the message alike, so
      # the URIs field and the archive match are defined once. It looks only at the URIs field; every other line, a
      # field of another name or a comment, is no URI apt fetches from. As deb822 has it, the field starts on a
      # line that begins with its name in any case (uris:, URIs:, URIS:) and continues on the lines after it that
      # start with a space or a tab; the first line that starts with neither (a field of another name, the blank
      # line between stanzas) ends it. A comment starts with # in the first column: it ends nothing and is never
      # part of the field. On each line of the field it walks the whitespace-separated fields after the name with
      # match(), keeping each separator (a continuation's leading whitespace too) as it is, and a field that is
      # exactly an http(s)://archive.ubuntu.com/ubuntu URI, with or without its trailing slash, becomes the mirror
      # with one: per field, in one pass, so any number of archive URIs is rewritten, a mirror on
      # archive.ubuntu.com's own host included, and a line with none comes out byte for byte. mode=rewrite prints
      # the file; mode=find exits 0 when the field holds an archive URI, mode=named when it already names the
      # mirror; mode=list prints the field's lines.
      uris_awk='
        function archive(f) { return f ~ /^https?:\/\/archive\.ubuntu\.com\/ubuntu\/?$/ }
        /^#/ { if (mode == "rewrite") print; next }
        !/^[ \t]/ { uris = ($0 ~ /^[Uu][Rr][Ii][Ss]:/) }
        !uris { if (mode == "rewrite") print; next }
        {
          if (mode == "list") print
          out = ""; rest = $0
          if (match(rest, /^[Uu][Rr][Ii][Ss]:/)) { out = substr(rest, 1, RLENGTH); rest = substr(rest, RLENGTH + 1) }
          while (match(rest, /[^ \t]+/)) {
            sep = substr(rest, 1, RSTART - 1); f = substr(rest, RSTART, RLENGTH); rest = substr(rest, RSTART + RLENGTH)
            if (archive(f)) { found = 1; f = mirror "/" } else if (f == mirror || f == mirror "/") named = 1
            out = out sep f
          }
          if (mode == "rewrite") print out rest
        }
        END { if (mode == "find") exit !found; if (mode == "named") exit !named }'
      mirror="${PARAM_ubuntuMirror%/}"
      if [ "${mirror}" != "http://archive.ubuntu.com/ubuntu" ]; then
        if [ ! -f "${sources}" ]; then
          echo >&2 "ubuntuMirror ${PARAM_ubuntuMirror}: ${sources} does not exist, so the mirror cannot be set (docs/dev-environment.md, The Ubuntu mirror)."
          exit 1
        fi
        if awk -v mode=find -v mirror="${mirror}" "${uris_awk}" "${sources}"; then
          # Written beside the file and copied back with cat, which keeps its mode and owner. The trap removes the
          # temporary file on every exit, a failed awk included, but not after a failed cat: that copy may have
          # stopped halfway and truncated ubuntu.sources, so the temporary file is the only complete copy and stays,
          # named on stderr. apt reads only the *.list and *.sources names of sources.list.d, so it is no source.
          new="${sources}.shift2eu-new"
          trap 'rm -f "${new}"' EXIT
          awk -v mode=rewrite -v mirror="${mirror}" "${uris_awk}" "${sources}" >"${new}"
          if ! cat "${new}" >"${sources}"; then
            trap - EXIT
            echo >&2 "ubuntuMirror ${PARAM_ubuntuMirror}: copying ${new} over ${sources} failed; ${sources} may be truncated, the rewritten file is kept at ${new} (copy it over ${sources} by hand; docs/dev-environment.md, The Ubuntu mirror)."
            exit 1
          fi
        elif ! awk -v mode=named -v mirror="${mirror}" "${uris_awk}" "${sources}"; then
          echo >&2 "ubuntuMirror ${PARAM_ubuntuMirror}: ${sources} has no http(s)://archive.ubuntu.com/ubuntu URI to rewrite and does not name the mirror, so the mirror cannot be set; nothing changed. Its URIs lines (docs/dev-environment.md, The Ubuntu mirror):"
          awk -v mode=list -v mirror="${mirror}" "${uris_awk}" "${sources}" >&2 || true
          exit 1
        fi
      fi

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      # Provisioning re-runs on every boot, so each step is skipped when already done.
      # uidmap (newuidmap, newgidmap) and slirp4netns are what rootless containerd needs from the system.
      pkgs="build-essential ca-certificates curl git gnupg jq make ripgrep slirp4netns uidmap unzip"
      if ! dpkg -s ${pkgs} >/dev/null 2>&1; then
        apt-get update
        apt-get install -y --no-install-recommends ${pkgs}
      fi
      # gh comes from its release below; Ubuntu's older package goes, so there is one gh on the PATH.
      if dpkg -s gh >/dev/null 2>&1; then
        apt-get remove -y gh
      fi

      arch="$(dpkg --print-architecture)" # amd64 | arm64, matching Go's naming

      # Stops provisioning unless <file> has the SHA-256 pinned in dev/lima.yaml as param <name><Arch>
      # (ghSha256Amd64, ...). A version bump whose digests were not updated with it stops here too. Called
      # in the subshells below, whose EXIT trap removes the rejected download. Callers pass both digests as
      # PARAM_<name>Amd64 and PARAM_<name>Arm64, by name: Lima refuses a param that no script names, and
      # cannot see one read through ${!var}.
      check_pinned_sha256() { # <file> <param name without the architecture> <amd64 digest> <arm64 digest>
        local expected actual
        case "${arch}" in
          amd64) expected="$3" ;;
          arm64) expected="$4" ;;
        esac
        actual="$(sha256sum "$1" | cut -d' ' -f1)"
        if [ -z "${expected}" ] || [ "${actual}" != "${expected}" ]; then
          echo >&2 "$(basename "$1"): SHA-256 ${actual} does not match ${2}${arch^} (${expected:-not set})" \
            "in dev/lima.yaml. Not installed. If the version was just bumped and the digest was not, take the" \
            "new digest from the release only after verifying the asset (docs/dev-environment.md, Updating gh and cosign)."
          exit 1
        fi
      }
      # Go, verified against the published checksum.
      if ! /usr/local/go/bin/go version 2>/dev/null | grep -q "go${PARAM_goVersion} "; then
        tarball="go${PARAM_goVersion}.linux-${arch}.tar.gz"
        tmp="$(mktemp -d)"
        curl -fsSL -o "${tmp}/${tarball}" "https://dl.google.com/go/${tarball}"
        echo "$(curl -fsSL "https://dl.google.com/go/${tarball}.sha256")  ${tmp}/${tarball}" | sha256sum --check --strict
        rm -rf /usr/local/go
        tar -C /usr/local -xzf "${tmp}/${tarball}"
        rm -rf "${tmp}"
      fi

      # Node.js, needed by pi. Official build, verified against the release checksums.
      if ! /usr/local/node/bin/node --version 2>/dev/null | grep -qx "v${PARAM_nodeVersion}"; then
        tarball="node-v${PARAM_nodeVersion}-linux-${arch/amd64/x64}.tar.gz"
        tmp="$(mktemp -d)"
        curl -fsSL -o "${tmp}/${tarball}" "https://nodejs.org/dist/v${PARAM_nodeVersion}/${tarball}"
        curl -fsSL -o "${tmp}/SHASUMS256.txt" "https://nodejs.org/dist/v${PARAM_nodeVersion}/SHASUMS256.txt"
        (cd "${tmp}" && grep " ${tarball}\$" SHASUMS256.txt | sha256sum --check --strict)
        rm -rf /usr/local/node && mkdir -p /usr/local/node
        tar -C /usr/local/node --strip-components=1 --no-same-owner -xzf "${tmp}/${tarball}"
        rm -rf "${tmp}"
      fi

      if ! golangci-lint --version 2>/dev/null | grep -q "version ${PARAM_golangciLintVersion#v} "; then
        curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/${PARAM_golangciLintVersion}/install.sh" \
          | sh -s -- -b /usr/local/bin "${PARAM_golangciLintVersion}"
      fi

      # cosign release binary. Its SHA-256 pin above is the trust anchor here: no trusted cosign exists
      # yet; the vm-tools workflow verifies the pinned digest's signature with an independently installed
      # cosign on every PR, and a pin is merged only with that check green. The self-check after it
      # guards integrity and the bundle's consistency only, not authenticity: the binary under test
      # verifies itself, against the trust root embedded in it (ADR 0017). It checks the bundle's certificate, signature and Rekor
      # inclusion proof offline; only Sigstore's TUF repository (tuf-repo-cdn.sigstore.dev) is fetched,
      # into a cache under ${tmp}, as is anything cosign writes to HOME. Before gh. Each subshell's EXIT
      # trap removes ${tmp} whether it installs or stops provisioning.
      if ! /usr/local/bin/cosign version 2>&1 | grep -qE "^GitVersion:[[:space:]]+${PARAM_cosignVersion}\$"; then
        (
          asset="cosign-linux-${arch}"
          base="https://github.com/sigstore/cosign/releases/download/${PARAM_cosignVersion}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL -o "${tmp}/${asset}" "${base}/${asset}"
          curl -fsSL -o "${tmp}/${asset}.sigstore.json" "${base}/${asset}.sigstore.json"
          check_pinned_sha256 "${tmp}/${asset}" cosignSha256 \
            "${PARAM_cosignSha256Amd64}" "${PARAM_cosignSha256Arm64}"
          chmod 0755 "${tmp}/${asset}"
          mkdir -m 0700 "${tmp}/home" "${tmp}/sigstore"
          if ! HOME="${tmp}/home" TUF_ROOT="${tmp}/sigstore" "${tmp}/${asset}" verify-blob \
            --bundle "${tmp}/${asset}.sigstore.json" \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com "${tmp}/${asset}"; then
            echo >&2 "cosign ${PARAM_cosignVersion}: ${asset} is not signed by sigstore/cosign's release identity. Not installed."
            exit 1
          fi
          install -m 0755 "${tmp}/${asset}" /usr/local/bin/cosign
        )
      fi

      # gh release binary, pinned by its SHA-256 above. Its attestation is not checked here, as `gh
      # attestation verify` needs a trusted gh and a GitHub token; the vm-tools workflow checks it for
      # every pinned digest on every PR, and a pin is merged only with that check green (ADR 0017).
      # Installed off the PATH, in /usr/local/libexec/shift2eu: /usr/local/bin/gh is the wrapper below.
      if ! /usr/local/libexec/shift2eu/gh --version 2>/dev/null | grep -q "^gh version ${PARAM_ghVersion#v} "; then
        (
          name="gh_${PARAM_ghVersion#v}_linux_${arch}"
          base="https://github.com/cli/cli/releases/download/${PARAM_ghVersion}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL -o "${tmp}/${name}.tar.gz" "${base}/${name}.tar.gz"
          check_pinned_sha256 "${tmp}/${name}.tar.gz" ghSha256 \
            "$(name=PARAM_ghSha256; name+=Amd64; echo "${!name}")" "${PARAM_ghSha256Arm64}"
          tar -C "${tmp}" --no-same-owner -xzf "${tmp}/${name}.tar.gz"
          install -D -m 0755 "${tmp}/${name}/bin/gh" /usr/local/libexec/shift2eu/gh
        )
      fi

      # The gh every agent, the deck, the git credential helper and make vm-init run: the wrapper of
      # dev/gh-app-token.sh, which hands the real gh the agents App's token from ~/.config/shift2eu, and
      # fails without it (PRD #161, ADR 0031). Root-owned and outside the workspace mount, so an
      # agent's edit of the workspace copy never changes the gh in use; plumbing, not a security boundary,
      # as the VM user has sudo. Copied into the template, as a VM keeps the template it was created with.
      # Keep the text between the GHWRAPPER lines identical to dev/gh-app-token.sh, which the tests run. The
      # one sed script pins the real gh's path, so the installed copy reads no SHIFT2EU_REAL_GH, and drops the
      # comment naming it; make vm-gh-wrapper (dev/vm-gh-wrapper.sh) applies the same script.
      (
        tmp="$(mktemp)"
        trap 'rm -f "${tmp}"' EXIT
        sed 's|^real=.*|real=/usr/local/libexec/shift2eu/gh|;/^# SHIFT2EU_REAL_GH /d' >"${tmp}" <<'GHWRAPPER'
      #!/bin/sh
      # The gh of the Lima VM (PRD #161 milestone 1,
      # docs/adr/0031-agents-open-pull-requests-as-a-github-app-with-tokens-minted-on-the-mac.md). dev/lima.yaml
      # installs a copy of this file, root-owned, as /usr/local/bin/gh (make vm-gh-wrapper does it for a VM created
      # before), and the real gh as /usr/local/libexec/shift2eu/gh, off the PATH: every agent, the deck, the git
      # credential helper and make vm-init run this wrapper. It is plumbing, not a security boundary: the VM user
      # has passwordless sudo and can run the real gh, or delete the token file, at will (ADR 0031).
      #
      # On every call it reads ~/.config/shift2eu/agents-app-token (the agents App's installation token, then
      # its expiry as Unix seconds, written by make agents-token on the Mac) and:
      #   - file present, well formed, mode 0600, the VM user's own and not expired: runs the real gh with the
      #     token as GH_TOKEN and the other GitHub token variables gh reads unset (the unset line below names
      #     them), every argument and standard input passed through;
      #   - anything else, a missing file included: fails without running gh, asking the maintainer to run
      #     make agents-token-refresh-start in the host clone on the Mac, never printing the file's content. There
      #     is no fallback: the App's token is the agents' only GitHub credential (PRD #161 milestone 3).
      # SHIFT2EU_REAL_GH names another real gh, for the tests: the installed copies pin real= and drop this line.

      real="${SHIFT2EU_REAL_GH:-/usr/local/libexec/shift2eu/gh}"
      file="${HOME:?HOME is not set}/.config/shift2eu/agents-app-token"

      refuse() {
        printf 'gh: %s is %s, so gh cannot use the agents App token; ask the maintainer to run make agents-token-refresh-start in the host clone on the Mac\n' \
          "${file}" "$1" >&2
        exit 1
      }

      [ -e "${file}" ] || [ -L "${file}" ] || refuse "missing"
      [ -f "${file}" ] && [ ! -L "${file}" ] || refuse "not a regular file"
      [ -z "$(find "${file}" -prune \( -perm -0040 -o -perm -0020 -o -perm -0010 -o -perm -0004 -o -perm -0002 -o -perm -0001 \) -print)" ] ||
        refuse "readable or writable by other accounts (want mode 0600)"
      [ -n "$(find "${file}" -prune -user "$(id -u)" -print)" ] || refuse "owned by another account"
      [ -r "${file}" ] || refuse "not readable"

      token=""
      expiry=""
      extra=""
      {
        IFS= read -r token || :
        IFS= read -r expiry || :
        IFS= read -r extra || :
      } <"${file}"

      # The token is opaque: an allow list, not a format parser. It takes both of GitHub's installation token
      # formats, ghs_ and 36 alphanumerics, and ghs_<App ID>_<JWT>, whose base64url JWT adds - and . (#232).
      # The set is spelled out, not written as ranges like A-Z: some shells match a range by the locale's
      # collation, where it can take a non-ASCII letter, and LC_ALL=C here would change the locale gh runs in.
      case "${token}" in
      '' | *[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.-]*) refuse "malformed (want two lines: the token, then its expiry as Unix seconds)" ;;
      esac
      case "${expiry}" in
      '' | *[!0-9]*) refuse "malformed (want two lines: the token, then its expiry as Unix seconds)" ;;
      esac
      [ -z "${extra}" ] || refuse "malformed (want exactly two lines)"

      if [ "$(date +%s)" -ge "${expiry}" ]; then
        when="$(date -u -d "@${expiry}" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -u -r "${expiry}" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "${expiry}")"
        refuse "expired since ${when} (the refresh on the Mac may have stopped)"
      fi

      GH_TOKEN="${token}"
      export GH_TOKEN
      unset GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN token
      exec "${real}" "$@"
      GHWRAPPER
        install -o root -g root -m 0755 "${tmp}" /usr/local/bin/gh
      )

      # The tester's launch wrapper and the env-printing refusal it loads into pi (issue #692, ADR 0044):
      # .dot-agent-deck.toml's tester command runs /usr/local/lib/shift2eu/pi-tester/pi-tester.sh, which reads
      # the refusal's two files beside itself and never the unit folder's copies, which an agent can write.
      # Root-owned and outside the workspace mount, so a branch's edit of dev/pi-tester.sh or .pi/ changes
      # nothing the tester starts with until the maintainer runs make vm-pi-tester (dev/vm-pi-tester.sh) or
      # rebuilds the VM; plumbing, not a security boundary, as the VM user has sudo. Copied into the template,
      # as a VM keeps the template it was created with. Keep the text between the PITESTER, PIDENYEXT and
      # PIDENYLIST lines identical to dev/pi-tester.sh, .pi/extensions/deny-env-printing.ts and
      # .pi/deny-env-printing.json, which the tests run.
      (
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        cat >"${tmp}/pi-tester.sh" <<'PITESTER'
      #!/bin/sh
      # Starts pi for the tester role (issue #662, issue #692,
      # docs/adr/0044-refuse-printing-the-environment-in-pi-with-a-project-extension.md): .dot-agent-deck.toml's
      # tester command runs this script, never pi itself, and runs the copy dev/lima.yaml installs root-owned:
      #   /usr/local/lib/shift2eu/pi-tester/pi-tester.sh                         this script
      #   /usr/local/lib/shift2eu/pi-tester/extensions/deny-env-printing.ts      .pi/extensions/deny-env-printing.ts
      #   /usr/local/lib/shift2eu/pi-tester/deny-env-printing.json               .pi/deny-env-printing.json
      # The unit's folder, where the deck starts the pane, is writable by the agents, so a branch could weaken its
      # copies; the installed ones change only on a VM rebuild or make vm-pi-tester, which the maintainer runs.
      #
      # 0. Reads the refusal's two files from the directory this script is installed in (the directory of $0,
      #    which must be an absolute path), never from the working directory. When a copy in the working directory
      #    (.pi/extensions/deny-env-printing.ts, .pi/deny-env-printing.json, dev/pi-tester.sh) is missing or not
      #    byte for byte the installed one, it is not used for the checks or for --extension: one line on stderr
      #    names the installed and the project paths and make vm-pi-tester, and pi starts with the installed files.
      #    pi loads no extension and no trusted setting of the project (item 2). The line is expected on a branch that changes
      #    one of the three files.
      # 1. Fails closed. pi logs an extension that fails to load and runs without it, so the env-printing refusal
      #    (ADR 0044) would fail open on its own. Before pi starts, the two installed files the refusal is made of
      #    are checked:
      #    - extensions/deny-env-printing.ts must be a non-empty regular file, and deny-env-printing.json a JSON
      #      object whose "patterns" is a non-empty array (checked with jq, which dev/lima.yaml installs);
      #    - then node (from PATH, the one dev/lima.yaml pins, under the allow-listed environment below) imports
      #      the extension and requires a function as its default export, which is what pi calls, and compiles
      #      every pattern of the list with `new RegExp`, as the extension does. The VM's node (22.18 or later)
      #      strips TypeScript types on import by default, so no flag is needed; the load is the one
      #      test/architecture/pienvdenyload_test.go's piNodeLoadScript makes.
      #    Anything else - node missing too - exits 1 with a message that names the file, and pi is not started.
      #    Only node's exit status is read: its output is discarded, so nothing the load prints reaches the pane.
      #    pi (1.6.1, the release dev/lima.yaml pins) has no option that makes a failed extension load fatal, so
      #    these checks are the ones that do it.
      # 2. Starts pi with an allow-listed environment: `env -i` and only the variables named below, each copied
      #    when the parent has it set, plus the marker SHIFT2EU_PI_TESTER=1, and the arguments
      #    `--no-approve --no-extensions --extension <installed extensions/deny-env-printing.ts>
      #    --extension <HOME>/.pi/agent/extensions/dot-agent-deck --skill <working directory>/.claude/skills`
      #    followed by every other argument passed through unchanged (issue #702, ADR 0044 amendment). pi then
      #    trusts no project: it applies no trust-gated setting of the project's .pi/settings.json, whose
      #    shellCommandPrefix, packages and npmCommand could run commands the refusal never sees, and discovers
      #    no extension of the project or of ~/.pi/agent; it loads exactly the installed refusal and the deck's
      #    extension, and the skills by --skill. pi still reads the project's .pi/settings.json as data before
      #    trust (sessionDir, the startup UI, first-time setup): see What this does not do.
      #    An --approve or -a among the arguments is dropped with one line on stderr each, since the last of
      #    --approve and --no-approve wins; units cut before the change still pass it. After a -- pi reads it as
      #    message text, which could not re-trust the project: it is dropped there too only to keep the rule
      #    simple. A -a given as another option's value (--name -a) is dropped as well; the deck never passes one.
      #    Before the deck's extension, pi's agent directory ${HOME}/.pi/agent, whose settings, models and system
      #    prompt pi always trusts, is checked: neither ~/.pi nor ~/.pi/agent may be a symbolic link, it must be a
      #    directory, and its physical path (cd -P) must lie outside the working directory's physical path (pwd -P),
      #    so a HOME spelled <unit>/./h or <unit>//h, or a unit folder reached through a link, is refused too.
      #    The deck's extension must lie under HOME (an absolute path), outside the working directory by its
      #    spelling and by its physical path, be a directory reached through no symbolic link (neither it nor
      #    ~/.pi/agent/extensions), and hold an index.ts, index.js or package.json that is a regular file and no
      #    symbolic link. Otherwise the wrapper exits 1 with one line naming the directory and why, and for the
      #    deck's extension the step that writes it (dot-agent-deck orchestrator setup). Everything else -
      #    a GitHub token, another agent's key (ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN), the OpenTelemetry
      #    headers that carry a backend's API key, any name this list does not know - is not in pi's environment, so printing it shows only the DeepSeek key and the pane's
      #    variables. The marker makes the VM's login profile (/etc/profile.d/shift2eu.sh, dev/lima.yaml) leave
      #    the agents' keys file unsourced, so a `bash -l` from the tester's bash tool does not put them back.
      #
      # What this does not do: the tester still runs as the VM's one user, so the keys file, the agents App's
      # token file and other processes' /proc/<pid>/environ stay readable to it, guarded only by the deny
      # patterns of .pi/deny-env-printing.json, which a program the tester writes and runs can bypass. Keeping
      # them from it needs a separate uid or the egress stage (ADR 0044, Alternatives). The skills under
      # <working directory>/.claude/skills are still the branch's text, which pi reads as instructions (not code).
      # gh and git push keep working for a command the tester runs: the VM's gh (dev/gh-app-token.sh, ADR 0031)
      # reads the App's token from its file under HOME, not from the environment.
      # pi still reads the project's .pi/settings.json as data before trust (sessionDir, the startup UI, first-time
      # setup), and its migrations rename <working directory>/.pi/commands to .pi/prompts before trust; a branch's
      # .pi/hooks or .pi/tools makes an interactive pi show a deprecation warning and wait for a key, which stalls
      # an unattended pane. No code of the project runs. A follow-up can pin --session-dir.
      # The user-level config under ~/.pi/agent - settings.json (shellCommandPrefix, shellPath, packages,
      # npmCommand), models.json, SYSTEM.md, APPEND_SYSTEM.md, AGENTS.md - is always trusted and writable by any
      # process of the same uid, branch code that make check runs included, so a write there runs at the next
      # tester start, outside the refusal. A refusal of those keys was considered and not taken: it could break a
      # legitimate deck setup and moves no trust boundary while the tester shares the uid.
      # The later arguments of the deck's tester command (--extension, --session-dir, --system-prompt and the
      # like) come from .dot-agent-deck.toml, which TestPiTesterCommandRunsTheLaunchWrapper pins word for word.
      #
      # PATH is checked first, before anything that looks a command up: an empty entry (a leading, middle or
      # trailing `:`) or one that is not absolute (`.`, `bin`) is the working directory or under it, the unit's
      # folder, so a command the wrapper, node or pi then finds could be one from there. Such a PATH exits 1 with a
      # message that names PATH (never its value), and nothing is started. The VM's PATH (dev/lima.yaml's profile)
      # has none, so it passes, and is then copied as it is.
      #
      # The refusals print paths built from $0, PWD and HOME; no variable's value on its own and no credential is
      # ever printed.
      #
      # Usage: /usr/local/lib/shift2eu/pi-tester/pi-tester.sh <pi arguments...>
      #        (by its absolute path, from the directory pi loads the project from)
      set -eu

      # refuse_path <why> stops the wrapper on a PATH that could find a command in the working directory.
      refuse_path() {
        printf 'pi-tester: PATH %s: the tester is not started, because a command found on it could be one from the working directory, the unit folder (issue #662)\n' \
          "$1" >&2
        exit 1
      }

      case "${PATH:-}" in
      '' | :* | *: | *:[:]*) refuse_path "has an empty entry (a leading, doubled or trailing colon)" ;;
      esac
      path_entries=${PATH}
      while [ -n "${path_entries}" ]; do
        path_entry=${path_entries%%:*}
        case "${path_entries}" in
        *:*) path_entries=${path_entries#*:} ;;
        *) path_entries="" ;;
        esac
        case "${path_entry}" in
        /*) ;;
        *) refuse_path "has an entry that is not an absolute path" ;;
        esac
      done

      # The installed layout, read beside this script's own path, never from the working directory (issue #692).
      case "$0" in
      /*/*) ;;
      *)
        echo "pi-tester: not started by its absolute path, so it cannot find its installed files: run /usr/local/lib/shift2eu/pi-tester/pi-tester.sh (issue #692)" >&2
        exit 1
        ;;
      esac
      installed=${0%/*}
      script=$0
      extension=${installed}/extensions/deny-env-printing.ts
      list=${installed}/deny-env-printing.json
      skills=${PWD}/.claude/skills

      # --approve and -a are dropped wherever they stand, one line each in their order: pi starts with --no-approve,
      # and an --approve after it would win. After a -- pi reads one as message text, which could not re-trust the
      # project; it is dropped there too only to keep the rule simple. A -a given as another option's value
      # (--name -a) is dropped as well; the deck never passes one. Every other argument is kept, unchanged and in order.
      for arg; do
        shift
        case "${arg}" in
        --approve | -a)
          printf "pi-tester: argument %s dropped: the tester's pi never trusts the project, because a trusted .pi/settings.json can run commands the env-printing refusal does not see (shellCommandPrefix, packages, npmCommand) (issue #702)\n" \
            "${arg}" >&2
          ;;
        *) set -- "$@" "${arg}" ;;
        esac
      done

      # The deck's pi extension, where the deck writes it: always under HOME, never derived from the working directory.
      case "${HOME:-}" in
      /*) ;;
      *)
        echo "pi-tester: HOME is not an absolute path, so the deck's pi extension cannot be found: the tester is not started (issue #702)" >&2
        exit 1
        ;;
      esac
      deck=${HOME}/.pi/agent/extensions/dot-agent-deck

      # refuse <file> <why> stops the wrapper before pi starts.
      refuse() {
        printf 'pi-tester: %s %s: the tester is not started, because pi would run without the env-printing refusal (issue #662, docs/adr/0044-refuse-printing-the-environment-in-pi-with-a-project-extension.md)\n' \
          "$1" "$2" >&2
        exit 1
      }

      # The allow list, one name a line with its reason. A name is copied only when the parent has it set.
      allowed="
      DEEPSEEK_API_KEY
      HOME
      PATH
      USER
      LOGNAME
      SHELL
      TERM
      COLORTERM
      LANG
      LC_ALL
      LC_CTYPE
      TMPDIR
      XDG_RUNTIME_DIR
      XDG_CONFIG_HOME
      XDG_STATE_HOME
      XDG_CACHE_HOME
      XDG_DATA_HOME
      DOT_AGENT_DECK_PANE_ID
      DOT_AGENT_DECK_PANE_CAPABILITY
      DOT_AGENT_DECK_AGENT_ID
      DOT_AGENT_DECK_WORK_ID
      DOT_AGENT_DECK_VIA_DAEMON
      DOT_AGENT_DECK_LAUNCH_NONCE
      DOT_AGENT_DECK_RESUME_AGENT
      DOT_AGENT_DECK_RESUME_SESSION
      DOT_AGENT_DECK_RESUME_TOKEN
      DOT_AGENT_DECK_FRESH_AGENT
      DOT_AGENT_DECK_FRESH_SESSION
      DOT_AGENT_DECK_FRESH_TOKEN
      DOT_AGENT_DECK_SOCKET
      DOT_AGENT_DECK_EXE
      DOT_AGENT_DECK_BIN
      DOT_AGENT_DECK_STATE_DIR
      DOT_AGENT_DECK_USAGE_FILE
      DOT_AGENT_DECK_INBOX_WATCHER_BACKOFF_MS
      "
      # Why each one:
      #   DEEPSEEK_API_KEY      pi's DeepSeek provider credential, the tester's one key (ADR 0003).
      #   HOME                  pi's ~/.pi/agent (settings, the deck's extension), git's config, Go's caches, and
      #                         the agents App token file the VM's gh reads.
      #   PATH                  finds node, go, make, git, gh, jq and dot-agent-deck (dev/lima.yaml's profile).
      #   USER, LOGNAME         the account name tools look up without asking the system (git, os/user).
      #   SHELL                 the shell pi's bash tool and make fall back to.
      #   TERM, COLORTERM       the deck's terminal (the daemon's terminal.conf drop-in), so pi draws its colours.
      #   LANG, LC_ALL, LC_CTYPE  the locale, so pi and the tools read and write UTF-8. LANG sets every other
      #                         LC_* category that is not set itself, so the others are left out.
      #   TMPDIR                the temporary directory, which the deck's socket falls back to without
      #                         XDG_RUNTIME_DIR.
      #   XDG_RUNTIME_DIR       where the deck's socket lives by default, and the rootless containerd's.
      #   XDG_CONFIG_HOME, XDG_STATE_HOME, XDG_CACHE_HOME, XDG_DATA_HOME
      #                         where tools keep their files when the system sets them (the deck's state dir).
      #   DOT_AGENT_DECK_PANE_ID, _PANE_CAPABILITY, _AGENT_ID, _VIA_DAEMON
      #                         the pane's identity and the token that lets its work-done and status updates be
      #                         accepted (dot-agent-deck docs configuration, the deck's pi extension); the
      #                         capability is scoped to this pane and the deck, no other service.
      #   DOT_AGENT_DECK_WORK_ID, _LAUNCH_NONCE, _RESUME_AGENT, _RESUME_SESSION, _RESUME_TOKEN, _FRESH_AGENT,
      #   _FRESH_SESSION, _FRESH_TOKEN
      #                         kept for the deck binary's launch and resume path: the names were found in the
      #                         binary's strings beside the pane id, and what reads them is unverified, so a later
      #                         trim can test dropping them one by one. Scoped to the deck.
      #   DOT_AGENT_DECK_SOCKET the daemon's socket, which the deck passes to the agents it starts.
      #   DOT_AGENT_DECK_EXE, DOT_AGENT_DECK_BIN
      #                         the dot-agent-deck executable the deck's pi extension runs.
      #   DOT_AGENT_DECK_STATE_DIR  the deck's state directory, when it is not the default.
      #   DOT_AGENT_DECK_USAGE_FILE, DOT_AGENT_DECK_INBOX_WATCHER_BACKOFF_MS
      #                         read by the deck's pi extension: where it writes pi's usage, and its inbox
      #                         watcher's backoff.
      # Set by the wrapper itself, whatever the parent has:
      #   SHIFT2EU_PI_TESTER=1  the marker the VM's login profile reads to leave the agents' keys file unsourced.
      # Left out on purpose: GH_TOKEN and every other GitHub token variable; ANTHROPIC_API_KEY,
      # CLAUDE_CODE_OAUTH_TOKEN and every other agent's key; OTEL_* and DOT_AGENT_DECK_PI_TELEMETRY, because
      # OTEL_EXPORTER_OTLP_HEADERS carries the telemetry backend's API key (the tester's pane exports no telemetry
      # of pi's own); and no Go variable, since dev/lima.yaml sets none (Go's defaults under HOME apply).

      # allowlisted <run|exec> <command> [<argument>...] runs the command under `env -i` and the allow list alone.
      # Inside the function the positional parameters become: the NAME=value assignments, the marker, then the
      # command and its arguments, each unchanged.
      allowlisted() {
        mode=$1
        shift
        count=$#
        isset=""
        value=""
        for name in ${allowed}; do
          eval "isset=\${${name}+x}"
          if [ -n "${isset}" ]; then
            eval "value=\${${name}}"
            set -- "$@" "${name}=${value}"
          fi
        done
        set -- "$@" "SHIFT2EU_PI_TESTER=1"
        while [ "${count}" -gt 0 ]; do
          set -- "$@" "$1"
          shift
          count=$((count - 1))
        done
        if [ "${mode}" = exec ]; then
          exec env -i "$@"
        fi
        env -i "$@"
      }

      # The extension's load, as pi makes it: an import whose default export must be a function.
      load_extension='
      const { pathToFileURL } = await import("node:url");
      const module = await import(pathToFileURL(process.argv[1]).href);
      if (typeof module.default !== "function") {
        process.exit(1);
      }
      '

      # The list's patterns, compiled as the extension compiles them: each a string and a regular expression.
      compile_patterns='
      const { readFileSync } = await import("node:fs");
      const doc = JSON.parse(readFileSync(process.argv[1], "utf8"));
      if (!Array.isArray(doc.patterns) || doc.patterns.length === 0) {
        process.exit(1);
      }
      for (const pattern of doc.patterns) {
        if (typeof pattern !== "string") {
          process.exit(1);
        }
        new RegExp(pattern);
      }
      '

      [ -f "${extension}" ] || refuse "${extension}" "is missing or not a regular file"
      [ -s "${extension}" ] || refuse "${extension}" "is empty"
      [ -f "${list}" ] || refuse "${list}" "is missing or not a regular file"
      command -v jq >/dev/null 2>&1 || refuse "${list}" "cannot be checked: jq is not on PATH"
      jq -e 'type == "object" and (.patterns | type == "array" and length > 0)' "${list}" >/dev/null 2>&1 ||
        refuse "${list}" "is not a JSON object with a non-empty patterns array"

      node="$(command -v node)" ||
        refuse "${extension}" "cannot be loaded: node is not on PATH (re-provision the VM: dev/lima.yaml installs it)"
      allowlisted run "${node}" --input-type=module -e "${load_extension}" "${extension}" >/dev/null 2>&1 ||
        refuse "${extension}" "does not load in node with a function as its default export (make test runs TestPiEnvDenyExtensionLoads, which says why)"
      allowlisted run "${node}" --input-type=module -e "${compile_patterns}" "${list}" >/dev/null 2>&1 ||
        refuse "${list}" "has a pattern node cannot compile as a regular expression"

      pi="$(command -v pi)" || {
        echo "pi-tester: pi is not on PATH: re-provision the VM (dev/lima.yaml installs it)" >&2
        exit 1
      }

      # The working directory's physical path, every link resolved; empty when it cannot be resolved, which
      # in_unit then reads as the unit folder (fail closed).
      pwd_real=$(pwd -P) || pwd_real=""

      # in_unit <directory> succeeds when the directory's physical path is the working directory's or lies below it,
      # and when either path cannot be resolved (fail closed). A working directory of / holds every path.
      in_unit() {
        [ -n "${pwd_real}" ] || return 0
        dir_real=$(cd -P -- "$1" 2>/dev/null && pwd -P) || return 0
        [ -n "${dir_real}" ] || return 0
        case "${dir_real%/}/" in
        "${pwd_real%/}/"*) return 0 ;;
        esac
        return 1
      }

      # pi's agent directory, where pi keeps the settings, the models and the system prompt it always trusts, whatever
      # --no-approve and --no-extensions say. The deck's extension lies in it.
      agent=${HOME}/.pi/agent

      # refuse_agent <why> stops the wrapper when pi's agent directory could be the unit folder's.
      refuse_agent() {
        printf "pi-tester: pi's agent directory %s %s: the tester is not started, because pi trusts the settings and extensions it finds there (issue #702)\n" \
          "${agent}" "$1" >&2
        exit 1
      }

      # The agent directory must be a real directory reached through no link, and physically outside the working
      # directory: a HOME spelled <unit>/./h or <unit>//h, or a unit folder reached through a link, passes a string
      # comparison and is still the unit folder.
      if [ -L "${HOME}/.pi" ] || [ -L "${agent}" ]; then
        refuse_agent "is reached through a symbolic link"
      fi
      [ -d "${agent}" ] || refuse_agent "is missing or not a directory"
      ! in_unit "${agent}" || refuse_agent "lies in the working directory, the unit folder"

      # refuse_deck <why> stops the wrapper when the deck's pi extension is not where the deck writes it.
      refuse_deck() {
        printf "pi-tester: the deck's pi extension %s %s: the tester is not started, because without it the pane gets no task and its work-done is not delivered; run dot-agent-deck orchestrator setup, then restart the pane (issue #702)\n" \
          "${deck}" "$1" >&2
        exit 1
      }

      # entry_point <file> succeeds for a regular file that is no symbolic link: the deck writes its entry point there.
      entry_point() {
        [ -f "$1" ] && [ ! -L "$1" ]
      }

      # The deck's extension must lie outside the working directory, which a branch writes, by its spelling and by its
      # physical path, be a real directory reached through no link, and hold an entry point pi can load. Its content
      # is not read: it is the deck's, written by its setup.
      unit_prefix=${PWD%/}/
      case "${deck}" in
      "${PWD}" | "${unit_prefix}"*) refuse_deck "lies in the working directory, the unit folder" ;;
      esac
      [ ! -L "${agent}/extensions" ] || refuse_deck "is reached through a symbolic link, which the deck never writes"
      [ ! -L "${deck}" ] || refuse_deck "is a symbolic link, which the deck never writes"
      [ -d "${deck}" ] || refuse_deck "is missing or not a directory"
      ! in_unit "${deck}" || refuse_deck "lies in the working directory, the unit folder"
      entry_point "${deck}/index.ts" || entry_point "${deck}/index.js" || entry_point "${deck}/package.json" ||
        refuse_deck "has no index.ts, index.js or package.json"

      # The project's copies: each one missing or not byte for byte the installed file is named in one line, with the
      # installed file and the update step; the checks and --extension use the installed files, and pi loads no
      # extension and no trusted setting of the project. Only paths are printed, never a file's content.
      differs=""
      # compare_copy <installed file> <project file> notes the project file when it is not the installed one.
      compare_copy() {
        if ! cmp -s "$1" "$2"; then
          differs="${differs}${differs:+; }$2 (installed: $1)"
        fi
      }
      compare_copy "${script}" "${PWD}/dev/pi-tester.sh"
      compare_copy "${extension}" "${PWD}/.pi/extensions/deny-env-printing.ts"
      compare_copy "${list}" "${PWD}/.pi/deny-env-printing.json"
      if [ -n "${differs}" ]; then
        printf 'pi-tester: project copies missing or different from the installed ones: %s (expected on a branch that changes them); the checks and --extension use the installed copies, and pi loads no extension and no trusted setting of the project (--no-extensions, --no-approve: ADR 0044, issue #702); to install the project copies after review, the maintainer runs make vm-pi-tester (issue #692)\n' \
          "${differs}" >&2
      fi

      allowlisted exec "${pi}" --no-approve --no-extensions --extension "${extension}" --extension "${deck}" --skill "${skills}" "$@"
      PITESTER
        cat >"${tmp}/deny-env-printing.ts" <<'PIDENYEXT'
      /**
       * Refuses the commands that print the environment (CLAUDE.md rule 3, issue #540, ADR 0044).
       *
       * The tester's pi asks for nothing, and the environment holds the agents' API keys. This extension, whose
       * root-owned installed copy the tester's wrapper loads by --extension (pi starts with --no-approve
       * --no-extensions, so the project's copy is never discovered: dev/pi-tester.sh, issue #702), hooks `tool_call`,
       * the event that sees a tool call before it runs, and blocks:
       *
       * - a bash call whose command is longer than 32 KB, unread (the patterns are quadratic on one long line);
       * - a bash call whose command matches any pattern of ../deny-env-printing.json;
       * - a file-tool call (read, grep, find, ls, edit, write) whose path, normalised as pi normalises it (a
       *   leading `@`, a `file://` URL, Unicode spaces, `~`, `..`) and resolved against the working directory,
       *   is /proc, ~/.config/dot-agent-deck or ~/.config/shift2eu (the agents App's token folder, issue #662)
       *   or lies under one of them, or whose path, glob or pattern names the deck's file of keys, daemon.env,
       *   or its directory, or whose path names the App's folder; a grep or find pattern or glob naming the App's
       *   folder or files (agents-app-*) is allowed, since a pattern is text the walk looks for, a glob only
       *   filters the names the walk reports, and the walk's path is checked (issue #691);
       * - a grep or find call whose path is an ancestor of one of those directories (`~`, `/`, and every spelling that
       *   resolves to one, such as `//`, `/.`, `/..` or enough `../`), which its walk reaches; a call with no
       *   path is checked as the working directory, where pi runs it.
       *
       * The patterns are data, pinned by test/architecture/pienvdeny_test.go, and are written to the syntax Go's
       * RE2 and JavaScript share (no lookaround, no backreference, no inline flag).
       *
       * What fails closed and what does not: pi logs an extension that fails to load and carries on without it,
       * so a load failure fails open. The top level therefore does nothing that can throw, and the factory never
       * throws: when the list cannot be found, read or parsed, or a pattern does not compile, every bash call is
       * refused with a reason that says so, and a handler that throws on a call refuses that call. It is a second
       * layer beside the rule, not a boundary: the Lima VM is the boundary (ADR 0003).
       *
       * The extension imports pi's package for types alone (`import type` is erased): the guard must not depend
       * at run time on the module whose behaviour it guards.
       */

      import { readFileSync } from "node:fs";
      import { homedir } from "node:os";
      import { dirname, join, resolve } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

      // The deck's file of the agents' keys (CLAUDE.md rule 3), refused by name wherever a file tool is pointed.
      const deckKeyFile = "daemon.env";

      // The file tools whose path, glob or pattern a call is refused for.
      const fileTools = new Set(["read", "grep", "find", "ls", "edit", "write"]);

      // The file tools that read the contents of a whole directory tree (pi runs grep as `rg --hidden`): a call
      // of one is refused also when its resolved path is an ancestor of a refused directory (`~`, `/`, or `..`
      // up to either), since the walk reaches it; a call with no path walks the working directory, so it is
      // checked as `.`.
      const recursiveTools = new Set(["grep", "find"]);

      // The longest bash command matched against the patterns. The prefix patterns cost time quadratic in the
      // length of one line full of separators (100 KB of minified JSON in an `echo '...'` took 35 s in Node), so
      // a longer command is refused unread rather than stalling the call.
      const maxCommandLength = 32 * 1024;

      const longCommandReason = `Refused: bash commands over ${maxCommandLength} characters (32 KB) are refused unread (CLAUDE.md, rule 3, ADR 0044); write the content with the write tool and pass the file to a shorter command.`;

      type DenyList = { reason: string; patterns: RegExp[] };

      type Loaded = { list: DenyList; listPath: string } | { failure: string; listPath: string };

      function loadDenyList(): Loaded {
      	let listPath = "../deny-env-printing.json";

      	try {
      		listPath = join(dirname(fileURLToPath(import.meta.url)), "..", "deny-env-printing.json");

      		const doc: unknown = JSON.parse(readFileSync(listPath, "utf8"));
      		if (typeof doc !== "object" || doc === null) {
      			return { failure: "the list is no JSON object", listPath };
      		}

      		const { reason, patterns } = doc as { reason?: unknown; patterns?: unknown };
      		if (typeof reason !== "string" || reason.trim() === "") {
      			return { failure: "the list gives no reason", listPath };
      		}

      		if (!Array.isArray(patterns) || patterns.length === 0 || !patterns.every((p) => typeof p === "string")) {
      			return { failure: "the list holds no patterns, or one that is no string", listPath };
      		}

      		return { list: { reason, patterns: patterns.map((p: string) => new RegExp(p)) }, listPath };
      	} catch (err) {
      		return { failure: err instanceof Error ? err.message : String(err), listPath };
      	}
      }

      // The deck's directory under the home directory, which holds the file of keys and whatever else the deck
      // keeps there: refused whole, by resolved path and by name in a glob or pattern.
      const deckKeyDirectory = ".config/dot-agent-deck";

      // The spellings of that directory a path normalises or a glob names (`.config//dot-agent-deck`,
      // `.config/./dot-agent-deck`, `.config/dot-agent*`), refused in a glob or pattern as the list refuses
      // them in a bash command.
      const deckDirectorySpelling = /\.config[/.]*\/dot-agent/;

      // The folder under the home directory that holds the agents App's token file, agents-app-token, and the
      // identity file `make agents-token` writes beside it (ADR 0031, issue #662): the one GitHub credential every
      // agent pushes with. Refused whole, by resolved path, as an ancestor of a grep or find, and by its spellings
      // in a path. A search pattern or glob may name it: a pattern is text to look for and a glob filters the
      // names the walk reports, neither is a place the walk goes (issue #691).
      const appTokenDirectory = ".config/shift2eu";

      // The folder's spellings a path names (`.config//shift2eu`, `.config/./shift2eu`), as the list refuses them
      // in a bash command. `~/.local/state/shift2eu` and a checkout named shift2eu are not it.
      const appTokenDirectorySpelling = /\.config[/.]*\/shift2eu\b/;

      // The Unicode spaces pi maps to a plain space before it reads a path: U+00A0, U+2000 to U+200A, U+202F,
      // U+205F and U+3000. The class is built from their code points so that this file holds only ASCII.
      // The code points are constants, so the top level does nothing that can throw: a load failure fails open
      // and pi runs without this refusal (ADR 0044), and TestPiEnvDenyExtensionLoads fails if it throws.
      const unicodeSpaces = new RegExp(
      	"[" +
      		String.fromCodePoint(0x00a0, 0x2000) +
      		"-" +
      		String.fromCodePoint(0x200a, 0x202f, 0x205f, 0x3000) +
      		"]",
      	"g",
      );

      // resolvePath resolves a file tool's path as pi's resolveToCwd and normalizePath do: one leading `@`
      // (pi's shorthand for a path) is dropped, a `file://` URL becomes its path, the Unicode spaces become
      // plain ones, a leading `~` is the home directory, a relative path is under the working directory and
      // `..` is normalised. A URL that does not convert throws, and the handler refuses the call: a fallback
      // to the raw value would resolve `file:///proc/...` as a relative path and allow it.
      function resolvePath(path: string, cwd: string): string {
      	let expanded = path.startsWith("@") ? path.slice(1) : path;
      	if (expanded.startsWith("file://")) {
      		expanded = fileURLToPath(expanded);
      	}

      	expanded = expanded.replace(unicodeSpaces, " ");
      	if (expanded === "~" || expanded.startsWith("~/")) {
      		expanded = homedir() + expanded.slice(1);
      	}

      	return resolve(cwd, expanded);
      }

      // under tells whether absolute is directory or below it. A directory that already ends in `/` (the root,
      // `/`) is its own prefix: appending another `/` would ask for `//`, which no resolved path starts with.
      function under(absolute: string, directory: string): boolean {
      	const prefix = directory.endsWith("/") ? directory : `${directory}/`;
      	return absolute === directory || absolute.startsWith(prefix);
      }

      const procReason =
      	"Refused: /proc holds the environment of every process, which holds the agents' API keys (CLAUDE.md, rule 3).";

      const keyFileReason = `Refused: ${deckKeyFile} and ~/${deckKeyDirectory} hold the agents' API keys; never read them (CLAUDE.md, rule 3).`;

      const appTokenReason = `Refused: ~/${appTokenDirectory} holds the agents App's token file, agents-app-token, the GitHub credential every agent pushes with; never read it, search under it or above it, or name it in a path; a search pattern or glob may name it (CLAUDE.md, rule 3, ADR 0031).`;

      const handlerFailureReason =
      	"Refused: the env-printing refusal could not check this call, so it is refused (CLAUDE.md, rule 3). Report this through dot-agent-deck work-done and stop.";

      export default function (pi: ExtensionAPI) {
      	const loaded = loadDenyList();

      	pi.on("session_start", async (_event, ctx) => {
      		try {
      			if (ctx.hasUI) {
      				ctx.ui.notify(
      					"failure" in loaded
      						? "env-printing refusal: the list could not be loaded, every bash command is refused"
      						: "env-printing refusal loaded",
      					"failure" in loaded ? "error" : "info",
      				);
      			}
      		} catch {
      			// A notice that cannot be shown changes nothing the refusal does.
      		}
      	});

      	pi.on("tool_call", async (event, ctx) => {
      		try {
      			const input = (event.input ?? {}) as Record<string, unknown>;

      			if (event.toolName === "bash") {
      				if ("failure" in loaded) {
      					return {
      						block: true,
      						reason: `Refused: the env-printing refusal list ${loaded.listPath} could not be loaded (${loaded.failure}), so every bash command is refused (CLAUDE.md, rule 3). Report this through dot-agent-deck work-done and stop.`,
      					};
      				}

      				const command = String(input.command ?? "");
      				if (command.length > maxCommandLength) {
      					return { block: true, reason: longCommandReason };
      				}

      				if (loaded.list.patterns.some((re) => re.test(command))) {
      					return { block: true, reason: loaded.list.reason };
      				}

      				return undefined;
      			}

      			if (fileTools.has(event.toolName)) {
      				const cwd = typeof ctx?.cwd === "string" ? ctx.cwd : process.cwd();
      				const keyDirectory = join(homedir(), deckKeyDirectory);
      				const tokenDirectory = join(homedir(), appTokenDirectory);

      				for (const field of ["path", "glob", "pattern"]) {
      					// pi runs a file tool with no path in the working directory, so an absent path is checked as `.`.
      					const value = field === "path" ? (input.path ?? ".") : input[field];
      					if (typeof value !== "string") {
      						continue;
      					}

      					if (value.includes(deckKeyFile) || value.includes(deckKeyDirectory) || deckDirectorySpelling.test(value)) {
      						return { block: true, reason: keyFileReason };
      					}

      					// A grep or find pattern is text the walk looks for, never a file it opens, and a glob only filters
      					// the names the walk reports: where the walk goes is its path, checked here and below (the folder,
      					// under it and its ancestors), so a pattern or glob naming the App's folder or files is no refusal
      					// (issue #662, round 3's review, finding S1; issue #691).
      					if (field === "path" && appTokenDirectorySpelling.test(value)) {
      						return { block: true, reason: appTokenReason };
      					}

      					if (field === "path") {
      						const absolute = resolvePath(value, cwd);

      						if (under(absolute, keyDirectory)) {
      							return { block: true, reason: keyFileReason };
      						}

      						if (under(absolute, tokenDirectory)) {
      							return { block: true, reason: appTokenReason };
      						}

      						if (under(absolute, "/proc")) {
      							return { block: true, reason: procReason };
      						}

      						// A grep or find rooted at an ancestor walks into the refused directory.
      						if (recursiveTools.has(event.toolName)) {
      							if (under(keyDirectory, absolute)) {
      								return { block: true, reason: keyFileReason };
      							}

      							if (under(tokenDirectory, absolute)) {
      								return { block: true, reason: appTokenReason };
      							}

      							if (under("/proc", absolute)) {
      								return { block: true, reason: procReason };
      							}
      						}
      					} else if (value.includes("/proc")) {
      						return { block: true, reason: procReason };
      					}
      				}
      			}

      			return undefined;
      		} catch {
      			return { block: true, reason: handlerFailureReason };
      		}
      	});
      }
      PIDENYEXT
        cat >"${tmp}/deny-env-printing.json" <<'PIDENYLIST'
      {
