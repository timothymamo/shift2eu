version: 2

project_name: shift2eu

before:
  hooks:
    # -diff fails on an untidy module and writes nothing: the hook runs
    # outside the build env, and a rewritten go.mod or go.sum would pass the
    # -mod=readonly build (issue #102, ADR 0012).
    - go mod tidy -diff

builds:
  - id: shift2eu
    main: ./cmd/shift2eu
    binary: shift2eu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
      - GOFLAGS=-mod=readonly
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/timothymamo/shift2eu/internal/version.version={{ .Version }}
      - -X github.com/timothymamo/shift2eu/internal/version.commit={{ .ShortCommit }}
      - -X github.com/timothymamo/shift2eu/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# The release ships the CLI alone (ADR 0037, issue #393): one build, and one
# archive per platform that holds shift2eu alone and keeps the name it has
# always had (goreleaser's default, written out). One checksums.txt covers
# every archive (ADR 0015).
# test/architecture (check.GoReleaserArchives) pins this section and the
# checksum one, and ci.yml's test job builds a snapshot and checks each
# archive's binary (.github/scripts/verify-archives.sh).
#
# README.md links only to LICENSE and the pages under docs/ (test/docs holds
# it to that), so each archive ships docs/ beside it and the links work in an
# unpacked archive too (issue #149). docs/**/* matches only the files in
# docs/'s subdirectories, so docs/*.md takes those directly in it. Each
# archive ships the security policy, SECURITY.md, beside LICENSE and README.md
# too, so a user of a release can read how to report a vulnerability without
# a clone (issue #450). Each archive ships NOTICE beside LICENSE: Apache-2.0
# section 4(d) asks every redistribution to carry its attribution (issue #493,
# ADR 0041).
#
# docs/guide/try-it.md runs the CLI on the sample inventories under
# examples/, so each archive ships examples/ beside docs/ too, and the
# walkthrough works in an unpacked archive as well as in a clone (issue
# #188); examples/*.md and examples/**/* split as the docs/ lines do. The
# container images do not carry the samples: they are distroless and the
# inventory is mounted (docs/guide/docker.md).
archives:
  - id: shift2eu
    ids: [shift2eu]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md
      - docs/*.md
      - docs/**/*
      - examples/*.md
      - examples/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# Every asset goes to a draft release, which release.yml's publish job
# publishes after the archives are attested, so an immutable release never
# gains or loses an asset once it is public (issue #156, ADR 0015). A re-run
# of a failed goreleaser job replaces the draft the failed run left rather
# than add a second one. A tag with a pre-release suffix (v0.1.0-rc.2) is a
# GitHub pre-release, never the latest release, as its image gets no X.Y and
# no latest tag (ADR 0015, issue #92). test/architecture (check.GitHubRelease)
# pins this section.
release:
  draft: true
  prerelease: auto
  replace_existing_draft: true
