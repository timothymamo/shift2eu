name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays: catch newly published advisories

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Plain steps, not golang/govulncheck-action: the action passes setup-go a go-version of "stable",
    # which overrides go-version-file, and installs govulncheck at @latest (issue #44).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # govulncheck reports standard-library vulnerabilities for the Go it runs with, so that Go must be
      # the one shift2eu is built and released with.
      - name: Go matches go.mod
        run: |
          want="go$(go list -m -f '{{.GoVersion}}')"
          got="$(go env GOVERSION)"
          echo "go.mod go directive: ${want}"
          echo "GOVERSION: ${got}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::setup-go installed ${got}, but go.mod declares ${want}"
            exit 1
          fi
      - name: Install govulncheck
        env:
          # Same version as govulncheckVersion in dev/lima.yaml; Renovate bumps both in one PR.
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.10.0
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck
        run: |
          govulncheck -version
          govulncheck ./...
      # actionlint, the lint tool tools/go.mod pins in a module of its own, which ./... never reaches (ADR 0022).
      - name: govulncheck the lint tools
        run: govulncheck -C tools github.com/rhysd/actionlint/cmd/actionlint

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
