name: Audit paths

# The required path check of PRD #175 milestone 2 (ADR 0040): the job "Audit report paths" fails any audit
# pull request - one authored by shift2eu-audit[bot], the scheduled audit's App, one whose sender is that
# App (its contents write lets it push onto another author's pull request), or one from a security-audit/
# head branch - that is based on any branch but main, touches anything outside docs/security/, adds there
# a path with a component starting with a dot, or adds there anything but a regular, non-executable file.
# It passes trivially for every other pull request. .github/scripts/audit-paths.sh is the fence; this
# workflow only hands it the author, the sender, the two branches and the two commits. The audit-paths
# ruleset on main requires the job by its name (docs/dev-environment.md, The scheduled security audit,
# step 5); Protect main stays unchanged.
#
# pull_request_target with types: alone, and no branches:, paths:, paths-ignore: or branches-ignore:
# filter: a required check that never reports blocks its pull request for good, so the job reports on
# every pull request, into any branch. The types are those under which a field the check reads can change:
# opened, synchronize (a push moves the head), reopened, and edited, since retargeting the base branch is
# an edited event: without it, a pull request that passed into another branch and was then retargeted to
# main would keep a stale green check on its head commit.
# pull_request_target, never pull_request, because the trigger is the fence itself: pull_request runs the
# pull request's own copy of this workflow and of the script, and the audit App, which holds contents write
# but no Workflows permission, could change .github/scripts/audit-paths.sh in its own pull request and so
# pass its own check. pull_request_target runs the base branch's copy of both, never the pull request's:
# for every pull request into main, the only ones the audit-paths ruleset on main requires the check on,
# that is main's copy, the code this repository reviewed. A pull request into another branch runs that
# branch's copy, which the branch ruleset on ~ALL keeps the audit App from changing; retargeting it to
# main is an edited event that runs main's copy on the same head commit, and that newer run decides.
#
# Why pull_request_target is safe here: the job executes the base branch's code only. The checkout has no
# ref: and no repository:, so it is the base branch's commit, github.sha. The pull request's commits are then fetched as git
# objects and diffed, data the script reads with git plumbing, and no step checks them out, switches to
# them or runs a line of their tree. The GITHUB_TOKEN reads contents only and is not persisted in
# .git/config; the repository is public, so the fetch needs no credential. The job uses no secret and no
# environment, and the App cannot edit .github/workflows/ to change any of this.
#
# The checkout takes fetch-depth: 0 and the fetch takes the pull request's whole history, so base.sha,
# head.sha and their merge base are all present whichever of them main has moved past since the event: a
# shallow fetch would leave the merge base out and fail the check, closed but spurious. A force-push while
# the job runs may leave refs/pull/<n>/head past the event's head.sha, which the fetch then need not bring
# (a normal push keeps the old head reachable): the script finds no such commit and fails closed, and the
# push's own run reports. The author, the sender, the two branches, the pull request's number and the two
# commits reach the scripts through env: alone, never through a ${{ }} expression in run:, so no value
# from the event can become a shell word.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Under pull_request_target github.ref is the base branch, shared by every pull request, so the group is
# the pull request's number: a push cancels only its own pull request's earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-paths:
    name: Audit report paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No ref: and no repository: on purpose: under pull_request_target this is the base branch's commit
      # (main's for every pull request into main), whose copy of the script runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the pull request's commits as objects, never checked out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo >&2 "audit-paths: the pull request number is not a number: the check fails closed"
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
      - name: Check the paths an audit pull request changes
        env:
          AUDIT_PATHS_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUDIT_PATHS_SENDER: ${{ github.event.sender.login }}
          AUDIT_PATHS_BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUDIT_PATHS_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUDIT_PATHS_BASE: ${{ github.event.pull_request.base.sha }}
          AUDIT_PATHS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/audit-paths.sh
