name: Audit paths

# The required path check of PRD #175 milestone 2 (ADR 0040): the job "Audit report paths" fails any pull
# request authored by shift2eu-audit[bot], the scheduled audit's App, that touches anything outside
# docs/security/ or adds there anything but a regular, non-executable file, and passes trivially for every
# other author. .github/scripts/audit-paths.sh is the fence; this workflow only hands it the author and two
# commits. The audit-paths ruleset on main requires the job by its name (the PRD's runbook step 5);
# Protect main stays unchanged.
#
# pull_request alone, with no paths:, paths-ignore: or branches-ignore: filter: a required check that never
# reports blocks its pull request for good, so the job reports on every pull request. pull_request, never
# pull_request_target: the job runs the pull request's own copy of the script, with a read-only
# GITHUB_TOKEN, no secret and no environment, as ci.yml runs the pull request's code. So a pull request can
# change this workflow or the script and so its own check: the fence is defence in depth, behind Protect
# main's code owner approval, which every pull request needs, the App's included.
#
# The checkout is the default merge commit refs/pull/<n>/merge, github.sha, the tree that would land, with
# fetch-depth: 0. The script diffs from git merge-base of the event's base.sha and that commit, and the
# full history makes sure both commits and their merge base are present whichever of them main has moved
# past since the event: a shallow fetch would leave the merge base out and fail the check, closed but
# spurious. The author and the two commits reach the script through env: alone, never through a ${{ }}
# expression in run:, so no value from the event can become a shell word.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-paths:
    name: Audit report paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the paths an audit pull request changes
        env:
          AUDIT_PATHS_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUDIT_PATHS_BASE: ${{ github.event.pull_request.base.sha }}
          AUDIT_PATHS_HEAD: ${{ github.sha }}
        run: .github/scripts/audit-paths.sh
