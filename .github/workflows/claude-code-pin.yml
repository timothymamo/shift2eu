name: Claude Code pin

# claude-code-pin (issue #276, ADR 0033): .github/claude-code.yaml, the one pin file every workflow that
# installs the Claude Code CLI reads (ADR 0040's milestone-2 amendment, issue #277), pins it by its
# version: line, which Renovate bumps, and its integrity: line, the npm integrity of that version's
# tarball, which Renovate cannot bump. A bump's own AI review runs main's copy of that file
# (pull_request_target), so a stale integrity would show only after the merge, as every review failing at
# its install step. This job fails the pull request instead: ci/claudecodepin reads both pins and fails
# unless the npm registry's document of exactly that version of @anthropic-ai/claude-code-linux-x64
# publishes the pinned integrity as its dist.integrity. A registry that cannot be reached or answers
# anything else fails the job too, never passes it.
#
# pull_request, never pull_request_target: the job runs the pull request's own copy of the check, with a
# read-only GITHUB_TOKEN, no secret and no environment, as ci.yml runs the pull request's code. It sends
# the registry one GET of a public document and no credential.
#
# Always run, so it can be required (issue #452): the job runs on every pull request into main, and its
# changes step decides whether the pull request touches the pin's paths: the pin file, ai-review.yml,
# which still installs the CLI from it (its read and install steps), the install script that consumes
# the pin, this file, the check's code and go.mod (whose go line picks the Go that builds the check).
# The push: paths below list the same paths, so a push to main and a pull request re-check the pin on
# the same changes. actions/checkout checks out the merge commit refs/pull/<n>/merge two commits deep; its first
# parent is main before the merge and its second the pull request's head, so git diff HEAD^1 HEAD is
# exactly what merging the pull request changes on main. The step trusts neither the parent count nor
# their order alone: it reads the head's sha from the event file (jq on GITHUB_EVENT_PATH) and requires it
# to be HEAD's second parent, since parents the other way round would diff what main added instead.
#
# The step diffs with git, not with the API's file list. So it needs no pull-requests: read scope, has no
# pagination and no 3000-file cap, makes no network call besides the checkout, and diffs the very tree the
# check then runs on. When no pin path changed, the job passes without contacting the registry; otherwise
# it runs the check. It fails closed: the step says the pin is unchanged only on a pull_request whose HEAD
# is a merge commit with two parents, the second the event's head, whose git diff succeeded and listed no
# pin path. Any other case runs the check or fails the step, and a missing or garbled output runs the
# check too. So "Claude Code pin" reports on every pull request and is meant to be a required status
# check of the Protect main ruleset (docs/dev-environment.md, The Claude Code pin check). The push to main
# keeps the paths: filter: required checks matter on pull requests only, and an npm outage then never
# fails an unrelated merge on main, while a merge that changed the pin is re-checked.
on:
  push:
    branches: [main]
    paths:
      - .github/claude-code.yaml
      - .github/workflows/ai-review.yml
      - .github/scripts/install-claude-code.sh
      - .github/workflows/claude-code-pin.yml
      - ci/claudecodepin/**
      - go.mod
  pull_request:
    branches: [main]

permissions: {}

# A newer push to a pull request cancels its superseded run; a push to main never cancels a main run in
# progress. GitHub keeps at most one pending run per group, so a queued main run can be replaced by a
# newer one, but the latest merge is always re-checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-code-pin:
    name: Claude Code pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Two commits deep: the merge commit and its first parent, the two the changes step diffs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Writes pin=false only when this pull request changes none of the pin's paths; pin=true or a failed
      # step otherwise. The event is read from GITHUB_EVENT_NAME, so no expression is spliced into the
      # script.
      - name: Decide whether this change touches the Claude Code pin
        id: changes
        run: |
          set -euo pipefail
          # Fail closed: every path but the last line writes pin=true or fails the step.
          if [ "${GITHUB_EVENT_NAME:-}" != pull_request ]; then
            echo "Event ${GITHUB_EVENT_NAME:-unset}: checking the pin."
            echo "pin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD must be the pull request's merge commit: itself and exactly two parents.
          read -r -a commits <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ "${#commits[@]}" -ne 3 ]; then
            echo "HEAD is no merge commit with two parents: checking the pin."
            echo "pin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The parents in the order the diff needs: the second must be the pull request's head, as the
          # runner's event file names it, so HEAD^1 is main. A bare assignment, so a missing file or a
          # failing jq fails the step.
          head="$(jq -er .pull_request.head.sha "$GITHUB_EVENT_PATH")"
          if [ "${commits[2]}" != "$head" ]; then
            echo "HEAD's second parent is not the pull request's head: checking the pin."
            echo "pin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff goes to a file first, so a failing git diff fails the step (set -e) instead of
          # handing the loop an empty list, as a process substitution would. The file lives in the
          # checkout's git directory, which the runner discards with the checkout.
          changed="$(git rev-parse --absolute-git-dir)/claude-code-pin-changes"
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$changed"
          # NUL-separated names: no quote or newline in a name can hide a path, and --no-renames lists
          # the old path of a rename too.
          while IFS= read -r -d '' path || [ -n "$path" ]; do
            # In a case pattern * crosses /, so ci/claudecodepin/* matches nested files too, as the push
            # filter's ci/claudecodepin/** does.
            case "$path" in
              .github/claude-code.yaml | .github/workflows/ai-review.yml | .github/scripts/install-claude-code.sh | \
                .github/workflows/claude-code-pin.yml | go.mod | ci/claudecodepin/*)
                echo "This pull request changes a path of the Claude Code pin: checking the pin."
                echo "pin=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < "$changed"
          echo "The Claude Code pin's paths are unchanged: the npm registry was not contacted."
          echo "pin=false" >> "$GITHUB_OUTPUT"
      # No cache: the check is a standard-library program that builds in seconds, and a job that restores
      # nothing cannot be handed another run's build.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.changes.outputs.pin != 'false'
        with:
          go-version-file: go.mod
          cache: false
      # Prints one line on a pass, and one escaped ::error line naming the pinned and the published
      # integrity on a failure, so no text of the registry can become a workflow command.
      - name: Check the Claude Code CLI's pinned integrity against the npm registry
        if: steps.changes.outputs.pin != 'false'
        run: go run ./ci/claudecodepin
