name: Scheduled security audit

# The scheduled security audit of PRD #175 and ADR 0040. The checks job runs the repository's checks on
# a fresh runner and hands their raw results, encrypted to the model key, to the model job, which runs
# the audit in Claude Code's sandbox and hands its result, encrypted to the publish key, to the publish
# job, whose committed, model-free program alone holds the audit App's token and files the report.
# Nothing else crosses between the jobs: no job output, no cache, no other artifact.
#
# Only the maintainer starts a run, by hand, on main, on a run's first attempt: the guard condition in
# every job's if: and in the concurrency group. The schedule is milestone 3's: this file has none
# (test/architecture/auditgap_test.go holds that), and test/architecture's TestScheduledSecurityAuditWorkflow
# holds the rest of it to check.AuditWorkflow, step by step. Do not start it before PR 5c merges (runbook
# step 7 in docs/dev-environment.md). The checks job runs rows 1 to 11 and 13 to 16 of ADR 0040's table;
# a row that cannot run names itself in its results' not-run.txt, and a check that times out in
# limits.txt, so the result reports it "not run", never "clean".
on:
  # No inputs: a dispatch is the maintainer's, with nothing to fill in.
  workflow_dispatch:

# Nothing through GITHUB_TOKEN writes: the audit App's token files the report.
permissions: {}

# One audit at a time, and never a cancellation. A run whose jobs will be skipped takes a group of its
# own, so it neither queues behind nor cancels a real run: GitHub keeps one pending run per group and
# cancels the older pending one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || github.triggering_actor == github.repository_owner) && 'scheduled-security-audit' || format('skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    # ubuntu-24.04, never ubuntu-latest: the runner image's GNU coreutils and bubblewrap are what ADR 0040
    # recorded, and a newer image would change them unseen.
    runs-on: ubuntu-24.04
    # GitHub ends a job at 360 minutes. The job's own timeout is the ceiling the run's steps stay under:
    # they add up to at most 340 (test/architecture holds the sum), so the job's timeout never fires
    # before a step's own, and every step a check could hang runs that check under a timeout of its own
    # that records it "not run" instead of failing the step.
    timeout-minutes: 340
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || github.triggering_actor == github.repository_owner) }}
    # Every job runs in the environment whose deployment branch policy is main alone, which holds the
    # key pairs' public halves.
    environment: security-audit
    # GITHUB_TOKEN reads only: contents for the checkout, the release tag and the release download;
    # attestations for gh attestation verify (row 7); actions for scorecard's reads of the workflows'
    # runs (row 6); issues for Renovate's Dependency Dashboard (row 15). The image is public, so no
    # packages scope: it is pulled anonymously (row 8). Nothing here writes, and no read needs admin:
    # what the token is refused is recorded "not run".
    permissions:
      contents: read
      attestations: read
      actions: read
      issues: read
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The main commit the run started on, never a pull request's code.
          ref: ${{ github.sha }}
          # No credential is left in .git/config.
          persist-credentials: false
          # gitleaks scans the whole history.
          fetch-depth: 0
        timeout-minutes: 5
      # Row 1. The raw results of every row go to the results directory under this job's own temporary
      # directory, never to the log: the log shows the commit and the tag alone.
      - name: Record the audited commit and the latest release tag
        timeout-minutes: 5
        env:
          # The job's token, in the step-level env: of a step that reads GitHub's API, and of no step
          # that runs release code.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          mkdir -p "${results}"
          tag="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Audit checks::the latest release's tag is no vMAJOR.MINOR.PATCH: see runbook step 11"
            exit 1
          fi
          printf 'commit=%s\nrelease_tag=%s\n' "${GITHUB_SHA}" "${tag}" > "${results}/target.txt"
          # One line per check that did not run, "<check id> <why id>" in ADR 0040's coverage vocabulary,
          # and one per check that timed out: each later step appends its own, so the result names such a
          # check as not run, never as clean.
          touch "${results}/not-run.txt" "${results}/limits.txt"
          echo "Audited commit ${GITHUB_SHA}, latest release ${tag}"
      # Row 2. Every tool is pinned by version and SHA-256 (CLAUDE.md rule 7: Renovate bumps a version and
      # its digest in one PR) and checked before it is unpacked. govulncheck is a Go module, verified by
      # the checksum database, so it has no SHA-256 line; go install pkg@version picks its toolchain from
      # that module's own go line, not from go.mod's.
      - name: Download the pinned tools and verify their checksums
        timeout-minutes: 25
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks digestVersion=v8.30.1
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          # renovate: datasource=github-releases depName=google/osv-scanner
          OSV_SCANNER_VERSION: v2.7.1
          # renovate: datasource=github-release-attachments depName=google/osv-scanner digestVersion=v2.7.1
          OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          ZIZMOR_VERSION: v1.33.1
          # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor digestVersion=v1.33.1
          ZIZMOR_SHA256: "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43"
          # renovate: datasource=github-releases depName=FiloSottile/age
          AGE_VERSION: v1.3.2
          # renovate: datasource=github-release-attachments depName=FiloSottile/age digestVersion=v1.3.2
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
          # renovate: datasource=github-releases depName=ossf/scorecard
          SCORECARD_VERSION: v5.6.0
          # renovate: datasource=github-release-attachments depName=ossf/scorecard digestVersion=v5.6.0
          SCORECARD_SHA256: "19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a"
          # Same version as release.yml's cosign-release and cosignVersion in dev/lima.yaml, whose amd64
          # SHA-256 this is: Renovate's cosign group moves all of them in one PR.
          # renovate: datasource=github-releases depName=sigstore/cosign
          COSIGN_VERSION: v3.1.4
          # renovate: datasource=github-release-attachments depName=sigstore/cosign digestVersion=v3.1.4
          COSIGN_SHA256: "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa"
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: v0.76.2
          # renovate: datasource=github-release-attachments depName=aquasecurity/trivy digestVersion=v0.76.2
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          # Same version as security.yml's pin and govulncheckVersion in dev/lima.yaml.
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.10.0
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/downloads"
          mkdir -p "${bin}" "${dl}"
          curl -fsSLo "${dl}/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          # Each download's checksum check names the tool whose pin it fails and the runbook step that
          # puts it right, so a failed run says why: sha256sum's own line names no cause.
          if ! echo "${GITLEAKS_SHA256}  ${dl}/gitleaks.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::gitleaks's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${bin}" -xzf "${dl}/gitleaks.tar.gz" gitleaks
          curl -fsSLo "${dl}/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          if ! echo "${OSV_SCANNER_SHA256}  ${dl}/osv-scanner" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::osv-scanner's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          install -m 0755 "${dl}/osv-scanner" "${bin}/osv-scanner"
          curl -fsSLo "${dl}/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          if ! echo "${ZIZMOR_SHA256}  ${dl}/zizmor.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::zizmor's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${bin}" -xzf "${dl}/zizmor.tar.gz" zizmor
          curl -fsSLo "${dl}/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          if ! echo "${AGE_SHA256}  ${dl}/age.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::age's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${dl}" -xzf "${dl}/age.tar.gz" age/age
          install -m 0755 "${dl}/age/age" "${bin}/age"
          curl -fsSLo "${dl}/scorecard.tar.gz" "https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION#v}_linux_amd64.tar.gz"
          if ! echo "${SCORECARD_SHA256}  ${dl}/scorecard.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::scorecard's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${bin}" -xzf "${dl}/scorecard.tar.gz" scorecard
          curl -fsSLo "${dl}/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          if ! echo "${COSIGN_SHA256}  ${dl}/cosign" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::cosign's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          install -m 0755 "${dl}/cosign" "${bin}/cosign"
          curl -fsSLo "${dl}/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          if ! echo "${TRIVY_SHA256}  ${dl}/trivy.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit checks::trivy's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${bin}" -xzf "${dl}/trivy.tar.gz" trivy
          GOBIN="${bin}" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # trivy's vulnerability database, downloaded now (row 2), so that row 10 scans offline from it.
          # It moves every few hours and has no pin: trivy checks the OCI manifest's digest as it pulls it.
          # A failed download is recorded, and row 10 is then not run.
          rc=0
          timeout 10m "${bin}/trivy" image --download-db-only --cache-dir "${RUNNER_TEMP}/trivy-cache" --skip-version-check --disable-telemetry --no-progress > "${RUNNER_TEMP}/results/trivy-db.stdout" 2> "${RUNNER_TEMP}/results/trivy-db.stderr" || rc=$?
          echo "${rc}" > "${RUNNER_TEMP}/results/trivy-db.exit"
          echo "${bin}" >> "${GITHUB_PATH}"
      # This step's go mod download, run in the checkout, is the one that fetches the Go of go.mod's go
      # line (GOTOOLCHAIN, checksum-verified): no actions/setup-go, which would restore an Actions cache.
      - name: Download the Go modules
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go mod download
          go -C tools mod download
          # govulncheck reports standard-library vulnerabilities for the Go it runs with: go.mod's.
          want="go$(go list -m -f '{{.GoVersion}}')"
          if [ "$(go env GOVERSION)" != "${want}" ]; then
            echo "::error title=Audit checks::the go command is not go.mod's ${want}: see runbook step 11"
            exit 1
          fi
      # Rows 3 to 5. A finding is data for the model, not a failure of the job: each tool's output and
      # exit code go to the results directory, and the model triages both.
      - name: govulncheck
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/results/govulncheck"
          mkdir -p "${out}"
          rc=0
          GOFLAGS=-mod=readonly GOPROXY=off govulncheck -format json ./... > "${out}/module.json" 2> "${out}/module.stderr" || rc=$?
          echo "${rc}" > "${out}/module.exit"
          rc=0
          GOFLAGS=-mod=readonly GOPROXY=off govulncheck -C tools -format json github.com/rhysd/actionlint/cmd/actionlint > "${out}/tools.json" 2> "${out}/tools.stderr" || rc=$?
          echo "${rc}" > "${out}/tools.exit"
      - name: osv-scanner
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/results/osv-scanner"
          mkdir -p "${out}"
          rc=0
          osv-scanner scan source --format json --lockfile go.mod --lockfile tools/go.mod > "${out}/scan.json" 2> "${out}/scan.stderr" || rc=$?
          echo "${rc}" > "${out}/scan.exit"
      - name: gitleaks on the history
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/results/gitleaks"
          mkdir -p "${out}"
          rc=0
          gitleaks git --ignore-gitleaks-allow --redact --no-banner --log-level error --report-format json --report-path "${out}/history.json" . 2> "${out}/history.stderr" || rc=$?
          echo "${rc}" > "${out}/history.exit"
      # Row 5, in two steps: only zizmor's online audits read GitHub's API, so only its step holds the
      # job's token.
      - name: zizmor
        timeout-minutes: 10
        env:
          # The one read this row makes of GitHub's API.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/results/workflows"
          mkdir -p "${out}"
          rc=0
          zizmor --format json .github/workflows > "${out}/zizmor.json" 2> "${out}/zizmor.stderr" || rc=$?
          echo "${rc}" > "${out}/zizmor.exit"
      - name: actionlint
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/results/workflows"
          mkdir -p "${out}"
          rc=0
          # As dev/actionlint.sh runs it: tools/go.mod's actionlint, which finds .github/workflows itself.
          GOFLAGS=-mod=readonly GOPROXY=off go tool -modfile=tools/go.mod actionlint -format '{{json .}}' > "${out}/actionlint.json" 2> "${out}/actionlint.stderr" || rc=$?
          echo "${rc}" > "${out}/actionlint.exit"
      # Row 6. OpenSSF scorecard, read-only: the CLI, not the action, so nothing is published and no
      # id-token is asked for. It reads GitHub's API with the job's token, which scorecard takes from
      # GH_TOKEN. The checks that need admin read, Branch-Protection and Webhooks, are left out and
      # recorded as the check scorecard-admin, "not run (needs admin read)".
      - name: OpenSSF scorecard
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/scorecard"
          mkdir -p "${out}"
          checks="Binary-Artifacts,CI-Tests,CII-Best-Practices,Code-Review,Contributors,Dangerous-Workflow,Dependency-Update-Tool,Fuzzing,License,Maintained,Packaging,Pinned-Dependencies,SAST,Security-Policy,Signed-Releases,Token-Permissions,Vulnerabilities"
          rc=0
          timeout 15m scorecard --repo "github.com/${GH_REPO}" --checks "${checks}" --format json --show-details > "${out}/scorecard.json" 2> "${out}/scorecard.stderr" || rc=$?
          echo "${rc}" > "${out}/scorecard.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "scorecard timed-out" >> "${results}/not-run.txt"
            echo "scorecard timed out after 15 minutes" >> "${results}/limits.txt"
          fi
          printf '%s\n' Branch-Protection Webhooks > "${out}/admin-checks.txt"
          echo "scorecard-admin needs-admin-read" >> "${results}/not-run.txt"
          echo "finished"
      # Row 7. The release's files and its image as they are published: every release file against
      # checksums.txt and its own build provenance, the image's cosign signature and its provenance and
      # SBOM attestations, keyless, bound to this repository's release.yml at refs/tags/<tag>, and whether
      # GitHub's latest release and the image's latest tag agree. A refusal is data for the model, not a
      # failure of the job. The step reads GitHub's API with the job's token and runs no release code;
      # the registry is read anonymously.
      - name: Verify the release's files, signature and attestations
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          tag="$(sed -n 's/^release_tag=//p' "${results}/target.txt")"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Audit checks::the recorded release tag is no vMAJOR.MINOR.PATCH: see runbook step 11"
            exit 1
          fi
          out="${results}/release-integrity"
          rel="${RUNNER_TEMP}/release"
          mkdir -p "${out}/attestations" "${rel}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          signer="${GH_REPO}/.github/workflows/release.yml"
          identity="https://github.com/${signer}@refs/tags/${tag}"
          issuer="https://token.actions.githubusercontent.com"
          # No registry credential: the image is public, and every registry read here is anonymous.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-anonymous"
          mkdir -p "${DOCKER_CONFIG}"
          rc=0
          timeout 10m gh release download "${tag}" --repo "${GH_REPO}" --dir "${rel}" > "${out}/download.stdout" 2> "${out}/download.stderr" || rc=$?
          echo "${rc}" > "${out}/download.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "release-integrity timed-out" >> "${results}/not-run.txt"
            echo "release-integrity: the release download timed out after 10 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "release-integrity tool-failed" >> "${results}/not-run.txt"
          fi
          # checksums.txt is the release's: only its well-formed lines reach sha256sum, each one a
          # "<64 lower-case hex>  <name>" pair, and a line of any other shape - a /dev/zero it lists -
          # is data for the model, never an argument. checksums.filtered is this step's own file, so the
          # release's listing and its attestations below leave it out.
          rc=0
          timeout 1m grep -E '^[0-9a-f]{64}  [A-Za-z0-9._+-]+$' "${rel}/checksums.txt" > "${rel}/checksums.filtered" 2> "${out}/checksums-filter.stderr" || rc=$?
          echo "${rc}" > "${out}/checksums-filter.exit"
          # Every file against checksums.txt's well-formed lines, and checksums.txt against the release's
          # files: a file it does not list, or one it lists that the release lacks, is data for the model
          # too, and a sha256sum a hostile line makes wait ends in its own timeout.
          rc=0
          (cd "${rel}" && timeout 10m sha256sum --check --strict checksums.filtered) > "${out}/checksums.stdout" 2> "${out}/checksums.stderr" || rc=$?
          echo "${rc}" > "${out}/checksums.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "release-integrity timed-out" >> "${results}/not-run.txt"
            echo "release-integrity: the checksum check timed out after 10 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "release-integrity tool-failed" >> "${results}/not-run.txt"
          fi
          find "${rel}" -maxdepth 1 -type f ! -name checksums.txt ! -name checksums.filtered -printf '%f\n' | LC_ALL=C sort > "${out}/assets.txt"
          { awk '{ print $2 }' "${rel}/checksums.txt" 2> /dev/null || true; } | LC_ALL=C sort > "${out}/listed.txt"
          rc=0
          diff "${out}/listed.txt" "${out}/assets.txt" > "${out}/listing.diff" || rc=$?
          echo "${rc}" > "${out}/listing.exit"
          # Every release file's build provenance, checksums.txt's included, within the loop's budget of
          # 20 minutes from the step's start: a loop that runs out records the files it did not reach.
          while IFS= read -r -d '' file; do
            if [ "${SECONDS}" -ge 1200 ]; then
              echo "release-integrity: the budget of 20 minutes ran out before $(basename "${file}")" >> "${results}/limits.txt"
              continue
            fi
            name="$(basename "${file}")"
            rc=0
            timeout 2m gh attestation verify "${file}" \
              --repo "${GH_REPO}" \
              --signer-workflow "${signer}" \
              --source-ref "refs/tags/${tag}" \
              --deny-self-hosted-runners > "${out}/attestations/${name}.stdout" 2> "${out}/attestations/${name}.stderr" || rc=$?
            echo "${rc}" > "${out}/attestations/${name}.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "release-integrity timed-out" >> "${results}/not-run.txt"
              echo "release-integrity: the attestation of ${name} timed out after 2 minutes" >> "${results}/limits.txt"
            elif [ "${rc}" -ne 0 ]; then
              echo "release-integrity tool-failed" >> "${results}/not-run.txt"
            fi
          done < <(find "${rel}" -maxdepth 1 -type f ! -name checksums.filtered -print0)
          # The tag's digest, which every later row reads by, and the latest tag's: a digest the registry
          # answers in any other shape is recorded as no digest, so the image is then not pulled.
          rc=0
          tag_digest="$(timeout 2m docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}' 2> "${out}/tag-digest.stderr")" || rc=$?
          echo "${rc}" > "${out}/tag-digest.exit"
          if [[ ! "${tag_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            tag_digest=""
          fi
          printf '%s\n' "${tag_digest}" > "${out}/image-digest.txt"
          rc=0
          latest_digest="$(timeout 2m docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}' 2> "${out}/latest-digest.stderr")" || rc=$?
          echo "${rc}" > "${out}/latest-digest.exit"
          rc=0
          latest_release="$(timeout 2m gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name 2> "${out}/latest-release.stderr")" || rc=$?
          echo "${rc}" > "${out}/latest-release.exit"
          printf 'recorded_tag=%s\nlatest_release=%s\ntag_digest=%s\nlatest_digest=%s\n' "${tag}" "${latest_release}" "${tag_digest}" "${latest_digest}" > "${out}/latest.txt"
          if [ -n "${tag_digest}" ]; then
            ref="${image}@${tag_digest}"
            rc=0
            timeout 5m cosign verify "${ref}" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --certificate-github-workflow-trigger push > "${out}/cosign-signature.json" 2> "${out}/cosign-signature.stderr" || rc=$?
            echo "${rc}" > "${out}/cosign-signature.exit"
            for pair in provenance:slsaprovenance1 sbom:https://spdx.dev/Document/v2.3; do
              kind="${pair%%:*}"
              type="${pair#*:}"
              rc=0
              timeout 5m cosign verify-attestation "${ref}" \
                --type "${type}" \
                --certificate-identity "${identity}" \
                --certificate-oidc-issuer "${issuer}" \
                --certificate-github-workflow-trigger push > "${out}/cosign-${kind}.json" 2> "${out}/cosign-${kind}.stderr" || rc=$?
              echo "${rc}" > "${out}/cosign-${kind}.exit"
            done
            # The SBOM itself, for row 10: the predicate of the attestation gh verifies.
            rc=0
            timeout 5m gh attestation verify "oci://${ref}" \
              --repo "${GH_REPO}" \
              --signer-workflow "${signer}" \
              --source-ref "refs/tags/${tag}" \
              --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --format json > "${out}/sbom-attestation.json" 2> "${out}/sbom-attestation.stderr" || rc=$?
            echo "${rc}" > "${out}/sbom-attestation.exit"
            rc=0
            jq -e '.[0].verificationResult.statement.predicate' "${out}/sbom-attestation.json" > "${out}/sbom.spdx.json" 2> /dev/null || rc=$?
            echo "${rc}" > "${out}/sbom-extract.exit"
          fi
          echo "finished"
      # Row 8. The image, pulled anonymously from GHCR by the digest row 7 resolved: no packages scope and
      # no docker login, so a pull that needs a credential fails as it would for any user. It is saved
      # as an archive for trivy (row 10). No token: nothing here reads GitHub's API.
      - name: Pull the image anonymously by digest
        timeout-minutes: 15
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/image-pull"
          mkdir -p "${out}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-anonymous"
          mkdir -p "${DOCKER_CONFIG}"
          digest="$(cat "${results}/release-integrity/image-digest.txt")"
          if [ -z "${digest}" ]; then
            echo "image-pull image-not-pulled" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit checks::the recorded image digest is no sha256 digest: see runbook step 11"
            exit 1
          fi
          rc=0
          timeout 10m docker pull --platform linux/amd64 "${image}@${digest}" > "${out}/pull.stdout" 2> "${out}/pull.stderr" || rc=$?
          echo "${rc}" > "${out}/pull.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "image-pull timed-out" >> "${results}/not-run.txt"
            echo "image-pull timed out after 10 minutes" >> "${results}/limits.txt"
          fi
          if [ "${rc}" -eq 0 ]; then
            mkdir -p "${RUNNER_TEMP}/image"
            rc=0
            timeout 2m docker image inspect "${image}@${digest}" > "${out}/inspect.json" 2> "${out}/inspect.stderr" || rc=$?
            echo "${rc}" > "${out}/inspect.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "image-pull timed-out" >> "${results}/not-run.txt"
              echo "image-pull: the image inspect timed out after 2 minutes" >> "${results}/limits.txt"
            elif [ "${rc}" -ne 0 ]; then
              echo "image-pull tool-failed" >> "${results}/not-run.txt"
            fi
            rc=0
            timeout 5m docker save --output "${RUNNER_TEMP}/image/image.tar" "${image}@${digest}" 2> "${out}/save.stderr" || rc=$?
            echo "${rc}" > "${out}/save.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "image-pull timed-out" >> "${results}/not-run.txt"
              echo "image-pull: the image save timed out after 5 minutes" >> "${results}/limits.txt"
            elif [ "${rc}" -ne 0 ]; then
              echo "image-pull tool-failed" >> "${results}/not-run.txt"
            fi
          fi
          echo "finished"
      # Row 9. govulncheck in binary mode on every release binary: read, never run. Each archive gives up
      # its shift2eu binary alone, streamed to stdout through the step's size cap under a timeout, so an
      # archive's owner, mode, links and extra members are no part of what is read.
      - name: govulncheck on the release binaries
        timeout-minutes: 20
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/binary-vulnerabilities"
          rel="${RUNNER_TEMP}/release"
          bins="${RUNNER_TEMP}/release-binaries"
          mkdir -p "${out}" "${bins}"
          found=0
          while IFS= read -r -d '' archive; do
            name="$(basename "${archive}")"
            dir="${bins}/${name}"
            mkdir -p "${dir}"
            # The member alone, through a size cap: an archive whose member decompresses to gigabytes
            # stops at 128 MiB instead of filling the runner's disk.
            rc=0
            case "${name}" in
              *.tar.gz) timeout 2m tar -xOzf "${archive}" shift2eu 2> "${out}/${name}.unpack.stderr" | head -c 134217728 > "${dir}/shift2eu" || rc=$? ;;
              *.zip) timeout 2m unzip -p "${archive}" shift2eu.exe 2> "${out}/${name}.unpack.stderr" | head -c 134217728 > "${dir}/shift2eu.exe" || rc=$? ;;
            esac
            echo "${rc}" > "${out}/${name}.unpack.exit"
            if [ "${rc}" -ne 0 ]; then
              echo "binary-vulnerabilities tool-failed" >> "${results}/not-run.txt"
            fi
            bin="$(find "${dir}" -maxdepth 1 -type f \( -name shift2eu -o -name shift2eu.exe \) -print -quit)"
            if [ -z "${bin}" ]; then
              continue
            fi
            found=$((found + 1))
            rc=0
            GOFLAGS=-mod=readonly GOPROXY=off timeout 5m govulncheck -mode=binary -format json "${bin}" > "${out}/${name}.json" 2> "${out}/${name}.stderr" || rc=$?
            echo "${rc}" > "${out}/${name}.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "binary-vulnerabilities timed-out" >> "${results}/not-run.txt"
              echo "binary-vulnerabilities: ${name} timed out after 5 minutes" >> "${results}/limits.txt"
            elif [ "${rc}" -ne 0 ]; then
              echo "binary-vulnerabilities tool-failed" >> "${results}/not-run.txt"
            fi
          done < <(find "${rel}" -maxdepth 1 -type f \( -name 'shift2eu_*.tar.gz' -o -name 'shift2eu_*.zip' \) -print0)
          if [ "${found}" -eq 0 ]; then
            echo "binary-vulnerabilities results-missing" >> "${results}/not-run.txt"
          fi
          echo "finished"
      # Row 10. trivy on the pulled image and on its attested SBOM, from the database row 2 downloaded:
      # offline at scan time, with no database, Java database, check bundle or version download and no
      # telemetry.
      - name: trivy on the image and its SBOM
        timeout-minutes: 15
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/image-scan"
          mkdir -p "${out}"
          if [ "$(cat "${results}/trivy-db.exit")" != 0 ]; then
            echo "image-scan tool-failed" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          offline=(--cache-dir "${RUNNER_TEMP}/trivy-cache" --skip-db-update --skip-java-db-update --skip-check-update --offline-scan --skip-version-check --disable-telemetry --no-progress --scanners vuln --format json)
          scanned=0
          if [ -f "${RUNNER_TEMP}/image/image.tar" ]; then
            rc=0
            timeout 10m trivy image "${offline[@]}" --input "${RUNNER_TEMP}/image/image.tar" --output "${out}/image.json" 2> "${out}/image.stderr" || rc=$?
            echo "${rc}" > "${out}/image.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "image-scan: the image scan timed out after 10 minutes" >> "${results}/limits.txt"
            fi
            scanned=$((scanned + 1))
          else
            echo "image-scan: the image was not pulled, so only its SBOM was scanned" >> "${results}/limits.txt"
          fi
          sbom="${results}/release-integrity/sbom.spdx.json"
          if [ -s "${sbom}" ]; then
            rc=0
            timeout 5m trivy sbom "${offline[@]}" --output "${out}/sbom.json" "${sbom}" 2> "${out}/sbom.stderr" || rc=$?
            echo "${rc}" > "${out}/sbom.exit"
            if [ "${rc}" -eq 124 ]; then
              echo "image-scan: the SBOM scan timed out after 5 minutes" >> "${results}/limits.txt"
            fi
            scanned=$((scanned + 1))
          else
            echo "image-scan: no verified SBOM, so only the image was scanned" >> "${results}/limits.txt"
          fi
          if [ "${scanned}" -eq 0 ]; then
            echo "image-scan image-not-pulled" >> "${results}/not-run.txt"
          fi
          echo "finished"
      # Row 11. The image's runtime settings, read from its configuration and its filesystem, never by
      # a shell in it: its user, a start with a read-only root filesystem, no network and no capability,
      # and the shells and setuid files its filesystem holds. docker create starts nothing, and docker
      # export copies the created container's filesystem out as an archive that tar only lists.
      - name: Check the image's runtime settings
        timeout-minutes: 10
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/image-runtime"
          mkdir -p "${out}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(cat "${results}/release-integrity/image-digest.txt")"
          if [ -z "${digest}" ]; then
            echo "image-runtime image-not-pulled" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit checks::the recorded image digest is no sha256 digest: see runbook step 11"
            exit 1
          fi
          rc=0
          timeout 1m docker image inspect "${image}@${digest}" > /dev/null 2> "${out}/inspect-presence.stderr" || rc=$?
          echo "${rc}" > "${out}/inspect-presence.exit"
          if [ "${rc}" -ne 0 ]; then
            echo "image-runtime image-not-pulled" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          # Each command that reads the image runs under a timeout of its own and records a failure as the
          # check not run: the image is the release's, and nothing it holds ends the step.
          rc=0
          timeout 2m docker image inspect --format '{{json .Config}}' "${image}@${digest}" > "${out}/config.json" 2> "${out}/config.stderr" || rc=$?
          echo "${rc}" > "${out}/config.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "image-runtime timed-out" >> "${results}/not-run.txt"
            echo "image-runtime: the config read timed out after 2 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "image-runtime tool-failed" >> "${results}/not-run.txt"
          fi
          rc=0
          cid="$(timeout 2m docker create --read-only --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --pids-limit 64 "${image}@${digest}" version)" || rc=$?
          echo "${rc}" > "${out}/create.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "image-runtime timed-out" >> "${results}/not-run.txt"
            echo "image-runtime: the container create timed out after 2 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "image-runtime tool-failed" >> "${results}/not-run.txt"
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "finished"
            exit 0
          fi
          # tar's own warnings name the image's entries, so they go to the results directory too.
          rc=0
          timeout 5m docker export "${cid}" 2> "${out}/export.stderr" | tar -tvf - > "${out}/filesystem.txt" 2> "${out}/filesystem.stderr" || rc=$?
          echo "${rc}" > "${out}/filesystem.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "image-runtime timed-out" >> "${results}/not-run.txt"
            echo "image-runtime: the filesystem listing timed out after 5 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "image-runtime tool-failed" >> "${results}/not-run.txt"
          fi
          rc=0
          timeout 60 docker start --attach "${cid}" > "${out}/version.stdout" 2> "${out}/version.stderr" < /dev/null || rc=$?
          echo "${rc}" > "${out}/version.exit"
          if [ "${rc}" -eq 124 ]; then
            docker kill "${cid}" > /dev/null 2>&1 || true
            echo "image-runtime timed-out" >> "${results}/not-run.txt"
            echo "image-runtime: the read-only start timed out after 60 seconds" >> "${results}/limits.txt"
          fi
          docker inspect --format '{{.State.ExitCode}} {{.State.OOMKilled}}' "${cid}" > "${out}/version.state"
          docker rm -f "${cid}" > /dev/null
          grep -E '/(sh|ash|bash|dash|ksh|zsh|busybox)( -> .*)?$' "${out}/filesystem.txt" > "${out}/shells.txt" || true
          grep -E '^[-l]..[sS]|^[-l].....[sS]' "${out}/filesystem.txt" > "${out}/setuid.txt" || true
          echo "finished"
      # Row 13. The released CLI on hostile inventory files: the committed corpus (ADR 0040) and the cases
      # generated here, which no text file holds. The inputs reach the image one way: docker cp into a
      # container that is created and never started, which docker commit turns into the image each run
      # starts from, as Docker refuses a docker cp into a container whose root filesystem is read-only.
      # Each run is a container of its own: no network, a read-only root filesystem, no capability, no new
      # privileges, no tmpfs (the CLI writes nothing but its stdout and stderr), no mount and no socket,
      # and its output leaves only on its stdout and stderr.
      - name: Run the CLI on hostile inventory files
        timeout-minutes: 20
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/hostile-inventories"
          mkdir -p "${out}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(cat "${results}/release-integrity/image-digest.txt")"
          if [ -z "${digest}" ]; then
            echo "hostile-inventories image-not-pulled" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit checks::the recorded image digest is no sha256 digest: see runbook step 11"
            exit 1
          fi
          rc=0
          timeout 1m docker image inspect "${image}@${digest}" > /dev/null 2> "${out}/inspect-presence.stderr" || rc=$?
          echo "${rc}" > "${out}/inspect-presence.exit"
          if [ "${rc}" -ne 0 ]; then
            echo "hostile-inventories image-not-pulled" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          stage="${RUNNER_TEMP}/hostile/hostile"
          mkdir -p "${stage}/a-directory"
          # -P: a link the corpus holds is copied as a link, never followed on the runner
          # (test/architecture's TestAuditHostileCorpusIsRegularFiles holds the corpus to regular files).
          cp -P .github/security-audit/testdata/hostile-inventories/*.json "${stage}/"
          prefix='{"schemaVersion": 2, "source": "aws", "resources": ['
          # One byte past the 10 MiB cap: a valid opening, then spaces.
          { printf '%s' "${prefix}"; head -c 10485761 /dev/zero | tr '\0' ' '; printf ']}\n'; } > "${stage}/oversized.json"
          # One resource past the cap of 50000.
          {
            printf '%s' "${prefix}"
            for i in $(seq 1 50000); do
              printf '{"id": "r%d", "rawType": "x", "category": "compute.vm", "region": "eu-central-1"},' "${i}"
            done
            printf '{"id": "last", "rawType": "x", "category": "compute.vm", "region": "eu-central-1"}]}\n'
          } > "${stage}/too-many-resources.json"
          # Arrays nested 100000 deep where a resource is wanted, and an ID of 1 MiB.
          { printf '%s' "${prefix}"; head -c 100000 /dev/zero | tr '\0' '['; head -c 100000 /dev/zero | tr '\0' ']'; printf ']}\n'; } > "${stage}/deep-nesting.json"
          { printf '%s{"id": "' "${prefix}"; head -c 1048576 /dev/zero | tr '\0' 'a'; printf '", "rawType": "x", "category": "compute.vm", "region": "eu-central-1"}]}\n'; } > "${stage}/huge-string.json"
          # Malformed UTF-8 (a lone continuation byte, an overlong slash, an encoded surrogate), a byte
          # order mark, a NUL byte outside a string, and nothing at all.
          printf '%s{"id": "bad-\x80-\xc0\xaf-\xed\xa0\x80", "rawType": "x", "category": "compute.vm", "region": "eu-central-1"}]}\n' "${prefix}" > "${stage}/malformed-utf8.json"
          printf '\xef\xbb\xbf{"schemaVersion": 2, "source": "aws", "resources": []}\n' > "${stage}/byte-order-mark.json"
          printf '{"schemaVersion": 2, "source": "aws",\x00 "resources": []}\n' > "${stage}/nul-byte.json"
          : > "${stage}/empty.json"
          # Links out of the input: the CLI's own environment, endless files, a missing file and a loop.
          ln -s /proc/self/environ "${stage}/link-to-environ.json"
          ln -s /dev/zero "${stage}/link-to-zero.json"
          ln -s /dev/urandom "${stage}/link-to-urandom.json"
          ln -s missing.json "${stage}/dangling-link.json"
          ln -s link-loop.json "${stage}/link-loop.json"
          chmod 0755 "${stage}" "${stage}/a-directory"
          find "${stage}" -type f -exec chmod 0644 {} +
          # The inputs reach a container that is created, copied into and committed, each command under a
          # timeout of its own: the image is the release's, and a command it makes wait ends here, with
          # the check's id in not-run.txt or limits.txt, not as a failed step with no report at all.
          rc=0
          staging="$(timeout 1m docker create "${image}@${digest}")" || rc=$?
          echo "${rc}" > "${out}/staging-create.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "hostile-inventories timed-out" >> "${results}/not-run.txt"
            echo "hostile-inventories: the staging container's create timed out after 1 minute" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "hostile-inventories tool-failed" >> "${results}/not-run.txt"
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "finished"
            exit 0
          fi
          rc=0
          timeout 2m docker cp "${stage}" "${staging}:/work/" 2> "${out}/staging-cp.stderr" || rc=$?
          echo "${rc}" > "${out}/staging-cp.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "hostile-inventories timed-out" >> "${results}/not-run.txt"
            echo "hostile-inventories: the inputs' copy timed out after 2 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "hostile-inventories tool-failed" >> "${results}/not-run.txt"
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "finished"
            exit 0
          fi
          rc=0
          timeout 2m docker commit "${staging}" "audit-hostile:${GITHUB_RUN_ID}" > "${out}/staging-commit.stdout" 2> "${out}/staging-commit.stderr" || rc=$?
          echo "${rc}" > "${out}/staging-commit.exit"
          if [ "${rc}" -eq 124 ]; then
            echo "hostile-inventories timed-out" >> "${results}/not-run.txt"
            echo "hostile-inventories: the commit timed out after 2 minutes" >> "${results}/limits.txt"
          elif [ "${rc}" -ne 0 ]; then
            echo "hostile-inventories tool-failed" >> "${results}/not-run.txt"
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "finished"
            exit 0
          fi
          docker rm "${staging}" > /dev/null
          for path in "${stage}"/*; do
            name="$(basename "${path}")"
            for format in markdown json; do
              # The step's budget: 15 minutes of runs, which leaves room for the image's set-up.
              if [ "${SECONDS}" -ge 900 ]; then
                echo "hostile-inventories: the budget of 15 minutes ran out before ${name} as ${format}" >> "${results}/limits.txt"
                continue
              fi
              run="${name}.${format}"
              rc=0
              cid="$(timeout 2m docker create --read-only --network none --cap-drop ALL --security-opt no-new-privileges --memory 512m --pids-limit 64 "audit-hostile:${GITHUB_RUN_ID}" assess --inventory "hostile/${name}" --target all --format "${format}")" || rc=$?
              echo "${rc}" > "${out}/${run}.create.exit"
              if [ "${rc}" -eq 124 ]; then
                echo "hostile-inventories timed-out" >> "${results}/not-run.txt"
                echo "hostile-inventories: the create for ${run} timed out after 2 minutes" >> "${results}/limits.txt"
              elif [ "${rc}" -ne 0 ]; then
                echo "hostile-inventories tool-failed" >> "${results}/not-run.txt"
              fi
              if [ "${rc}" -ne 0 ]; then
                continue
              fi
              rc=0
              timeout 60 docker start --attach "${cid}" > "${out}/${run}.stdout" 2> "${out}/${run}.stderr" < /dev/null || rc=$?
              echo "${rc}" > "${out}/${run}.exit"
              if [ "${rc}" -eq 124 ]; then
                docker kill "${cid}" > /dev/null 2>&1 || true
                echo "hostile-inventories timed-out" >> "${results}/not-run.txt"
                echo "hostile-inventories: ${run} timed out after 60 seconds" >> "${results}/limits.txt"
              fi
              docker inspect --format '{{.State.ExitCode}} {{.State.OOMKilled}}' "${cid}" > "${out}/${run}.state"
              docker rm -f "${cid}" > /dev/null
            done
          done
          docker image rm "audit-hostile:${GITHUB_RUN_ID}" > /dev/null
          echo "finished"
      # Row 14. Time-boxed fuzzing of the committed Fuzz* targets, found by reading the tracked *_test.go
      # files outside testdata as text: nothing runs to list them. Each target fuzzes for 10 minutes in a
      # container of its own, from the Go image pinned below by digest: no network, GOPROXY=off, a
      # read-only root filesystem, no capability, no new privileges, an unprivileged user. Its inputs, the
      # tree at the audited commit and the module cache, reach the image as row 13's do; its one tmpfs,
      # /scratch, holds the copy of the tree go test writes crash inputs into, the build cache and the
      # binaries go test builds and runs, so it is mounted exec. The crash inputs leave on stdout as a tar
      # stream, and the log on stderr. At most three targets run, within the step's 50 minutes; any other
      # target is recorded in the limits.
      - name: Fuzz the committed Fuzz targets
        timeout-minutes: 50
        env:
          GOFLAGS: -mod=readonly
          GOPROXY: "off"
          # The Dockerfile's builder image, by tag and digest: Renovate's Go toolchain group moves it with
          # go.mod's go line and the Dockerfile's copy.
          # renovate: datasource=docker depName=golang
          GO_IMAGE: "1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280"
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/fuzzing"
          mkdir -p "${out}/targets"
          git ls-files -z -- '*_test.go' | while IFS= read -r -d '' file; do
            case "/${file}" in
              */testdata/*) continue ;;
            esac
            { grep -oE '^func Fuzz[A-Z0-9_][A-Za-z0-9_]*\(f \*testing\.F\)' "${file}" || true; } | sed -e 's/^func //' -e 's/(f \*testing\.F)$//' | while IFS= read -r name; do
              printf '%s %s\n' "$(dirname "${file}")" "${name}"
            done
          done | LC_ALL=C sort -u > "${out}/targets.txt"
          if [ ! -s "${out}/targets.txt" ]; then
            echo "fuzzing no-fuzz-targets" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          image="golang:${GO_IMAGE}"
          rc=0
          timeout 5m docker pull "${image}" > "${out}/pull.stdout" 2> "${out}/pull.stderr" || rc=$?
          echo "${rc}" > "${out}/pull.exit"
          if [ "${rc}" -ne 0 ]; then
            echo "fuzzing tool-failed" >> "${results}/not-run.txt"
            echo "finished"
            exit 0
          fi
          src="${RUNNER_TEMP}/fuzz-src"
          mkdir -p "${src}"
          git archive --format=tar "${GITHUB_SHA}" | tar -C "${src}" -xf -
          modcache="$(go env GOMODCACHE)"
          staging="$(docker create "${image}")"
          docker cp "${src}" "${staging}:/src"
          docker cp "${modcache}" "${staging}:/modcache"
          docker commit "${staging}" "audit-fuzz:${GITHUB_RUN_ID}" > /dev/null
          docker rm "${staging}" > /dev/null
          n=0
          while read -r pkg name; do
            # A target of an unexpected shape never reaches the container, and is recorded: it is no reason
            # to end the step, and the run's report.
            if [[ ! "${name}" =~ ^Fuzz[A-Z0-9_][A-Za-z0-9_]*$ ]] || [[ ! "${pkg}" =~ ^[A-Za-z0-9_][A-Za-z0-9_./-]*$ ]] || [[ "${pkg}" == *..* ]]; then
              echo "fuzzing unexpected-target" >> "${results}/not-run.txt"
              continue
            fi
            n=$((n + 1))
            if [ "${n}" -gt 3 ]; then
              echo "fuzzing: ${pkg} ${name} not run, over the budget of three targets" >> "${results}/limits.txt"
              continue
            fi
            cid="$(docker create --read-only --network none --cap-drop ALL --security-opt no-new-privileges --memory 10g --pids-limit 512 --user 65534:65534 \
              --tmpfs /scratch:rw,exec,nosuid,size=4g,mode=1777 \
              --env GOFLAGS --env GOPROXY --env GOTOOLCHAIN=local --env GOMODCACHE=/modcache --env GOCACHE=/scratch/go-build \
              --env GOTMPDIR=/scratch --env TMPDIR=/scratch --env HOME=/scratch --env FUZZ_PKG="${pkg}" --env FUZZ_NAME="${name}" \
              "audit-fuzz:${GITHUB_RUN_ID}" \
              sh -c 'cp -R /src /scratch/src && cd /scratch/src && go test -run "^$" -fuzz "^${FUZZ_NAME}\$" -fuzztime 10m "./${FUZZ_PKG}" >&2; rc=$?; tar -C /scratch/src -cf - "${FUZZ_PKG}/testdata/fuzz" 2> /dev/null; exit "${rc}"')"
            rc=0
            timeout 12m docker start --attach "${cid}" > "${out}/targets/${n}-${name}.tar" 2> "${out}/targets/${n}-${name}.log" < /dev/null || rc=$?
            echo "${rc}" > "${out}/targets/${n}-${name}.exit"
            if [ "${rc}" -eq 124 ]; then
              docker kill "${cid}" > /dev/null 2>&1 || true
              echo "fuzzing: ${pkg} ${name} timed out after 12 minutes" >> "${results}/limits.txt"
            fi
            docker rm -f "${cid}" > /dev/null
          done < "${out}/targets.txt"
          docker image rm "audit-fuzz:${GITHUB_RUN_ID}" > /dev/null
          echo "finished"
      # Row 15. Supply-chain reads: the workflows' action pins and permissions from the checkout, as
      # text; the rulesets, the environments and their branch policies, and the secret and variable
      # names, as the release-tag skill's step 2 reads them; Renovate's Dependency Dashboard and open pull
      # requests; and the dependency files changed since the last report. Reads only, with the job's
      # token: a read it is refused is recorded in read-refused.txt and the limits, "not run (read
      # refused)" for that read.
      - name: Supply-chain reads
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          results="${RUNNER_TEMP}/results"
          out="${results}/supply-chain"
          mkdir -p "${out}/api"
          grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows > "${out}/uses.txt" || true
          { grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows || true; } | { grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true; } > "${out}/uses-not-pinned.txt"
          grep -rn -A12 -E '^[[:space:]]*permissions:' .github/workflows > "${out}/permissions.txt" || true
          touch "${out}/read-refused.txt"
          # read_api reads one endpoint into the results directory, never the log, and keeps its third
          # argument as the jq filter: the reads that return values pass a filter that keeps the names
          # alone, so no variable's value reaches the model.
          read_api() {
            local name="$1" endpoint="$2" filter="${3:-.}" rc=0
            timeout 2m gh api "${endpoint}" --jq "${filter}" > "${out}/api/${name}.json" 2> "${out}/api/${name}.stderr" || rc=$?
            echo "${rc}" > "${out}/api/${name}.exit"
            if [ "${rc}" -ne 0 ]; then
              echo "${name}" >> "${out}/read-refused.txt"
            fi
          }
          read_api rulesets "repos/${GH_REPO}/rulesets?includes_parents=true"
          for id in $(jq -r '.[]?.id' "${out}/api/rulesets.json" 2> /dev/null || true); do
            if [[ ! "${id}" =~ ^[0-9]+$ ]]; then
              echo "::error title=Audit checks::a ruleset ID is no number: see runbook step 11"
              exit 1
            fi
            read_api "ruleset-${id}" "repos/${GH_REPO}/rulesets/${id}"
          done
          for env in release-please release-tag ai-review site security-audit; do
            read_api "environment-${env}" "repos/${GH_REPO}/environments/${env}"
            read_api "environment-${env}-branch-policies" "repos/${GH_REPO}/environments/${env}/deployment-branch-policies"
            read_api "environment-${env}-secret-names" "repos/${GH_REPO}/environments/${env}/secrets" '[.secrets[].name]'
            read_api "environment-${env}-variable-names" "repos/${GH_REPO}/environments/${env}/variables" '[.variables[].name]'
          done
          read_api repository-secret-names "repos/${GH_REPO}/actions/secrets" '[.secrets[].name]'
          read_api repository-variable-names "repos/${GH_REPO}/actions/variables" '[.variables[].name]'
          read_api renovate-dashboard "repos/${GH_REPO}/issues?state=all&creator=renovate%5Bbot%5D&per_page=100"
          read_api renovate-pull-requests "search/issues?q=repo:${GH_REPO}+is:pr+is:open+author:app/renovate&per_page=100"
          last="$(git ls-files 'docs/security/audits/[0-9]*.md' | LC_ALL=C sort | tail -n 1)"
          if [ -n "${last}" ]; then
            base="$(git log -1 --format=%H -- "${last}")"
            printf 'last_report=%s\nbase=%s\n' "${last}" "${base}" > "${out}/dependencies.txt"
            git diff "${base}" "${GITHUB_SHA}" -- go.mod go.sum tools/go.mod tools/go.sum Dockerfile .github/workflows .github/claude-code.yaml dev/lima.yaml infra/tofu.yaml > "${out}/dependencies.diff"
          else
            echo "no earlier report" > "${out}/dependencies.txt"
          fi
          if [ -s "${out}/read-refused.txt" ]; then
            echo "supply-chain: reads refused to the job's token, listed in supply-chain/read-refused.txt: not run (read refused)" >> "${results}/limits.txt"
          fi
          echo "finished"
      # Row 16. Ciphertext alone leaves the job: anything in this job could forge one with the public
      # half, so the model job treats what it decrypts as untrusted input.
      - name: Encrypt the checks' results to the model key
        timeout-minutes: 5
        env:
          AUDIT_MODEL_PUBLIC_KEY: ${{ vars.AUDIT_MODEL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          tar -C "${RUNNER_TEMP}" -cf "${RUNNER_TEMP}/checks.tar" results
          age --encrypt --recipient "${AUDIT_MODEL_PUBLIC_KEY}" --output "${RUNNER_TEMP}/checks-result.age" "${RUNNER_TEMP}/checks.tar"
          echo "finished"
      - name: Upload the checks' ciphertext
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-result
          path: ${{ runner.temp }}/checks-result.age
          retention-days: 1
          if-no-files-found: error

  model:
    name: Model
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || github.triggering_actor == github.repository_owner) }}
    environment: security-audit
    # GITHUB_TOKEN reads only: contents for the checkout, actions for the artifact listing and the
    # download. No secret is in a job's env:, and no check, container or release code runs here.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The audit's copy holds the history its findings quote.
          fetch-depth: 0
        timeout-minutes: 5
      # Fetches go.mod's Go (GOTOOLCHAIN, checksum-verified) and the modules: every Go command after this
      # step runs offline.
      - name: Download the Go modules
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go mod download
      # The CLI's version and integrity live in the one pin file, which Renovate bumps and
      # ci/claudecodepin holds to the registry (ADR 0040); they reach the install step and the model step
      # as this step's outputs, through env: only.
      - name: Read the Claude Code pin
        id: claude-code-pin
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pin=.github/claude-code.yaml
          version="$(grep -E '^version: [0-9]+\.[0-9]+\.[0-9]+$' "${pin}" || true)"
          integrity="$(grep -E '^integrity: sha512-[A-Za-z0-9+/]{86}==$' "${pin}" || true)"
          if [ "$(grep -c '^version:' "${pin}")" != 1 ] || [ "$(grep -c '^integrity:' "${pin}")" != 1 ] ||
            [ -z "${version}" ] || [ -z "${integrity}" ]; then
            echo "::error title=Claude Code pin::${pin} holds no single exact version: line and sha512 integrity: line"
            exit 1
          fi
          {
            printf 'version=%s\n' "${version#version: }"
            printf 'integrity=%s\n' "${integrity#integrity: }"
          } >> "${GITHUB_OUTPUT}"
      # bubblewrap and socat, the sandbox's two programs, from the Ubuntu archive at a pinned version, each
      # .deb checked against the SHA-256 of noble-updates' signed Packages index before dpkg -i. Renovate
      # bumps the version (its deb datasource, .github/renovate.json5); the digest is replaced by hand in
      # the same PR from that index. age decrypts the checks' results and encrypts the result.
      - name: Install the pinned tools
        timeout-minutes: 20
        env:
          # renovate: datasource=deb depName=bubblewrap
          BUBBLEWRAP_VERSION: 0.9.0-1ubuntu0.3
          # SHA-256 of bubblewrap_<version>_amd64.deb in noble-updates' Packages index.
          BUBBLEWRAP_DEB_SHA256: "2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094"
          # renovate: datasource=deb depName=socat
          SOCAT_VERSION: 1.8.0.0-4ubuntu0.1
          # SHA-256 of socat_<version>_amd64.deb in noble-updates' Packages index.
          SOCAT_DEB_SHA256: "46e854289b6b1c97e28be5d9293bea61e8633d00d6a65d9513f019c7232696fe"
          # renovate: datasource=github-releases depName=FiloSottile/age
          AGE_VERSION: v1.3.2
          # renovate: datasource=github-release-attachments depName=FiloSottile/age digestVersion=v1.3.2
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
          CLAUDE_CODE_PIN_VERSION: ${{ steps.claude-code-pin.outputs.version }}
          CLAUDE_CODE_PIN_INTEGRITY: ${{ steps.claude-code-pin.outputs.integrity }}
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/downloads"
          mkdir -p "${bin}" "${dl}"
          curl -fsSLo "${dl}/bubblewrap.deb" "https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_${BUBBLEWRAP_VERSION}_amd64.deb"
          # Each download's checksum check names the tool whose pin it fails and the runbook step that
          # puts it right, so a failed run says why: sha256sum's own line names no cause.
          if ! echo "${BUBBLEWRAP_DEB_SHA256}  ${dl}/bubblewrap.deb" | sha256sum --check --strict -; then
            echo "::error title=Audit model::bubblewrap's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          curl -fsSLo "${dl}/socat.deb" "https://archive.ubuntu.com/ubuntu/pool/main/s/socat/socat_${SOCAT_VERSION}_amd64.deb"
          if ! echo "${SOCAT_DEB_SHA256}  ${dl}/socat.deb" | sha256sum --check --strict -; then
            echo "::error title=Audit model::socat's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          sudo dpkg -i "${dl}/bubblewrap.deb" "${dl}/socat.deb"
          test -x /usr/bin/bwrap && test -x /usr/bin/socat
          curl -fsSLo "${dl}/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          if ! echo "${AGE_SHA256}  ${dl}/age.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit model::age's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${dl}" -xzf "${dl}/age.tar.gz" age/age
          install -m 0755 "${dl}/age/age" "${bin}/age"
          echo "${bin}" >> "${GITHUB_PATH}"
          .github/scripts/install-claude-code.sh "${RUNNER_TEMP}/claude-code" "@anthropic-ai/claude-code-linux-x64@${CLAUDE_CODE_PIN_VERSION}" "${CLAUDE_CODE_PIN_INTEGRITY}"
      # The runner sets kernel.apparmor_restrict_unprivileged_userns=1: this profile grants userns to
      # /usr/bin/bwrap alone (ADR 0040, The runner's user-namespace restriction), while sudo still works.
      - name: Load the AppArmor profile for bubblewrap
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apparmor_parser -r .github/security-audit/bwrap.apparmor
      # The wrapper's option analysis assumes GNU coreutils (ADR 0040, round J): every coreutil it runs
      # must be the GNU one.
      - name: Check the GNU coreutils
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for tool in base64 cat cut head od sha256sum sort tail tr uniq wc; do
            version="$("/usr/bin/${tool}" --version)"
            case "${version%%$'\n'*}" in
              *"(GNU coreutils)"*) ;;
              *)
                echo "::error title=Audit model::/usr/bin/${tool} is not GNU coreutils' (ADR 0040, round J): see runbook step 11"
                exit 1
                ;;
            esac
          done
      # main's programs, built offline from the checkout: the wrapper, installed root-owned with mode
      # 0555 (rounds H and L), the launcher and the artifact check. The audit directory is made here,
      # outside /home, while sudo still works: /srv and /srv/audit and bin/ root-owned, the work and state
      # areas the runner's, as the launcher writes them.
      - name: Build and install the audit's command wrapper
        timeout-minutes: 10
        run: |
          set -euo pipefail
          GOFLAGS=-mod=readonly GOPROXY=off go build -trimpath -o "${RUNNER_TEMP}/audit-exec" ./ci/auditexec
          GOFLAGS=-mod=readonly GOPROXY=off go build -trimpath -o "${RUNNER_TEMP}/bin/auditrun" ./ci/auditrun
          GOFLAGS=-mod=readonly GOPROXY=off go build -trimpath -o "${RUNNER_TEMP}/bin/auditpublish" ./ci/auditpublish
          sudo install -d -o root -g root -m 0755 /srv /srv/audit
          sudo install -d -o root -g root -m 0755 /srv/audit/bin
          sudo install -o root -g root -m 0555 "${RUNNER_TEMP}/audit-exec" /srv/audit/bin/audit-exec
          sudo chmod 0555 /srv/audit/bin
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /srv/audit/work /srv/audit/work/tmp /srv/audit/state
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /srv/audit/state/home /srv/audit/state/tmp /srv/audit/state/bin /srv/audit/state/out
      # The artifact check fails closed on an extra, a duplicate, a missing or an expired artifact, and
      # writes the checked artifact's ID and SHA-256 digest to artifact.json: the download is bound to
      # exactly those, and nothing lists the run's artifacts a second time.
      - name: List the run's artifacts and download the checks' ciphertext
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin/auditpublish" artifacts -job model -gh /usr/bin/gh -tmp "${RUNNER_TEMP}"
          artifact="${RUNNER_TEMP}/artifact.json"
          id="$(jq -er '.id' "${artifact}")"
          digest="$(jq -er '.digest' "${artifact}")"
          if [[ ! "${id}" =~ ^[0-9]+$ ]] || [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit model::checks-result has no artifact ID and SHA-256 digest: see runbook step 11"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${RUNNER_TEMP}/checks-result.zip"
          echo "${digest#sha256:}  ${RUNNER_TEMP}/checks-result.zip" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/checks-result"
          unzip -q "${RUNNER_TEMP}/checks-result.zip" -d "${RUNNER_TEMP}/checks-result"
          if [ "$(ls -A "${RUNNER_TEMP}/checks-result")" != checks-result.age ]; then
            echo "::error title=Audit model::checks-result holds more than its ciphertext: see runbook step 11"
            exit 1
          fi
      # The model key's private half reaches age on stdin, never a file. The archive is untrusted: it
      # may hold only directories and regular files under results/, none with a .. element, and it is
      # unpacked into a root-owned directory with every write bit removed.
      - name: Decrypt the checks' results into the audit directory
        timeout-minutes: 5
        env:
          AUDIT_MODEL_PRIVATE_KEY: ${{ secrets.AUDIT_MODEL_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${AUDIT_MODEL_PRIVATE_KEY}" | age --decrypt --identity - --output "${RUNNER_TEMP}/checks.tar" "${RUNNER_TEMP}/checks-result/checks-result.age"
          # Listed into files first: a grep -q that stops reading early would end tar with SIGPIPE, which
          # pipefail would read as no match.
          tar -tvf "${RUNNER_TEMP}/checks.tar" > "${RUNNER_TEMP}/checks.types"
          tar -tf "${RUNNER_TEMP}/checks.tar" > "${RUNNER_TEMP}/checks.names"
          if cut -c1 "${RUNNER_TEMP}/checks.types" | grep -v '^[-d]$' > /dev/null ||
            grep -v '^results/' "${RUNNER_TEMP}/checks.names" > /dev/null ||
            grep -E '(^|/)\.\.(/|$)' "${RUNNER_TEMP}/checks.names" > /dev/null; then
            echo "::error title=Audit model::the checks' results hold an entry outside results/ or one that is no file or directory: see runbook step 11"
            exit 1
          fi
          sudo install -d -o root -g root -m 0755 /srv/audit/checks
          sudo tar -C /srv/audit/checks --no-same-owner --no-same-permissions -xf "${RUNNER_TEMP}/checks.tar"
          sudo chmod -R a-w,a+rX /srv/audit/checks
          # The decrypted archive and its listings live in the audit directory alone.
          rm -f "${RUNNER_TEMP}/checks.tar" "${RUNNER_TEMP}/checks.types" "${RUNNER_TEMP}/checks.names"
          echo "finished"
      # The checkout, .git included, copied whole: the runner's user keeps it, since git refuses a
      # repository another user owns, and the sandbox's write allow list, which names neither tree, is
      # what holds it against its owner (round L).
      - name: Copy the checkout into the audit directory
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /srv/audit/checkout
          cp -a "${GITHUB_WORKSPACE}/." /srv/audit/checkout/
          chmod -R a-w /srv/audit/checkout
      # Model-free, while sudo still works and before the sandbox preflight: no Docker socket, no sudo
      # rule for the runner's user, and the owners the launcher cannot check itself (rounds H and L).
      - name: Stop Docker and remove the runner user's sudo rule
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket
          sudo systemctl disable docker.service docker.socket
          owners="$(stat -c '%U:%G %a %n' /srv /srv/audit /srv/audit/bin /srv/audit/bin/audit-exec /srv/audit/checks)"
          want="$(printf '%s\n' 'root:root 755 /srv' 'root:root 755 /srv/audit' 'root:root 555 /srv/audit/bin' 'root:root 555 /srv/audit/bin/audit-exec' 'root:root 555 /srv/audit/checks')"
          if [ "${owners}" != "${want}" ]; then
            echo "::error title=Sandbox::the audit directory's owners or modes are not as laid out: see runbook step 10"
            exit 1
          fi
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2> /dev/null; then
            echo "::error title=Sandbox::sudo still works: see runbook step 10"
            exit 1
          fi
          if [ -e /var/run/docker.sock ]; then
            echo "::error title=Sandbox::the Docker socket is still there: see runbook step 10"
            exit 1
          fi
      # The launcher refuses managed settings, checks the CLI's tarball against the one pin, checks the
      # audit directory, starts bubblewrap, runs the sandbox preflight and then the audit, whose
      # transcript and stderr stay in /srv/audit/state/out, never in the log. It prints one line. The
      # canary is made here, for this run alone: one in the workflow's text would be in the checkout the
      # model reads. The result bytes the launcher read and checked, exactly those, it writes to a new
      # file under this job's $RUNNER_TEMP, out of the sandbox's reach (-result-out): the encrypt step
      # reads that file, and nothing reads the work area's result again by its path.
      - name: Run the audit in Claude Code's sandbox
        timeout-minutes: 90
        env:
          # The subscription token, in this step alone: the launcher hands the CLI an environment of its
          # own, and the preflight proves no tool call can read it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_PIN_INTEGRITY: ${{ steps.claude-code-pin.outputs.integrity }}
        run: |
          set -euo pipefail
          SHIFT2EU_AUDIT_CANARY="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          export SHIFT2EU_AUDIT_CANARY
          "${RUNNER_TEMP}/bin/auditrun" -claude-tarball "${RUNNER_TEMP}/claude-code/claude-code.tgz" -claude-integrity "${CLAUDE_CODE_PIN_INTEGRITY}" -result-out "${RUNNER_TEMP}/result.json"
      - name: Encrypt the audit's result to the publish key
        timeout-minutes: 5
        env:
          AUDIT_PUBLISH_PUBLIC_KEY: ${{ vars.AUDIT_PUBLISH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          age --encrypt --recipient "${AUDIT_PUBLISH_PUBLIC_KEY}" --output "${RUNNER_TEMP}/model-result.age" "${RUNNER_TEMP}/result.json"
          echo "finished"
      - name: Upload the model's ciphertext
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-result
          path: ${{ runner.temp }}/model-result.age
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || github.triggering_actor == github.repository_owner) }}
    environment: security-audit
    # GITHUB_TOKEN reads only: contents for the checkout, actions for the
    # artifacts, attestations for the image check. The audit App's token writes.
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Check out the audited commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        timeout-minutes: 5
      # gitleaks for the publish job's own scan, age, and main's publish program, built offline once this
      # step's go mod download has fetched go.mod's Go.
      - name: Download the pinned tools and verify their checksums
        timeout-minutes: 10
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks digestVersion=v8.30.1
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          # renovate: datasource=github-releases depName=FiloSottile/age
          AGE_VERSION: v1.3.2
          # renovate: datasource=github-release-attachments depName=FiloSottile/age digestVersion=v1.3.2
          AGE_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/downloads"
          mkdir -p "${bin}" "${dl}"
          curl -fsSLo "${dl}/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          # Each download's checksum check names the tool whose pin it fails and the runbook step that
          # puts it right, so a failed run says why: sha256sum's own line names no cause.
          if ! echo "${GITLEAKS_SHA256}  ${dl}/gitleaks.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit publish::gitleaks's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${bin}" -xzf "${dl}/gitleaks.tar.gz" gitleaks
          curl -fsSLo "${dl}/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          if ! echo "${AGE_SHA256}  ${dl}/age.tar.gz" | sha256sum --check --strict -; then
            echo "::error title=Audit publish::age's checksum differs from its pin: see runbook step 11"
            exit 1
          fi
          tar -C "${dl}" -xzf "${dl}/age.tar.gz" age/age
          install -m 0755 "${dl}/age/age" "${bin}/age"
          go mod download
          GOFLAGS=-mod=readonly GOPROXY=off go build -trimpath -o "${bin}/auditpublish" ./ci/auditpublish
          echo "${bin}" >> "${GITHUB_PATH}"
      # As the model job's download: bound to the ID and digest the artifact check wrote.
      - name: List the run's artifacts and download the model's ciphertext
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin/auditpublish" artifacts -job publish -gh /usr/bin/gh -tmp "${RUNNER_TEMP}"
          artifact="${RUNNER_TEMP}/artifact.json"
          id="$(jq -er '.id' "${artifact}")"
          digest="$(jq -er '.digest' "${artifact}")"
          if [[ ! "${id}" =~ ^[0-9]+$ ]] || [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit publish::model-result has no artifact ID and SHA-256 digest: see runbook step 11"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${RUNNER_TEMP}/model-result.zip"
          echo "${digest#sha256:}  ${RUNNER_TEMP}/model-result.zip" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/model-result"
          unzip -q "${RUNNER_TEMP}/model-result.zip" -d "${RUNNER_TEMP}/model-result"
          if [ "$(ls -A "${RUNNER_TEMP}/model-result")" != model-result.age ]; then
            echo "::error title=Audit publish::model-result holds more than its ciphertext: see runbook step 11"
            exit 1
          fi
      # The publish key's private half reaches age on stdin, never a file. A ciphertext that does not
      # decrypt fails the run here, with nothing written.
      - name: Decrypt the model's result
        timeout-minutes: 5
        env:
          AUDIT_PUBLISH_PRIVATE_KEY: ${{ secrets.AUDIT_PUBLISH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${AUDIT_PUBLISH_PRIVATE_KEY}" | age --decrypt --identity - --output "${RUNNER_TEMP}/result.json" "${RUNNER_TEMP}/model-result/model-result.age"
          echo "finished"
      - name: Check the image digest and its release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin/auditpublish" image -result "${RUNNER_TEMP}/result.json" -gh /usr/bin/gh -tmp "${RUNNER_TEMP}"
      # The image digest is trusted only once gh attestation verify accepts the release workflow's
      # provenance for exactly that digest and tag, its Sigstore signature included (ADR 0040, The image
      # check's residual risk). The result is the model's: its tag and digest are held to their shapes
      # before they reach a command line, the tag's first whatever the digest is. An empty digest is the
      # result's "image not pulled": nothing to verify.
      - name: Verify the image's provenance attestation
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The digest is read as a string alone, and refused unless it is exactly the empty value (the run
          # pulled no image) or one sha256 digest: any other value, a newline in it included, would reach
          # the empty branch below as a not-pulled image otherwise. The step stands alone: it trusts no
          # earlier step to have read the digest.
          if ! digest="$(jq -er '.image_digest | select(type == "string") | select(. == "" or test("^sha256:[0-9a-f]{64}\\z"))' "${RUNNER_TEMP}/result.json")"; then
            echo "::error title=Audit publish::the image digest is no string, no empty value and no sha256 digest: see runbook step 11"
            exit 1
          fi
          tag="$(jq -er '.release_tag' "${RUNNER_TEMP}/result.json")"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Audit publish::the tag's shape is no vMAJOR.MINOR.PATCH: see runbook step 11"
            exit 1
          fi
          if [ -z "${digest}" ]; then
            echo "image not pulled: no provenance attestation to verify"
            exit 0
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Audit publish::the image digest is no sha256 digest: see runbook step 11"
            exit 1
          fi
          if ! gh attestation verify "oci://${image}@${digest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${tag}" \
            --deny-self-hosted-runners > /dev/null; then
            echo "::error title=Audit publish::the image has no provenance attestation from the release workflow at that tag: see runbook step 11"
            exit 1
          fi
          echo "image provenance: as expected"
      # gitleaks over the text about to be sent, on stdin, ignoring any allow comment in it, before the
      # App's token is minted: a result it refuses has no write token minted for it. The publish program
      # scans every text it renders again before its first write.
      - name: Scan the text it is about to publish
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! gitleaks stdin --ignore-gitleaks-allow --redact --no-banner --log-level error < "${RUNNER_TEMP}/result.json" > /dev/null 2>&1; then
            echo "::error title=Audit publish::gitleaks refused the result: see runbook step 11"
            exit 1
          fi
      # The audit App's token, minted here alone and narrowed to Decision 1's four permissions.
      - name: Mint the audit App's token
        timeout-minutes: 5
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUDIT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-security-events: write
      - name: Publish the report
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUDIT_FINGERPRINT_KEY: ${{ secrets.AUDIT_FINGERPRINT_KEY }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin/auditpublish" publish -result "${RUNNER_TEMP}/result.json" -reports docs/security/audits -gh /usr/bin/gh -gitleaks "${RUNNER_TEMP}/bin/gitleaks" -tmp "${RUNNER_TEMP}"
